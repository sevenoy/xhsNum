  <!-- 登录检查 -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    
    // ✅ 初始化全局变量，确保在页面加载时就有值
    window.currentUser = null;
    window.isAdmin = false;
    
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      // ✅ 检查 URL 参数，如果有 logout 参数，说明是从登录页跳转过来的，直接跳转回登录页
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout')) {
        window.location.href = 'login.html';
        return;
      }
      
      // ✅ 检查是否有退出标志（从 sessionStorage 检查）
      const isLoggingOut = sessionStorage.getItem('xhs_logging_out') === 'true';
      if (isLoggingOut) {
        // 正在退出，清除退出标志并跳转到登录页
        sessionStorage.removeItem('xhs_logging_out');
        // 清除所有登录相关的 localStorage
        localStorage.removeItem('xhs_user_name');
        localStorage.removeItem('xhs_user_id');
        localStorage.removeItem('xhs_user_email');
        localStorage.removeItem('xhs_user_role');
        localStorage.removeItem('xhs_is_admin');
        localStorage.removeItem('xhs_remember_me');
        localStorage.removeItem('xhs_remembered_username');
        localStorage.removeItem('xhs_last_login');
        // 清除 Supabase session
        try {
          await supabase.auth.signOut();
          // ✅ 等待一下，确保 session 已清除
          await new Promise(resolve => setTimeout(resolve, 100));
        } catch (err) {
          console.error('清除 session 失败:', err);
        }
        window.location.href = 'login.html?logout=' + Date.now();
        return;
      }
      
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // 未登录，跳转到登录页
        window.location.href = 'login.html';
      } else {
        // 已登录，从 user_profiles 查询用户信息
        try {
          const { data: profile, error } = await supabase
            .from('user_profiles')
            .select('*')
            .eq('user_id', session.user.id)
            .single();
          
          if (profile) {
            // 从数据库获取用户信息
            window.currentUser = {
              id: session.user.id,
              email: profile.email,
              name: profile.username
            };
            
            localStorage.setItem('xhs_user_name', profile.username);
            localStorage.setItem('xhs_user_id', session.user.id);
            localStorage.setItem('xhs_user_email', profile.email);
            localStorage.setItem('xhs_user_role', profile.role || 'basic');
            
            // 检查是否是管理员
            const isAdmin = profile.role === 'super_admin' || profile.username === 'sevenoy';
            window.isAdmin = isAdmin;
            localStorage.setItem('xhs_is_admin', isAdmin ? 'true' : 'false');
            
            console.log('✅ 用户信息已加载:', { 
              username: profile.username, 
              role: profile.role, 
              isAdmin: isAdmin 
            });
          } else {
            // 如果查询失败，使用 session 中的信息
            const username = session.user.user_metadata?.username || 
                            localStorage.getItem('xhs_user_name') || 
                            session.user.email.split('@')[0];
            
            window.currentUser = {
              id: session.user.id,
              email: session.user.email,
              name: username
            };
            
            localStorage.setItem('xhs_user_name', username);
            localStorage.setItem('xhs_user_id', session.user.id);
            
            // 默认不是管理员
            window.isAdmin = false;
            localStorage.setItem('xhs_is_admin', 'false');
          }
        } catch (err) {
          console.error('查询用户信息失败:', err);
          // 降级处理：使用 session 信息或 localStorage
          const username = session.user.user_metadata?.username || 
                          localStorage.getItem('xhs_user_name') || 
                          session.user.email.split('@')[0];
          
          window.currentUser = {
            id: session.user.id,
            email: session.user.email,
            name: username
          };
          
          // ✅ 从 localStorage 恢复管理员权限
          window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
          console.log('⚠️ 使用降级方案，从 localStorage 恢复管理员权限:', window.isAdmin);
        }
        
        // ✅ 用户信息加载完成后，立即更新用户名显示（针对桌面书签打开的情况）
        // 使用 requestAnimationFrame 确保 DOM 已准备好
        requestAnimationFrame(() => {
          const currentUserNameEl = document.getElementById('currentUserName');
          if (currentUserNameEl && window.currentUser) {
            const userName = window.currentUser.name || localStorage.getItem('xhs_user_name');
            if (userName && userName !== '匿名用户') {
              currentUserNameEl.textContent = `👤 ${userName}`;
              currentUserNameEl.style.display = 'inline-block';
              currentUserNameEl.style.visibility = 'visible';
              currentUserNameEl.style.opacity = '1';
              console.log('✅ 立即更新用户名显示:', userName);
            }
          }
        });
      }
    } else {
      // 如果没有 Supabase 配置，从 localStorage 恢复
      const username = localStorage.getItem('xhs_user_name');
      if (username) {
        window.currentUser = {
          id: localStorage.getItem('xhs_user_id') || 'anonymous',
          email: localStorage.getItem('xhs_user_email') || '',
          name: username
        };
        window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
      }
    }
    
    // ✅ 确保在页面加载完成后，管理员权限和用户名显示已经设置
    window.addEventListener('DOMContentLoaded', () => {
      // 恢复管理员权限
      if (!window.isAdmin && localStorage.getItem('xhs_is_admin') === 'true') {
        window.isAdmin = true;
        console.log('✅ DOMContentLoaded: 从 localStorage 恢复管理员权限');
      }
      
      // ✅ 恢复用户信息（针对桌面书签打开的情况）
      if (!window.currentUser) {
        const storedName = localStorage.getItem('xhs_user_name');
        const storedId = localStorage.getItem('xhs_user_id');
        const storedEmail = localStorage.getItem('xhs_user_email');
        
        if (storedName && storedId) {
          window.currentUser = {
            id: storedId,
            email: storedEmail || '',
            name: storedName
          };
          console.log('✅ DOMContentLoaded: 从 localStorage 恢复用户信息', window.currentUser);
        }
      }
      
      // ✅ 立即更新用户名显示
      const currentUserNameEl = document.getElementById('currentUserName');
      if (currentUserNameEl) {
        const userName = window.currentUser?.name || localStorage.getItem('xhs_user_name');
        if (userName && userName !== '匿名用户') {
          currentUserNameEl.textContent = `👤 ${userName}`;
          currentUserNameEl.style.display = 'inline-block';
          currentUserNameEl.style.visibility = 'visible';
          currentUserNameEl.style.opacity = '1';
          console.log('✅ DOMContentLoaded: 更新用户名显示', userName);
        }
      }
    });
  </script>

  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker 注册和自动更新检测 -->
  <script>
    // ✅ 应用版本号 - 每次更新代码时修改这个版本号
    // 格式：V + 年月日（6位） + . + 版本更改号
    // 例如：V251213.8 表示 2025年12月13日第8次更新
    const APP_VERSION = 'V251213.14';
    
    // ✅ 兼容性处理：清除旧格式的版本号记录（从 20251212.8 格式迁移到 V251213.8）
    // 确保更新提示能正常显示（针对 iPhone X 等设备）
    try {
      const lastShownVersion = localStorage.getItem('update_notification_shown');
      if (lastShownVersion && !lastShownVersion.startsWith('V')) {
        console.log('🔄 检测到旧版本号格式，清除旧记录:', lastShownVersion);
        localStorage.removeItem('update_notification_shown');
      }
    } catch (e) {
      console.warn('清除旧版本号记录失败:', e);
    }
    
    // ✅ 在标题后显示版本号（立即执行，不等待DOMContentLoaded）
    (function() {
      const versionEl = document.getElementById('appVersion');
      if (versionEl) {
        versionEl.textContent = `v${APP_VERSION}`;
      }
    })();
    
    // ✅ 将版本号暴露到全局，供 app.js 使用
    window.APP_VERSION = APP_VERSION;

    // ✅ Service Worker 注册
    if ('serviceWorker' in navigator) {
      let registration = null;
      let updateCheckInterval = null;

      // 注册 Service Worker（添加版本号和时间戳查询参数，确保浏览器能检测到文件变化）
      // ✅ 使用时间戳确保每次都能获取最新版本
      // ✅ 强制清除旧版本缓存（针对版本号格式变化的情况）
      // ✅ 针对安卓设备：添加随机参数强制刷新
      const swUrl = './sw.js?v=' + APP_VERSION + '&t=' + Date.now() + '&nocache=' + Math.random() + '&force=' + Math.random();
      navigator.serviceWorker.register(swUrl, {
        scope: './',
        updateViaCache: 'none' // ✅ 禁用 Service Worker 脚本的 HTTP 缓存
      }).then((reg) => {
        registration = reg;
        console.log('✅ Service Worker 注册成功，版本:', APP_VERSION);
        console.log('✅ Service Worker URL:', swUrl);

        // ✅ 立即检查更新
        checkForUpdate(reg);

        // ✅ 监听 Service Worker 更新（改进检测逻辑）
        reg.addEventListener('updatefound', () => {
          console.log('🔄 发现新的 Service Worker 版本');
          const newWorker = reg.installing;
          
          if (!newWorker) {
            console.warn('⚠️ 未找到 installing 的 Service Worker');
            return;
          }
          
          // ✅ 监听多个状态，确保能捕获到更新
          newWorker.addEventListener('statechange', () => {
            console.log('🔄 Service Worker 状态变化:', newWorker.state);
            
            // ✅ 改进：检查多个状态，包括 installed 和 activating
            if (newWorker.state === 'installed') {
              if (navigator.serviceWorker.controller) {
                // 有旧版本在运行，新版本已安装，提示更新
                console.log('✅ 新版本已安装，等待激活');
                // ✅ 清除旧格式版本号记录（兼容性处理，针对 iPhone X）
                const lastShown = localStorage.getItem('update_notification_shown');
                if (lastShown && !lastShown.startsWith('V')) {
                  console.log('🔄 清除旧格式版本号记录:', lastShown);
                  localStorage.removeItem('update_notification_shown');
                }
                showUpdateNotification();
              } else {
                // 首次安装，直接激活
                console.log('✅ 首次安装 Service Worker');
              }
            } else if (newWorker.state === 'activating') {
              // ✅ 如果直接进入 activating 状态（由于 skipWaiting），也触发更新
              if (navigator.serviceWorker.controller) {
                console.log('✅ 新版本正在激活');
                // 延迟一下，确保状态稳定
                setTimeout(() => {
                  if (reg.waiting || reg.installing) {
                    // ✅ 清除旧格式版本号记录（兼容性处理，针对 iPhone X）
                    const lastShown = localStorage.getItem('update_notification_shown');
                    if (lastShown && !lastShown.startsWith('V')) {
                      console.log('🔄 清除旧格式版本号记录:', lastShown);
                      localStorage.removeItem('update_notification_shown');
                    }
                    showUpdateNotification();
                  }
                }, 100);
              }
            } else if (newWorker.state === 'activated') {
              // ✅ 如果新版本已激活，检查是否是手动刷新（用户点击确定按钮）
              // 如果是手动刷新，不显示更新提示，避免刷新循环
              const isManualRefresh = sessionStorage.getItem('sw_manual_refresh') === 'true';
              if (isManualRefresh) {
                console.log('✅ 新版本已激活（手动刷新），跳过显示更新提示');
                return;
              }
              
              if (navigator.serviceWorker.controller) {
                console.log('✅ 新版本已激活');
                // 不在这里显示更新提示，等待 controllerchange 或用户操作
              }
            }
          });
          
          // ✅ 注意：不在这里自动刷新，等待用户点击确定按钮
          // 如果新 Worker 直接激活了（skipWaiting 导致），会在全局 controllerchange 监听器中处理
        });

        // ✅ 定期检查更新（每5分钟）
        updateCheckInterval = setInterval(() => {
          console.log('⏰ 定时检查更新（每5分钟）');
          checkForUpdate(reg);
        }, 5 * 60 * 1000);

        // ✅ 页面可见时检查更新
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && reg) {
            console.log('👁️ 页面可见，检查更新');
            checkForUpdate(reg);
          }
        });
        
        // ✅ 页面加载完成后立即检查更新
        window.addEventListener('load', () => {
          console.log('📄 页面加载完成，立即检查更新');
          // ✅ 延迟检查，确保 Service Worker 已完全初始化
          setTimeout(() => {
            checkForUpdate(reg);
          }, 500);
        });
        
        // ✅ 页面首次加载时强制检查（针对不同设备的缓存问题）
        // 增加多个检查时机，确保所有设备都能检测到更新
        setTimeout(() => {
          console.log('⏰ 延迟强制检查更新（1秒后）');
          checkForUpdate(reg);
        }, 1000);
        
        // ✅ 额外检查：2秒后再次检查（针对某些设备可能延迟检测的情况）
        setTimeout(() => {
          console.log('⏰ 延迟强制检查更新（2秒后）');
          checkForUpdate(reg);
        }, 2000);
        
        // ✅ 额外检查：5秒后再次检查（针对某些设备可能延迟检测的情况）
        setTimeout(() => {
          console.log('⏰ 延迟强制检查更新（5秒后）');
          checkForUpdate(reg);
        }, 5000);
        
        // ✅ 额外检查：10秒后再次检查（针对 iPhone X 等设备可能延迟检测的情况）
        setTimeout(() => {
          console.log('⏰ 延迟强制检查更新（10秒后）');
          checkForUpdate(reg);
        }, 10000);
      }).catch((err) => {
        console.error('❌ Service Worker 注册失败:', err);
      });

      // ✅ 检查更新函数（增强版 - 强制检测版本变化）
      async function checkForUpdate(reg) {
        if (!reg) {
          console.warn('⚠️ Service Worker 注册对象不存在');
          return;
        }
        
        try {
          // ✅ 强制更新检查（忽略缓存）
          await reg.update();
          console.log('✅ 更新检查完成');
          
          // ✅ 延迟检查，确保状态已更新（增加延迟时间，确保不同设备都能检测到）
          await new Promise(resolve => setTimeout(resolve, 300));
          
          // ✅ 检查是否有等待中的新版本
          if (reg.waiting) {
            console.log('🔄 发现等待中的新版本');
            // ✅ 清除旧格式版本号记录（兼容性处理，针对 iPhone X）
            const lastShown = localStorage.getItem('update_notification_shown');
            if (lastShown && !lastShown.startsWith('V')) {
              console.log('🔄 清除旧格式版本号记录:', lastShown);
              localStorage.removeItem('update_notification_shown');
            }
            showUpdateNotification();
            return;
          }
          
          // ✅ 检查是否有正在安装的新版本
          if (reg.installing) {
            console.log('🔄 发现正在安装的新版本');
            // 等待安装完成后再显示通知
            reg.installing.addEventListener('statechange', () => {
              if (reg.installing && reg.installing.state === 'installed' && navigator.serviceWorker.controller) {
                // ✅ 清除旧格式版本号记录（兼容性处理，针对 iPhone X）
                const lastShown = localStorage.getItem('update_notification_shown');
                if (lastShown && !lastShown.startsWith('V')) {
                  console.log('🔄 清除旧格式版本号记录:', lastShown);
                  localStorage.removeItem('update_notification_shown');
                }
                showUpdateNotification();
              }
            });
          }
          
          // ✅ 检查当前 Service Worker 的版本（通过 fetch 获取 sw.js 内容）
          // 这是最重要的检测方式，确保所有设备都能检测到版本变化
          try {
            // ✅ 强制清除缓存，确保获取最新版本（针对安卓和某些设备）
            // ✅ 添加多个随机参数，强制绕过所有可能的缓存
            const cacheBuster = Date.now() + '_' + Math.random() + '_' + Math.random();
            const swResponse = await fetch('./sw.js?v=' + APP_VERSION + '&t=' + cacheBuster + '&nocache=' + Math.random() + '&force=' + Math.random(), {
              cache: 'no-store',
              headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
              }
            });
            if (swResponse.ok) {
              const swText = await swResponse.text();
              // ✅ 兼容新旧版本号格式（支持 V251213.8 和 20251212.8）
              const versionMatch = swText.match(/const VERSION = ['"]([^'"]+)['"]/) || 
                                   swText.match(/VERSION\s*=\s*['"]([^'"]+)['"]/);
              if (versionMatch) {
                const serverVersion = versionMatch[1];
                console.log('🔍 版本检查:', { 
                  current: APP_VERSION, 
                  server: serverVersion,
                  match: serverVersion === APP_VERSION
                });
                
                // ✅ 如果版本不匹配，显示更新提示
                if (serverVersion !== APP_VERSION) {
                  console.log('🔄 检测到版本不匹配，显示更新提示');
                  // ✅ 清除旧格式的版本号记录（兼容性处理）
                  const lastShown = localStorage.getItem('update_notification_shown');
                  if (lastShown && !lastShown.startsWith('V')) {
                    console.log('🔄 清除旧格式版本号记录:', lastShown);
                    localStorage.removeItem('update_notification_shown');
                  }
                  showUpdateNotification();
                } else {
                  // ✅ 版本匹配，但也要检查是否有等待中的更新（针对某些设备）
                  if (reg.waiting) {
                    console.log('🔄 发现等待中的新版本（版本匹配但 Service Worker 未激活）');
                    // ✅ 清除旧格式版本号记录（兼容性处理）
                    const lastShown = localStorage.getItem('update_notification_shown');
                    if (lastShown && !lastShown.startsWith('V')) {
                      console.log('🔄 清除旧格式版本号记录:', lastShown);
                      localStorage.removeItem('update_notification_shown');
                    }
                    showUpdateNotification();
                  } else {
                    // ✅ 即使版本匹配，也检查当前 Service Worker 的版本
                    // 某些设备可能 Service Worker 已经更新但页面版本号还没更新
                    if (navigator.serviceWorker.controller) {
                      try {
                        // 尝试从当前 Service Worker 获取版本信息
                        const controllerVersion = await navigator.serviceWorker.controller.scriptURL;
                        console.log('🔍 当前 Service Worker URL:', controllerVersion);
                        // ✅ 如果 URL 中包含不同的版本号，也可能需要更新
                        // 检查 URL 中是否包含旧格式的版本号
                        if (controllerVersion && !controllerVersion.includes(APP_VERSION)) {
                          console.log('🔄 Service Worker URL 中版本号不匹配，可能需要更新');
                          // ✅ 清除旧格式版本号记录
                          const lastShown = localStorage.getItem('update_notification_shown');
                          if (lastShown && !lastShown.startsWith('V')) {
                            console.log('🔄 清除旧格式版本号记录:', lastShown);
                            localStorage.removeItem('update_notification_shown');
                          }
                        }
                      } catch (err) {
                        console.warn('⚠️ 无法获取当前 Service Worker 信息:', err);
                      }
                    }
                  }
                }
              } else {
                console.warn('⚠️ 无法从 sw.js 中解析版本号');
              }
            } else {
              console.warn('⚠️ 无法获取 sw.js 文件:', swResponse.status);
            }
          } catch (err) {
            console.warn('⚠️ 检查 Service Worker 版本失败:', err);
          }
        } catch (err) {
          console.warn('⚠️ 更新检查失败:', err);
        }
      }

      // ✅ 显示更新通知（改进版：显示更新内容）
      async function showUpdateNotification() {
        // ✅ 检查是否是手动刷新（用户点击确定按钮），如果是则不显示提示
        const isManualRefresh = sessionStorage.getItem('sw_manual_refresh') === 'true';
        if (isManualRefresh) {
          console.log('⚠️ 检测到手动刷新标志，跳过显示更新提示');
          return;
        }
        
        // ✅ 如果正在刷新，不显示提示
        if (refreshing) {
          console.log('⚠️ 正在刷新中，跳过显示更新提示');
          return;
        }
        
        // ✅ 检查是否已经有提示框在显示（优先检查，防止重复创建）
        if (document.getElementById('updateOverlay')) {
          console.log('⚠️ 更新提示框已显示，跳过重复显示');
          return;
        }
        
        // ✅ 检查是否已经显示过通知（但允许同一版本多次显示，如果用户刷新了页面）
        const lastShownVersion = localStorage.getItem('update_notification_shown');
        // ✅ 兼容旧版本号格式：如果 localStorage 中是旧格式（如 20251212.8），清除它
        if (lastShownVersion && !lastShownVersion.startsWith('V')) {
          console.log('🔄 检测到旧版本号格式，清除旧记录:', lastShownVersion);
          localStorage.removeItem('update_notification_shown');
        }
        // 如果已经显示过当前版本，且用户已经点击了确定，则不重复显示
        // 但如果版本号变化了，一定会显示
        const currentLastShown = localStorage.getItem('update_notification_shown');
        if (currentLastShown === APP_VERSION && pendingUpdate === false) {
          console.log('✅ 当前版本已显示过更新提示，跳过');
          return;
        }
        
        // ✅ 标记有待处理的更新（在检查之后设置，防止重复）
        pendingUpdate = true;

        // ✅ 从更新日志文件读取更新内容
        let updateInfo = {
          title: '发现新版本',
          content: ['本次更新包含了一些改进和修复']
        };

        try {
          // ✅ 添加时间戳，确保获取最新文件（强制清除缓存）
          const response = await fetch('./update-log.json?v=' + APP_VERSION + '&t=' + Date.now() + '&nocache=' + Math.random(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });
          if (response.ok) {
            const updateLog = await response.json();
            // ✅ 兼容新旧版本号格式
            if (updateLog[APP_VERSION]) {
              updateInfo = updateLog[APP_VERSION];
            } else {
              // 如果新格式找不到，尝试查找旧格式（兼容性处理）
              console.warn('⚠️ 未找到新格式版本号，尝试查找旧格式');
            }
          }
        } catch (err) {
          console.warn('⚠️ 无法加载更新日志:', err);
        }

        // ✅ 创建遮罩层
        const overlay = document.createElement('div');
        overlay.id = 'updateOverlay'; // ✅ 添加ID，用于检查是否已显示
        overlay.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          touch-action: none;
          -webkit-overflow-scrolling: touch;
        `;

        // ✅ 创建更新提示框（居中显示）
        const notification = document.createElement('div');
        notification.style.cssText = `
          background: white;
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.3);
          max-width: 90%;
          max-height: 80vh;
          overflow-y: auto;
          z-index: 100000;
          position: relative;
          animation: slideIn 0.3s ease;
          touch-action: pan-y;
          -webkit-overflow-scrolling: touch;
        `;
        
        notification.innerHTML = `
          <div style="padding: 24px; text-align: center;">
            <div style="font-size: 32px; margin-bottom: 16px;">🔄</div>
            <div style="font-size: 20px; font-weight: 600; color: #333; margin-bottom: 8px;">
              ${updateInfo.title || '发现新版本'}
            </div>
            <div style="font-size: 14px; color: #666; margin-bottom: 20px;">
              版本 ${APP_VERSION} • ${updateInfo.date || new Date().toISOString().split('T')[0]}
            </div>
            <div style="
              background: #f5f5f5;
              border-radius: 12px;
              padding: 16px;
              margin-bottom: 24px;
              text-align: left;
              max-height: 300px;
              overflow-y: auto;
            ">
              <div style="font-size: 14px; color: #333; line-height: 1.8;">
                ${updateInfo.content ? updateInfo.content.map(item => `<div style="margin-bottom: 8px;">${item}</div>`).join('') : '本次更新包含了一些改进和修复'}
              </div>
            </div>
            <button id="btnUpdateConfirm" style="
              background: #1990FF;
              color: white;
              border: none;
              padding: 16px 32px;
              border-radius: 8px;
              font-weight: 600;
              cursor: pointer;
              font-size: 16px;
              width: 100%;
              max-width: 200px;
              min-height: 48px;
              transition: background 0.2s;
              -webkit-tap-highlight-color: transparent;
              touch-action: manipulation;
              user-select: none;
              -webkit-user-select: none;
              pointer-events: auto;
              z-index: 100001;
              position: relative;
            " onmouseover="this.style.background='#1580E0'" onmouseout="this.style.background='#1990FF'">
              确定
            </button>
          </div>
        `;

        overlay.appendChild(notification);
        document.body.appendChild(overlay);

        // ✅ 等待 DOM 更新后再绑定事件
        await new Promise(resolve => setTimeout(resolve, 100));
        
        const btnUpdateConfirm = document.getElementById('btnUpdateConfirm');
        if (!btnUpdateConfirm) {
          console.error('❌ 未找到确定按钮');
          return;
        }

        // ✅ 确定按钮点击事件（支持移动端触摸）
        const handleConfirm = async (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          // ✅ 防止重复点击
          if (btnUpdateConfirm.disabled) {
            return;
          }
          
          btnUpdateConfirm.disabled = true;
          btnUpdateConfirm.textContent = '更新中...';
          btnUpdateConfirm.style.opacity = '0.7';
          btnUpdateConfirm.style.pointerEvents = 'none';

          try {
            // ✅ 立即移除提示框，防止重复显示
            if (overlay && overlay.parentNode) {
              overlay.remove();
            }
            
            // 记录已显示通知（在刷新前记录，避免重复显示）
            localStorage.setItem('update_notification_shown', APP_VERSION);
            
            // ✅ 标记正在刷新（使用 sessionStorage 持久化，防止刷新循环）
            refreshing = true;
            pendingUpdate = false;
            
            // ✅ 设置手动刷新标志，防止 controllerchange 触发自动刷新
            sessionStorage.setItem('sw_manual_refresh', 'true');
            sessionStorage.setItem('sw_refreshing', 'true');
            sessionStorage.setItem('sw_refresh_time', Date.now().toString());

            // 通知 Service Worker 跳过等待
            if (registration && registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            // ✅ 清除所有缓存（强制清除，确保获取最新代码）
            if (registration) {
              try {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                console.log('✅ 所有缓存已清除');
              } catch (err) {
                console.warn('⚠️ 清除缓存失败:', err);
              }
            }
            
            // ✅ 额外清除：强制清除所有可能的缓存（针对安卓设备）
            try {
              if ('caches' in window) {
                const allCacheNames = await caches.keys();
                for (const cacheName of allCacheNames) {
                  await caches.delete(cacheName);
                }
                console.log('✅ 额外缓存清除完成');
              }
            } catch (err) {
              console.warn('⚠️ 额外缓存清除失败:', err);
            }

            // ✅ 延迟一小段时间，确保标志已设置，然后刷新
            // 使用 setTimeout 确保 sessionStorage 已写入
            setTimeout(() => {
              window.location.reload();
            }, 50);
          } catch (err) {
            console.error('更新失败:', err);
            alert('更新失败，请手动刷新页面');
            refreshing = false;
            pendingUpdate = false;
            if (overlay && overlay.parentNode) {
              overlay.remove();
            }
          }
        };
        
        // ✅ 绑定多种事件，确保移动端和桌面端都能响应
        btnUpdateConfirm.addEventListener('click', handleConfirm);
        btnUpdateConfirm.addEventListener('touchend', (e) => {
          e.preventDefault();
          handleConfirm(e);
        });

        // ✅ 点击遮罩层不关闭，必须点击确定按钮才能更新
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            // 点击遮罩层不关闭，必须点击确定按钮
            e.stopPropagation();
            e.preventDefault();
          }
        });
        
        // ✅ 防止触摸事件穿透
        overlay.addEventListener('touchstart', (e) => {
          if (e.target === overlay) {
            e.stopPropagation();
          }
        });
        
        overlay.addEventListener('touchmove', (e) => {
          if (e.target === overlay) {
            e.stopPropagation();
          }
        });
        
        // ✅ 防止提示框被意外移除
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.type === 'childList') {
              mutation.removedNodes.forEach((node) => {
                if (node === overlay || (node.nodeType === 1 && node.contains(overlay))) {
                  console.warn('⚠️ 更新提示框被意外移除，重新添加');
                  if (!document.getElementById('updateOverlay')) {
                    document.body.appendChild(overlay);
                  }
                }
              });
            }
          });
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      }

      // ✅ 监听 Service Worker 控制权变化
      // 注意：不自动刷新，等待用户点击更新提示框的"确定"按钮后再刷新
      let refreshing = false;
      let pendingUpdate = false; // ✅ 标记是否有待处理的更新
      
      // ✅ 页面加载时，检查是否有待处理的刷新（防止刷新循环）
      const swRefreshing = sessionStorage.getItem('sw_refreshing');
      const swRefreshTime = sessionStorage.getItem('sw_refresh_time');
      const swManualRefresh = sessionStorage.getItem('sw_manual_refresh');
      
      if (swRefreshing === 'true' && swRefreshTime) {
        const refreshTime = parseInt(swRefreshTime, 10);
        const now = Date.now();
        // ✅ 如果刷新标志存在且是最近 10 秒内设置的，清除它（说明刷新已完成）
        if (now - refreshTime < 10000) {
          sessionStorage.removeItem('sw_refreshing');
          sessionStorage.removeItem('sw_refresh_time');
          if (swManualRefresh === 'true') {
            sessionStorage.removeItem('sw_manual_refresh');
          }
          console.log('✅ 检测到刷新标志，已清除（防止循环刷新）');
        }
      }
      
      // ✅ 完全禁用 controllerchange 的自动刷新，只允许手动刷新
      // 这样可以防止刷新循环，所有刷新都通过用户点击确定按钮触发
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        const isRefreshing = sessionStorage.getItem('sw_refreshing') === 'true';
        const isManualRefresh = sessionStorage.getItem('sw_manual_refresh') === 'true';
        
        // ✅ 如果是手动刷新（用户点击确定按钮），不处理 controllerchange
        if (isManualRefresh || isRefreshing) {
          console.log('⚠️ 检测到手动刷新标志，跳过 controllerchange 自动刷新');
          return;
        }
        
        // ✅ 完全禁用自动刷新，只记录日志
        // 所有刷新都通过用户点击确定按钮触发，避免刷新循环
        console.log('🔄 Service Worker 已更新（controllerchange），等待用户确认后刷新');
        // 不执行任何刷新操作
      });
      
      // ✅ 页面加载时立即检查是否有等待中的更新（已在上面处理，这里保留作为备用）
      // 注意：这个监听器在 Service Worker 注册成功后也会执行
    } else {
      console.warn('⚠️ 浏览器不支持 Service Worker');
    }

    // ✅ 添加动画样式
    if (!document.querySelector('style[data-update-animation]')) {
      const style = document.createElement('style');
      style.setAttribute('data-update-animation', 'true');
      style.textContent = `
        @keyframes slideIn {
          from { 
            opacity: 0; 
            transform: scale(0.9) translateY(-20px); 
          }
          to { 
            opacity: 1; 
            transform: scale(1) translateY(0); 
          }
        }
        @keyframes fadeOut {
          from { opacity: 1; transform: translateX(-50%) translateY(0); }
          to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
      `;
      document.head.appendChild(style);
    }
  </script>
</body>
</html>
