<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>XHSPHONE 号码管理</title>

  <!-- 关键：加载样式 -->
  <link rel="stylesheet" href="style.css">

  <!-- 图标全部从 /icon 目录读取 -->
  <link rel="icon" type="image/x-icon" href="icon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon/icon-512.png">
  <link rel="manifest" href="site.webmanifest">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 id="appTitle">XHSPHONE</h1>
      <div class="app-subtitle">
        <span>Base 数据连接：<span id="baseStatus">未知</span></span>
      </div>
    </header>

    <!-- 工具栏 -->
    <section class="toolbar">
      <div class="toolbar-row">
        <input id="searchInput" class="field" placeholder="搜索：任意关键词">
        <button id="btnSearchMode" class="btn ghost">当前：模糊搜索</button>

        <select id="filterOwner" class="field">
          <option value="all">所属人：全部</option>
        </select>
        <select id="filterWxReal" class="field">
          <option value="all">微信实名人：全部</option>
        </select>
        <select id="sortBy" class="field">
          <option value="order">排序：手动</option>
          <option value="owner">排序：所属人</option>
          <option value="wx_real">排序：微信实名人</option>
          <option value="phone">排序：电话号码</option>
          <option value="xhs_name">排序：小红书名称</option>
        </select>
      </div>

      <div class="toolbar-row">
        <button id="btnAddRow" class="btn primary">新增一行</button>

        <label class="btn ghost">
          导入数据
          <input id="fileImport" type="file" accept=".csv" hidden>
        </label>

        <button id="btnExport" class="btn ghost">导出数据</button>

        <button id="btnSaveCloud" class="btn ghost">保存云端</button>
        <button id="btnLoadCloud" class="btn ghost cloud-btn">
          云端加载
          <select id="cloudHistory" class="cloud-select"></select>
        </button>

        <button id="btnClearAll" class="btn ghost danger">清空全部</button>
        <button id="btnCats" class="btn ghost">分类设置</button>
        <button id="btnView" class="btn ghost">显示设置</button>
      </div>

      <p class="hint-text">
        本地 + Supabase 模式：支持 CSV 导入/导出，支持云端快照备份（最多保留 5 个历史版本，支持自定义快照名称）。
      </p>
    </section>

    <!-- 分类设置 -->
    <section id="catsPanel" class="panel hidden">
      <h2>分类设置</h2>
      <div class="cats-new">
        <input id="newCatName" class="field" placeholder="分类名称，例如：Olina用">
        <input id="newCatColor" class="field color" type="color" value="#007aff">
        <button id="btnAddCat" class="btn primary">新增分类</button>
      </div>
      <div id="catsList" class="cats-list"></div>
    </section>

    <!-- 显示设置 -->
    <section id="viewPanel" class="panel hidden">
      <h2>显示设置</h2>

      <div class="view-row">
        <label>行高
          <input id="viewPad" type="range" min="4" max="14">
        </label>

        <label>列宽缩放
          <input id="viewColScale" type="range" min="0.7" max="1.4" step="0.05">
        </label>

        <label class="checkbox">
          <input id="viewZebra" type="checkbox">
          隔行着色
        </label>

        <label class="view-color">
          颜色
          <input id="viewZebraColor" type="color">
        </label>
      </div>

      <div class="view-row">
        <label>字体
          <select id="viewFont" class="field">
            <option value="-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif">系统默认（推荐）</option>
            <option value="&quot;SF Pro Text&quot;, -apple-system, BlinkMacSystemFont, Arial, sans-serif">SF Pro 风格</option>
            <option value="&quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, Arial, sans-serif">苹方</option>
            <option value="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif">System UI</option>
          </select>
        </label>

        <label>标题文字
          <input id="viewTitleText" class="field" placeholder="例如：XHSPHONE">
        </label>

        <label>标题颜色
          <input id="viewTitleColor" class="field color" type="color" value="#111111">
        </label>
      </div>
    </section>

    <!-- 桌面表格 -->
    <section class="grid-wrapper desktop-only">
      <table class="data-grid">
        <thead>
          <tr>
            <th style="width:160px">电话号码</th>
            <th style="width:120px">所属人</th>
            <th style="width:120px">微信实名人</th>
            <th style="width:160px">对应微信名</th>
            <th style="width:340px">小红书名称</th>
            <th style="width:220px">备注</th>
            <th style="width:140px">分类</th>
            <th style="width:220px">操作</th>
          </tr>
        </thead>
        <tbody id="gridBody"></tbody>
      </table>
      <div id="emptyHint" class="empty-hint hidden">
        暂无数据，点击“新增一行”添加账号。
      </div>
    </section>

    <!-- 手机端列表 -->
    <section class="mobile-list mobile-only">
      <div id="mobileList"></div>
    </section>
  </div>

  <!-- Dexie (IndexedDB) -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  <!-- 应用逻辑 -->
  <script type="module" src="app.js"></script>
</body>
</html>
