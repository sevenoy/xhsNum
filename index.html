<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />

  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-touch-icon.png?v=20251107">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="icon" type="image/x-icon" href="./icon/favicon.ico?v=20251107">
  <link rel="shortcut icon" href="./icon/favicon.ico?v=20251107">
  <link rel="manifest" href="site.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="XHSPHONE" />

  <link rel="stylesheet" href="./css/style.css" />

  <!-- Dexie：本地 IndexedDB -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  
  <!-- 登录检查 -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // 未登录，跳转到登录页
        window.location.href = 'login.html';
      } else {
        // 已登录，保存用户信息
        const username = session.user.user_metadata?.username || 
                        localStorage.getItem('xhs_user_name') || 
                        session.user.email.split('@')[0];
        
        window.currentUser = {
          id: session.user.id,
          email: session.user.email,
          name: username
        };
        
        localStorage.setItem('xhs_user_name', username);
        localStorage.setItem('xhs_user_id', session.user.id);
        
        // 检查是否是管理员（第一个注册的用户）
        // 这里简化处理，实际应该查询数据库
        window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
      }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <!-- 顶部导航 -->
    <div class="topbar">
      <div class="top-left">
        <h1 id="appTitle">XHSPHONE</h1>
      </div>
      <div class="top-right">
        <span id="onlineStatus" style="display:none; margin-right: 10px; color: #34c759; font-size: 13px;"></span>
        <span id="currentUserName" style="margin-right: 10px; color: #666; font-size: 14px;"></span>
        <button id="btnUserManagement" class="ghost" style="padding: 4px 12px; height: auto; display:none;">用户管理</button>
        <button id="btnLogout" class="ghost" style="padding: 4px 12px; height: auto;">退出</button>
        
        <span id="cloudStatus" class="cloud-status">
          <span id="cloudDot"></span>
          <span id="cloudText">Base 数据连接：未知</span>
        </span>
      </div>
    </div>

    <!-- 工具栏：搜索 + 筛选 + 操作 -->
    <div class="panel">
      <div class="toolbar">
        <input id="q" placeholder="搜索：任意关键词" />
        <button id="btnSearchMode" class="ghost function-btn" data-function="search">当前：模糊搜索</button>

        <select id="filterOwner">
          <option value="all">所属人：全部</option>
        </select>
        <select id="filterWxReal">
          <option value="all">微信实名人：全部</option>
        </select>
        <select id="sortBy">
          <option value="order">排序：手动</option>
          <option value="owner">排序：所属人</option>
          <option value="wx_real">排序：微信实名人</option>
          <option value="phone">排序：电话号码</option>
          <option value="xhs_name">排序：小红书名称</option>
          <option value="row_color">排序：分类</option>
        </select>
      </div>

      <div class="toolbar">
        <button id="btnAdd" class="primary function-btn" data-function="add">新增一行</button>
        <button id="btnImportCSV" class="ghost function-btn" data-function="import">导入数据</button>
        <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none" />
        <button id="btnExportCSV" class="ghost function-btn" data-function="export">导出数据</button>
        <button id="btnSaveCloud" class="ghost function-btn" data-function="saveCloud">保存云端</button>
        <button id="btnLoadCloud" class="ghost function-btn" data-function="loadCloud">云端加载</button>
        <button id="btnClearAll" class="ghost function-btn" data-function="clear">清空全部</button>
        <button id="btnCategories" class="ghost function-btn" data-function="categories">分类设置</button>
        <button id="btnView" class="ghost function-btn" data-function="view">显示设置</button>
      </div>

      <!-- 云端历史快照下拉 -->
      <div id="cloudHistoryPanel" class="cloud-history-panel" style="display:none"></div>

      <div class="status" id="statusText">
        本地 + Supabase 模式：支持 CSV 导入/导出，支持云端快照备份（最多保留 5 个历史版本）。
      </div>
    </div>

    <!-- 分类设置面板 -->
    <div class="panel" id="panelCategories" style="display:none">
      <div class="toolbar" style="align-items:flex-start">
        <div class="chip">
          <span class="colorDot" id="catColorPreview"></span>
          <input id="catName" placeholder="分类名称，例如：Olina用" />
          <input id="catColor" type="color" value="#007aff" />
        </div>
        <button id="btnCatAdd">新增分类</button>
      </div>
      <div id="catList"></div>
    </div>

    <!-- 显示设置面板 -->
    <div class="panel" id="panelView" style="display:none">
      <div class="toolbar toolbar-wrap">
        <label class="label-inline">
          标题文字
          <input id="titleText" />
        </label>
        <label class="label-inline">
          标题颜色
          <input id="titleColor" type="color" />
        </label>
        <label class="label-inline">
          按钮颜色
          <input id="btnColor" type="color" />
        </label>
        <label class="label-inline">
          字体
          <select id="fontFamily">
            <option value="-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,Helvetica,Arial,sans-serif">
              系统默认
            </option>
            <option value="PingFang SC, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
              苹方
            </option>
            <option value="Helvetica Neue, Helvetica, Arial, sans-serif">
              Helvetica
            </option>
            <option value="Arial, sans-serif">
              Arial
            </option>
          </select>
        </label>
      </div>

      <div class="toolbar toolbar-wrap">
        <label class="label-inline">
          行高
          <input id="rowPad" type="range" min="4" max="14" step="1" />
        </label>
        <label class="label-inline">
          列宽缩放
          <input id="colScale" type="range" min="0.7" max="1.4" step="0.05" />
        </label>
        <label class="label-inline">
          <input id="zebraOn" type="checkbox" />
          隔行着色
        </label>
        <label class="label-inline">
          隔行颜色
          <input id="zebraColor" type="color" />
        </label>
        <button id="btnCompact" class="ghost">一键紧凑</button>
        <button id="btnResetSize" class="ghost">恢复默认</button>
      </div>
    </div>

    <!-- 数据面板 -->
    <div class="panel" style="overflow:auto;max-height:92vh">
      <!-- 桌面版表格 -->
      <div class="table-wrap desktop-only">
        <table id="grid">
          <thead>
            <tr>
              <th class="col-phone">电话号码</th>
              <th class="col-owner">所属人</th>
              <th class="col-real">微信实名人</th>
              <th class="col-wx">对应微信名</th>
              <th class="col-xhs">小红书名称</th>
              <th class="col-note">备注</th>
              <th class="col-cat">分类</th>
              <th class="col-act">操作</th>
            </tr>
          </thead>
          <tbody id="gridBody" class="zebra"></tbody>
        </table>
      </div>

      <!-- 手机版折叠列表 -->
      <div id="mobileList" class="mobile-only"></div>
    </div>
  </div>

  <!-- 主脚本 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
