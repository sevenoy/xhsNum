<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>显示设置 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-touch-icon.png?v=20251107">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="icon" type="image/x-icon" href="./icon/favicon.ico?v=20251107">
  <link rel="shortcut icon" href="./icon/favicon.ico?v=20251107">
  <link rel="manifest" href="./site.webmanifest">
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1990FF" />
  <meta name="apple-mobile-web-app-title" content="显示设置" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    /* ✅ 覆盖 style.css 中的背景设置 */
    html, body {
      margin: 0 !important;
      padding: 16px !important;
      background: #fff !important; /* ✅ 强制白色背景 */
      font-size: 14px;
      box-sizing: border-box;
      height: 100%;
      overflow-y: auto;
      user-select: text !important; /* ✅ 允许选择文本 */
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
    }
    /* ✅ 确保所有元素都可以被选择 */
    * {
      user-select: text !important;
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
    }
    /* ✅ 按钮和交互元素保持可点击 */
    button, a, input, select, textarea {
      user-select: none !important; /* 按钮文本不需要选择 */
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      cursor: pointer !important;
    }
    .settings-section {
      margin-bottom: 20px;
    }
    .settings-section:last-child {
      margin-bottom: 0;
    }
    .settings-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e5e5ea;
    }
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .settings-row:last-child {
      margin-bottom: 0;
    }
    .settings-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
      box-sizing: border-box;
      min-width: 0;
    }
    .settings-item-2col {
      flex: 1 1 calc(50% - 6px);
      min-width: 180px;
      max-width: calc(50% - 6px);
    }
    .settings-item-3col {
      flex: 1 1 calc(33.333% - 8px);
      min-width: 120px;
      max-width: calc(33.333% - 8px);
    }
    .settings-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .settings-item input[type="text"],
    .settings-item select {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .settings-item input[type="color"] {
      width: 50px;
      height: 36px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .settings-item input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
    }
    .settings-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .settings-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e5ea;
    }
    .settings-btn {
      padding: 8px 16px; /* ✅ 与导航按钮一致的padding */
      border-radius: 999px; /* ✅ 与导航按钮一致的圆角 */
      font-size: 14px; /* ✅ 统一字体大小 */
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .settings-btn.primary {
      background: #1990FF;
      color: white;
    }
    .settings-btn.primary:hover {
      background: #1478d7;
    }
    .settings-btn.ghost {
      background: #f5f5f7;
      color: #333;
    }
    .settings-btn.ghost:hover {
      background: #e5e5ea;
    }
    
    /* 手机端优化 */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .settings-item-2col {
        flex: 1 1 100%;
        max-width: 100%;
        min-width: 0;
      }
      .settings-item-3col {
        flex: 1 1 calc(50% - 6px);
        max-width: calc(50% - 6px);
        min-width: 0;
      }
      .settings-buttons {
        flex-direction: row !important; /* ✅ 强制水平排列 */
        justify-content: center;
      }
      .settings-btn {
        flex: 0 0 auto !important; /* ✅ 不拉伸，保持原始大小 */
        min-width: 100px;
        width: auto !important; /* ✅ 覆盖手机端的 width: 100% */
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .settings-item-3col {
        flex: 1 1 100%;
        max-width: 100%;
      }
      .settings-buttons {
        flex-direction: row !important; /* ✅ 小屏幕也保持水平排列 */
        justify-content: center;
      }
      .settings-btn {
        flex: 0 0 auto !important;
        width: auto !important;
        min-width: 100px;
      }
    }
  </style>
</head>
<body>
  <!-- 基础设置 -->
      <div class="settings-section">
        <div class="settings-section-title">基础设置</div>
        <div class="settings-row">
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">标题文字</span>
              <input type="text" id="titleText" />
            </label>
          </div>
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">字体</span>
              <select id="fontFamily">
                <option value="-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,Helvetica,Arial,sans-serif">系统默认</option>
                <option value="PingFang SC, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">苹方</option>
                <option value="Helvetica Neue, Helvetica, Arial, sans-serif">Helvetica</option>
                <option value="Arial, sans-serif">Arial</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      
      <!-- 颜色设置 -->
      <div class="settings-section">
        <div class="settings-section-title">颜色设置</div>
        <div class="settings-row">
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">标题颜色</span>
              <input type="color" id="titleColor" />
            </label>
          </div>
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">按钮颜色</span>
              <input type="color" id="btnColor" />
            </label>
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-item settings-item-3col">
            <label>
              <input type="checkbox" id="fontBold" />
              <span>粗体</span>
            </label>
          </div>
          <div class="settings-item settings-item-3col">
            <label>
              <span style="min-width: 80px;">隔行颜色</span>
              <input type="color" id="zebraColor" />
            </label>
          </div>
          <div class="settings-item settings-item-3col">
            <label>
              <input type="checkbox" id="zebraOn" />
              <span>隔行着色</span>
            </label>
          </div>
        </div>
      </div>
      
      <!-- 尺寸设置 -->
      <div class="settings-section">
        <div class="settings-section-title">尺寸设置</div>
        <div class="settings-row">
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">行高</span>
              <input type="range" id="rowPad" min="4" max="14" step="1" />
              <span id="rowPadValue" style="min-width: 30px; text-align: right;">6</span>
            </label>
          </div>
          <div class="settings-item settings-item-2col">
            <label>
              <span style="min-width: 80px;">列宽</span>
              <input type="range" id="colScale" min="0.7" max="1.4" step="0.05" />
              <span id="colScaleValue" style="min-width: 30px; text-align: right;">1.0</span>
            </label>
          </div>
        </div>
      </div>
      
  <!-- 操作按钮 -->
  <div class="settings-buttons">
    <button class="settings-btn ghost" id="btnCompact">一键紧凑</button>
    <button class="settings-btn ghost" id="btnResetSize">恢复默认</button>
  </div>

  <script type="module">
    // 从 localStorage 读取设置
    function readView() {
      const stored = localStorage.getItem('xhs_view');
      if (!stored) {
        return {
          titleText: '号码管理',
          titleColor: '#208BEE',
          btnColor: '#639BD5',
          fontFamily: '-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif',
          fontWeight: 'normal',
          pad: 6,
          colScale: 1,
          zebraOn: true,
          zebraColor: '#e2f0ff'
        };
      }
      return JSON.parse(stored);
    }
    
    function saveView(view) {
      localStorage.setItem('xhs_view', JSON.stringify(view));
      // 通知主页更新
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'viewUpdated', view }, '*');
      }
    }
    
    // 初始化
    const view = readView();
    
    // 设置输入框值
    document.getElementById('titleText').value = view.titleText || '号码管理';
    document.getElementById('titleColor').value = view.titleColor || '#208BEE';
    document.getElementById('btnColor').value = view.btnColor || '#639BD5';
    document.getElementById('fontFamily').value = view.fontFamily || '-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif';
    document.getElementById('fontBold').checked = view.fontWeight === 'bold';
    document.getElementById('rowPad').value = view.pad || 6;
    document.getElementById('colScale').value = view.colScale || 1;
    document.getElementById('zebraOn').checked = view.zebraOn !== false;
    document.getElementById('zebraColor').value = view.zebraColor || '#e2f0ff';
    
    // 更新显示值
    document.getElementById('rowPadValue').textContent = view.pad || 6;
    document.getElementById('colScaleValue').textContent = (view.colScale || 1).toFixed(2);
    
    // 绑定事件
    document.getElementById('titleText').addEventListener('input', () => {
      const v = readView();
      v.titleText = document.getElementById('titleText').value || '号码管理';
      saveView(v);
    });
    
    document.getElementById('titleColor').addEventListener('input', (e) => {
      const v = readView();
      v.titleColor = e.target.value || '#208BEE';
      saveView(v);
    });
    
    document.getElementById('btnColor').addEventListener('input', (e) => {
      const v = readView();
      v.btnColor = e.target.value || '#639BD5';
      saveView(v);
    });
    
    document.getElementById('fontFamily').addEventListener('change', () => {
      const v = readView();
      v.fontFamily = document.getElementById('fontFamily').value;
      saveView(v);
    });
    
    document.getElementById('fontBold').addEventListener('change', () => {
      const v = readView();
      v.fontWeight = document.getElementById('fontBold').checked ? 'bold' : 'normal';
      saveView(v);
    });
    
    document.getElementById('rowPad').addEventListener('input', () => {
      const v = readView();
      const value = Number(document.getElementById('rowPad').value) || 6;
      v.pad = value;
      document.getElementById('rowPadValue').textContent = value;
      saveView(v);
    });
    
    document.getElementById('colScale').addEventListener('input', () => {
      const v = readView();
      const value = Number(document.getElementById('colScale').value) || 1;
      v.colScale = value;
      document.getElementById('colScaleValue').textContent = value.toFixed(2);
      saveView(v);
    });
    
    document.getElementById('zebraOn').addEventListener('change', () => {
      const v = readView();
      v.zebraOn = document.getElementById('zebraOn').checked;
      saveView(v);
    });
    
    document.getElementById('zebraColor').addEventListener('input', (e) => {
      const v = readView();
      v.zebraColor = e.target.value || '#e2f0ff';
      saveView(v);
    });
    
    // 一键紧凑
    document.getElementById('btnCompact').addEventListener('click', () => {
      const v = {
        titleText: view.titleText || '号码管理',
        titleColor: view.titleColor || '#208BEE',
        btnColor: view.btnColor || '#639BD5',
        fontFamily: view.fontFamily || '-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif',
        fontWeight: 'normal',
        pad: 4,
        colScale: 0.8,
        zebraOn: view.zebraOn !== false,
        zebraColor: view.zebraColor || '#e2f0ff'
      };
      saveView(v);
      location.reload();
    });
    
    // 恢复默认
    document.getElementById('btnResetSize').addEventListener('click', () => {
      const v = {
        titleText: '号码管理',
        titleColor: '#208BEE',
        btnColor: '#639BD5',
        fontFamily: '-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif',
        fontWeight: 'normal',
        pad: 6,
        colScale: 1,
        zebraOn: true,
        zebraColor: '#e2f0ff'
      };
      saveView(v);
      location.reload();
    });
  </script>
</body>
</html>
