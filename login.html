<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 / 注册 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 32px;
      color: #1990FF;
      margin-bottom: 10px;
    }
    .logo p {
      color: #888;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      color: #888;
      transition: all 0.3s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab.active {
      color: #1990FF;
      border-bottom-color: #1990FF;
    }
    .form-panel {
      display: none;
    }
    .form-panel.active {
      display: block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e5ea;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1990FF;
      box-shadow: 0 0 0 3px rgba(25, 144, 255, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #1990FF;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      background: #1576d8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 144, 255, 0.4);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .remember-me {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .remember-me input {
      margin-right: 8px;
      width: auto;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>XHSPHONE</h1>
      <p>小红书账号管理系统</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>

    <div id="message" class="message"></div>

    <!-- 登录表单 -->
    <div id="loginPanel" class="form-panel active">
      <form id="loginForm">
        <div class="form-group">
          <label>邮箱</label>
          <input 
            type="email" 
            id="loginEmail" 
            placeholder="请输入邮箱" 
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="请输入密码" 
            required
            autocomplete="current-password"
          >
        </div>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">记住我</label>
        </div>

        <button type="submit" class="btn-submit" id="btnLogin">登录</button>
      </form>
    </div>

    <!-- 注册表单 -->
    <div id="registerPanel" class="form-panel">
      <form id="registerForm">
        <div class="form-group">
          <label>用户名</label>
          <input 
            type="text" 
            id="registerUsername" 
            placeholder="请输入用户名（2-20个字符）" 
            required
            autocomplete="username"
            minlength="2"
            maxlength="20"
          >
          <div class="hint">用户名将显示在系统中，其他人可以看到</div>
        </div>

        <div class="form-group">
          <label>邮箱</label>
          <input 
            type="email" 
            id="registerEmail" 
            placeholder="请输入邮箱" 
            required
            autocomplete="email"
          >
          <div class="hint">用于登录，不会发送验证邮件</div>
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input 
            type="password" 
            id="registerPassword" 
            placeholder="请输入密码（至少6位）" 
            required
            autocomplete="new-password"
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label>确认密码</label>
          <input 
            type="password" 
            id="registerPasswordConfirm" 
            placeholder="请再次输入密码" 
            required
            autocomplete="new-password"
            minlength="6"
          >
        </div>

        <button type="submit" class="btn-submit" id="btnRegister">注册</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    // 从 localStorage 读取配置
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url") || 
      "https://tmeqccupnsvxexbrlflo.supabase.co";
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key") || 
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtZXFjY3VwbnN2eGV4YnJsZmxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0OTg2MjAsImV4cCI6MjA3ODA3NDYyMH0.9ZJz6Cwpjo5HLGXRNMBtj-J57gX47Aj42_0ILmkxbho";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 检查是否已登录
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = 'index.html';
    }

    // 标签页切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.getAttribute('data-tab');
        
        // 切换标签激活状态
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // 切换表单面板
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(targetTab + 'Panel').classList.add('active');
        
        // 清空消息
        hideMessage();
      });
    });

    // 显示消息
    function showMessage(text, type = 'error') {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }

    function hideMessage() {
      const msg = document.getElementById('message');
      msg.style.display = 'none';
    }

    // 处理登录
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = '登录中...';
      hideMessage();
      
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });
        
        if (error) throw error;
        
        // 获取用户元数据（用户名）
        const username = data.user.user_metadata?.username || email.split('@')[0];
        
        // 保存用户信息到 localStorage
        localStorage.setItem('xhs_user_email', email);
        localStorage.setItem('xhs_user_name', username);
        localStorage.setItem('xhs_user_id', data.user.id);
        
        if (rememberMe) {
          localStorage.setItem('xhs_remember_me', 'true');
        }
        
        showMessage('✅ 登录成功！正在跳转...', 'success');
        
        // 延迟跳转，让用户看到成功消息
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
        
      } catch (error) {
        console.error('登录失败:', error);
        showMessage('❌ 登录失败：' + (error.message || '请检查邮箱和密码'), 'error');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });

    // 处理注册
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('registerUsername').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
      
      // 验证用户名
      if (username.length < 2 || username.length > 20) {
        showMessage('❌ 用户名长度必须在2-20个字符之间', 'error');
        return;
      }
      
      // 验证密码
      if (password.length < 6) {
        showMessage('❌ 密码长度至少为6位', 'error');
        return;
      }
      
      if (password !== passwordConfirm) {
        showMessage('❌ 两次输入的密码不一致', 'error');
        return;
      }
      
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.textContent = '注册中...';
      hideMessage();
      
      try {
        // 注册用户（不需要邮箱验证）
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              username: username,
              display_name: username
            },
            emailRedirectTo: window.location.origin + '/index.html'
          }
        });
        
        if (error) throw error;
        
        // Supabase 默认需要邮箱验证，但我们可以通过设置来禁用
        // 如果注册成功但需要验证邮箱，显示提示
        if (data.user && !data.session) {
          showMessage('⚠️ 注册成功！请联系管理员激活账号。', 'success');
        } else {
          // 直接登录成功
          localStorage.setItem('xhs_user_email', email);
          localStorage.setItem('xhs_user_name', username);
          localStorage.setItem('xhs_user_id', data.user.id);
          
          showMessage('✅ 注册成功！正在跳转...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
        
      } catch (error) {
        console.error('注册失败:', error);
        let errorMsg = '注册失败：';
        
        if (error.message.includes('already registered')) {
          errorMsg += '该邮箱已被注册';
        } else {
          errorMsg += error.message;
        }
        
        showMessage('❌ ' + errorMsg, 'error');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    });

    // 自动填充记住的邮箱
    const rememberedEmail = localStorage.getItem('xhs_user_email');
    const rememberMe = localStorage.getItem('xhs_remember_me');
    if (rememberedEmail && rememberMe) {
      document.getElementById('loginEmail').value = rememberedEmail;
      document.getElementById('rememberMe').checked = true;
    }
  </script>
</body>
</html>
