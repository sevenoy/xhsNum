  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">

  <!-- Dexie：本地 IndexedDB -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  
  <!-- 登录检查 -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    
    // ✅ 初始化全局变量，确保在页面加载时就有值
    window.currentUser = null;
    window.isAdmin = false;
    
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      // ✅ 检查 URL 参数，如果有 logout 参数，说明是从登录页跳转过来的，直接跳转回登录页
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout')) {
        window.location.href = 'login.html';
        return;
      }
      
      // ✅ 检查是否有退出标志（从 sessionStorage 检查）
      const isLoggingOut = sessionStorage.getItem('xhs_logging_out') === 'true';
      if (isLoggingOut) {
        // 正在退出，清除退出标志并跳转到登录页
        sessionStorage.removeItem('xhs_logging_out');
        // 清除所有登录相关的 localStorage
        localStorage.removeItem('xhs_user_name');
        localStorage.removeItem('xhs_user_id');
        localStorage.removeItem('xhs_user_email');
        localStorage.removeItem('xhs_user_role');
        localStorage.removeItem('xhs_is_admin');
        localStorage.removeItem('xhs_remember_me');
        localStorage.removeItem('xhs_remembered_username');
        localStorage.removeItem('xhs_last_login');
        // 清除 Supabase session
        try {
          await supabase.auth.signOut();
          // ✅ 等待一下，确保 session 已清除
          await new Promise(resolve => setTimeout(resolve, 100));
        } catch (err) {
          console.error('清除 session 失败:', err);
        }
        window.location.href = 'login.html?logout=' + Date.now();
        return;
      }
      
      // ✅ 检测是否是从主屏幕启动（PWA standalone 模式）
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone || 
                          document.referrer.includes('android-app://');
      
      console.log('🔍 登录检查:', { 
        isStandalone, 
        referrer: document.referrer,
        userAgent: navigator.userAgent 
      });
      
      // ✅ 关键修复：在 standalone 模式下，强制清除 Service Worker 缓存（如果存在）
      if (isStandalone && 'serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration();
          if (registration) {
            console.log('🔧 Standalone 模式：清除 Service Worker 缓存');
            // 发送消息清除缓存
            if (registration.active) {
              registration.active.postMessage({ type: 'CLEAR_CACHE' });
            }
          }
        } catch (swErr) {
          console.warn('⚠️ 清除 Service Worker 缓存失败:', swErr);
        }
      }
      
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      
      if (!session) {
        // 未登录，跳转到登录页
        console.log('❌ 未找到 session，跳转到登录页');
        // ✅ 使用 replace 避免缓存问题
        window.location.replace('login.html');
        return;
      }
      
      // ✅ 关键修复：验证 session 是否真的有效（通过尝试获取用户信息）
      // 在 standalone 模式下，可能 session token 已过期但本地还有缓存
      try {
        // 先尝试刷新 session（如果过期会自动刷新）
        // 注意：refreshSession 可能失败但不一定是认证问题，所以不立即跳转
        let validSession = session;
        try {
          const { data: { session: refreshedSession }, error: refreshError } = await supabase.auth.refreshSession();
          if (!refreshError && refreshedSession) {
            validSession = refreshedSession;
            console.log('✅ Session 刷新成功');
          } else if (refreshError) {
            console.log('⚠️ Session 刷新失败（可能没有 refresh token）:', refreshError);
            // 继续使用原始 session，稍后通过查询验证
          }
        } catch (refreshErr) {
          console.log('⚠️ Session 刷新异常（继续使用原始 session）:', refreshErr);
          // 继续使用原始 session
        }
        
        // ✅ 验证 session：尝试获取用户信息（如果 session 无效，这里会失败）
        const { data: profile, error: profileError } = await supabase
          .from('user_profiles')
          .select('*')
          .eq('user_id', validSession.user.id)
          .single();
        
        // ✅ 如果查询失败且是认证错误，说明 session 无效
        if (profileError && (profileError.code === 'PGRST116' || profileError.message?.includes('JWT') || 
            profileError.message?.includes('expired') || profileError.message?.includes('Invalid'))) {
          console.log('❌ Session 无效（认证失败），清除并跳转到登录页:', profileError);
          try {
            await supabase.auth.signOut();
          } catch (signOutErr) {
            console.error('清除 session 失败:', signOutErr);
          }
          // ✅ 使用 replace 避免缓存问题，特别是在 standalone 模式下
          window.location.replace('login.html');
          return;
        }
        
        // ✅ 额外验证：如果查询失败且是网络错误，但在 standalone 模式下，可能是 session 过期
        if (profileError && isStandalone && !profile) {
          console.log('⚠️ Standalone 模式：查询用户信息失败，可能是 session 过期:', profileError);
          // 尝试再次验证 session
          const { data: { session: recheckSession } } = await supabase.auth.getSession();
          if (!recheckSession || !recheckSession.user) {
            console.log('❌ Session 验证失败，跳转到登录页');
            try {
              await supabase.auth.signOut();
            } catch (signOutErr) {
              console.error('清除 session 失败:', signOutErr);
            }
            window.location.replace('login.html');
            return;
          }
        }
        
        // ✅ 已登录且 session 有效，从 user_profiles 查询用户信息
        if (profile) {
            // 从数据库获取用户信息
            window.currentUser = {
              id: validSession.user.id,
              email: profile.email,
              name: profile.username
            };
            
            localStorage.setItem('xhs_user_name', profile.username);
            localStorage.setItem('xhs_user_id', validSession.user.id);
            localStorage.setItem('xhs_user_email', profile.email);
            localStorage.setItem('xhs_user_role', profile.role || 'basic');
            
            // 检查是否是管理员
            const isAdmin = profile.role === 'super_admin' || profile.username === 'sevenoy';
            window.isAdmin = isAdmin;
            localStorage.setItem('xhs_is_admin', isAdmin ? 'true' : 'false');
            
            console.log('✅ 用户信息已加载:', { 
              username: profile.username, 
              role: profile.role, 
              isAdmin: isAdmin,
              isStandalone 
            });
          } else {
            // 如果查询失败，使用 session 中的信息
            const username = validSession.user.user_metadata?.username || 
                            localStorage.getItem('xhs_user_name') || 
                            validSession.user.email.split('@')[0];
            
            window.currentUser = {
              id: validSession.user.id,
              email: validSession.user.email,
              name: username
            };
            
            localStorage.setItem('xhs_user_name', username);
            localStorage.setItem('xhs_user_id', validSession.user.id);
            
            // 默认不是管理员
            window.isAdmin = false;
            localStorage.setItem('xhs_is_admin', 'false');
          }
        } catch (err) {
          console.error('❌ 查询用户信息失败:', err);
          
          // ✅ 关键修复：如果是认证错误，清除 session 并跳转到登录页
          if (err.message?.includes('JWT') || err.code === 'PGRST116' || err.message?.includes('expired') || 
              err.message?.includes('Invalid') || err.message?.includes('Unauthorized')) {
            console.log('❌ Session 已过期或无效，清除并跳转到登录页');
            try {
              await supabase.auth.signOut();
            } catch (signOutErr) {
              console.error('清除 session 失败:', signOutErr);
            }
            // ✅ 使用 replace 避免缓存问题
            window.location.replace('login.html');
            return;
          }
          
          // ✅ 在 standalone 模式下，如果查询失败，更严格地验证
          if (isStandalone && err) {
            console.log('⚠️ Standalone 模式：查询失败，进行额外验证:', err);
            const { data: { session: finalCheck } } = await supabase.auth.getSession();
            if (!finalCheck || !finalCheck.user) {
              console.log('❌ Standalone 模式：最终验证失败，跳转到登录页');
              try {
                await supabase.auth.signOut();
              } catch (signOutErr) {
                console.error('清除 session 失败:', signOutErr);
              }
              window.location.replace('login.html');
              return;
            }
          }
          
          // 其他错误：降级处理，使用 session 信息或 localStorage
          // 注意：如果 refreshSession 失败，validSession 可能不存在，使用原始 session
          const currentSession = session;
          const username = currentSession?.user?.user_metadata?.username || 
                          localStorage.getItem('xhs_user_name') || 
                          currentSession?.user?.email?.split('@')[0] || '未知用户';
          
          window.currentUser = {
            id: currentSession?.user?.id || 'unknown',
            email: currentSession?.user?.email || '',
            name: username
          };
          
          // ✅ 从 localStorage 恢复管理员权限
          window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
          console.log('⚠️ 使用降级方案，从 localStorage 恢复管理员权限:', window.isAdmin);
        }
        
        // ✅ 用户信息加载完成后，立即更新用户名显示（针对桌面书签打开的情况）
        // 使用 requestAnimationFrame 确保 DOM 已准备好
        requestAnimationFrame(() => {
          const currentUserNameEl = document.getElementById('currentUserName');
          if (currentUserNameEl && window.currentUser) {
            const userName = window.currentUser.name || localStorage.getItem('xhs_user_name');
            if (userName && userName !== '匿名用户') {
              currentUserNameEl.textContent = `👤 ${userName}`;
              currentUserNameEl.style.display = 'inline-block';
              currentUserNameEl.style.visibility = 'visible';
              currentUserNameEl.style.opacity = '1';
              console.log('✅ 立即更新用户名显示:', userName);
            }
          }
        });
      }
    } else {
      // 如果没有 Supabase 配置，从 localStorage 恢复
      const username = localStorage.getItem('xhs_user_name');
      if (username) {
        window.currentUser = {
          id: localStorage.getItem('xhs_user_id') || 'anonymous',
          email: localStorage.getItem('xhs_user_email') || '',
          name: username
        };
        window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
      }
    }
    
    // ✅ 确保在页面加载完成后，管理员权限和用户名显示已经设置
    window.addEventListener('DOMContentLoaded', () => {
      // 恢复管理员权限
      if (!window.isAdmin && localStorage.getItem('xhs_is_admin') === 'true') {
        window.isAdmin = true;
        console.log('✅ DOMContentLoaded: 从 localStorage 恢复管理员权限');
      }
      
      // ✅ 恢复用户信息（针对桌面书签打开的情况）
      if (!window.currentUser) {
        const storedName = localStorage.getItem('xhs_user_name');
        const storedId = localStorage.getItem('xhs_user_id');
        const storedEmail = localStorage.getItem('xhs_user_email');
        
        if (storedName && storedId) {
          window.currentUser = {
            id: storedId,
            email: storedEmail || '',
            name: storedName
          };
          console.log('✅ DOMContentLoaded: 从 localStorage 恢复用户信息', window.currentUser);
        }
      }
      
      // ✅ 立即更新用户名显示
      const currentUserNameEl = document.getElementById('currentUserName');
      if (currentUserNameEl) {
        const userName = window.currentUser?.name || localStorage.getItem('xhs_user_name');
        if (userName && userName !== '匿名用户') {
          currentUserNameEl.textContent = `👤 ${userName}`;
          currentUserNameEl.style.display = 'inline-block';
          currentUserNameEl.style.visibility = 'visible';
          currentUserNameEl.style.opacity = '1';
          console.log('✅ DOMContentLoaded: 更新用户名显示', userName);
        }
      }
    });
  </script>
</head>
<body>
  <div class="wrap">
    <!-- 顶部导航 -->
    <div class="topbar">
      <div class="top-left">
        <h1 id="appTitle">号码管理</h1>
      </div>
      <div class="top-right">
        <span id="onlineStatus" style="display:none; margin-right: 10px; color: #34c759; font-size: 13px;"></span>
        <span id="currentUserName" style="margin-right: 10px; color: #666; font-size: 14px; display: inline-block;"></span>
        <button id="btnLogout" class="ghost" style="padding: 4px 12px; height: auto;">退出</button>
        
        <span id="cloudStatus" class="cloud-status">
          <span id="cloudDot"></span>

    <!-- 状态信息栏 -->
    <div id="statusInfoBar" class="status-info-bar"></div>

    <!-- 工具栏：搜索 + 筛选 + 操作 -->
    <div class="panel">
      <div class="toolbar">
        <div class="search-wrapper">
          <input id="q" placeholder="搜索：任意关键词" style="width: 100%; padding-right: 32px;" />
          <span id="clearSearch" class="clear-search-btn" title="清除搜索">×</span>

        <button id="btnSearchMode" class="ghost function-btn" data-function="search">当前：模糊搜索</button>

        <select id="filterOwner">
          <option value="all">所属人：全部</option>

        <select id="filterWxReal">
          <option value="all">微信实名人：全部</option>
        </select>
        <select id="sortBy">
          <option value="order">排序：手动</option>
          <option value="owner" selected>排序：所属人</option>
          <option value="wx_real">排序：微信实名人</option>
          <option value="phone">排序：电话号码</option>

      <div class="toolbar">
        <button id="btnAdd" class="primary function-btn" data-function="add">新增号码</button>

        <button id="btnLoadCloud" class="ghost function-btn" data-function="loadCloud">云端加载</button>
        <button id="btnCategories" class="ghost function-btn" data-function="categories">分类设置</button>
        <button id="btnView" class="ghost function-btn" data-function="view">显示设置</button>

          <div id="importExportMenu" style="display:none; position:absolute; left:50%; transform:translateX(-50%); top:100%; margin-top:4px; background:#fff; border:1px solid #eee; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.08); z-index:1000; min-width:120px;">

        </div>
        <!-- 隐藏的文件输入与兼容保留 -->

        <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none" />
        <button id="btnExportCSV" class="ghost function-btn" data-function="export" style="display:none;">导出数据</button>
      </div>

      <!-- 云端历史快照下拉 -->

    <!-- 分类设置面板 -->

    </div>

  <!-- 主脚本 -->
  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker 注册和自动更新检测 -->
  <script>
    // ✅ 应用版本号 - 每次更新代码时修改这个版本号
    // 格式：V + 年月日（6位） + . + 版本更改号
    // 例如：V251213.8 表示 2025年12月13日第8次更新
    const APP_VERSION = 'V251213.36';
    
    // ✅ 兼容性处理：清除旧格式的版本号记录（从 20251212.8 格式迁移到 V251213.8）
    // 确保更新提示能正常显示（针对 iPhone X 等设备）
    try {
      const lastShownVersion = localStorage.getItem('update_notification_shown');
      if (lastShownVersion && !lastShownVersion.startsWith('V')) {
        console.log('🔄 检测到旧版本号格式，清除旧记录:', lastShownVersion);
        localStorage.removeItem('update_notification_shown');
      }
      
      // ✅ 关键修复：如果已显示记录的版本号和当前版本相同，说明已经是最新版本
      // 但为了安全，我们仍然允许显示提示（如果 Service Worker 检测到更新）
      // 这里只是清除旧格式的记录
    } catch (e) {
      console.warn('清除旧版本号记录失败:', e);
    }
    
    // ✅ 关键修复：页面加载时立即清除刷新标志，防止重复提示
    // 这必须在 Service Worker 注册之前执行
    try {
      const swRefreshing = sessionStorage.getItem('sw_refreshing');
      const swRefreshTime = sessionStorage.getItem('sw_refresh_time');
      const swManualRefresh = sessionStorage.getItem('sw_manual_refresh');
      
      if (swRefreshing === 'true' && swRefreshTime) {
        const refreshTime = parseInt(swRefreshTime, 10);
        const timeSinceRefresh = Date.now() - refreshTime;
        
        // 如果刷新标志存在且是最近30秒内设置的，清除它（说明刷新已完成）
        // 缩短时间窗口，确保不会阻止正常的新版本检测
        if (timeSinceRefresh < 30000) {
          console.log('✅ 页面加载时清除刷新标志（' + Math.floor(timeSinceRefresh / 1000) + '秒前刷新）');
          sessionStorage.removeItem('sw_refreshing');
          sessionStorage.removeItem('sw_refresh_time');
          if (swManualRefresh === 'true') {
            sessionStorage.removeItem('sw_manual_refresh');
          }
        } else {
          // 超过30秒，也清除（可能是旧的标志）
          console.log('✅ 清除过期的刷新标志');
          sessionStorage.removeItem('sw_refreshing');
          sessionStorage.removeItem('sw_refresh_time');
          sessionStorage.removeItem('sw_manual_refresh');
        }
      } else if (swManualRefresh === 'true') {
        // 如果只有手动刷新标志，也清除（可能是旧的标志）
        console.log('✅ 清除旧的刷新标志');
        sessionStorage.removeItem('sw_manual_refresh');
      }

        // ✅ 兼容旧版本号格式：如果 localStorage 中是旧格式（如 20251212.8），清除它
        if (lastShownVersion && !lastShownVersion.startsWith('V')) {
          console.log('🔄 检测到旧版本号格式，清除旧记录:', lastShownVersion);
          localStorage.removeItem('update_notification_shown');
        }
        
        // ✅ 关键修复：检查是否已经显示过当前版本的提示
        // ✅ 简化逻辑：如果已显示过当前版本，且时间在10分钟内，跳过（避免重复提示）
        const currentLastShown = localStorage.getItem('update_notification_shown');
        const lastShownTime = localStorage.getItem('update_notification_time');
        
        // ✅ 关键修复：如果检测到新版本（通过 checkForUpdate 调用），应该总是显示
        // 这里只检查是否是重复显示（10分钟内显示过相同版本）
        if (currentLastShown === APP_VERSION && lastShownTime) {
          const timeSinceShown = Date.now() - parseInt(lastShownTime, 10);
          // ✅ 如果10分钟内显示过，跳过（避免重复提示）
          if (timeSinceShown < 10 * 60 * 1000) {
            console.log('✅ 当前版本已显示过更新提示（' + Math.floor(timeSinceShown / 1000) + '秒前），跳过');
            return;
          } else {
            // ✅ 超过10分钟，清除记录，允许重新显示（可能是新版本）
            console.log('🔄 超过10分钟，清除已显示记录，允许重新显示');
            localStorage.removeItem('update_notification_shown');
            localStorage.removeItem('update_notification_time');
          }
        } else if (currentLastShown && currentLastShown !== APP_VERSION) {
          // ✅ 如果已显示的是其他版本，清除记录（说明版本已更新）
          console.log('🔄 已显示的版本（' + currentLastShown + '）与当前版本（' + APP_VERSION + '）不同，清除记录');
          localStorage.removeItem('update_notification_shown');
          localStorage.removeItem('update_notification_time');
        }
        
        // ✅ 关键修复：如果记录为空或已清除，说明是新版本检测，应该显示
        // 这个检查确保在检测到新版本时，即使之前显示过，也能再次显示
        
        // ✅ 标记有待处理的更新
        pendingUpdate = true;
        
        console.log('✅ 准备显示更新提示，版本:', APP_VERSION);

        // ✅ 从更新日志文件读取更新内容
        let updateInfo = {
          title: '发现新版本',
          content: ['本次更新包含了一些改进和修复']
        };

        try {
          // ✅ 添加时间戳，确保获取最新文件（强制清除缓存）
          const response = await fetch('./update-log.json?v=' + APP_VERSION + '&t=' + Date.now() + '&nocache=' + Math.random(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });
          if (response.ok) {
            const updateLog = await response.json();
            // ✅ 关键修复：尝试获取服务器版本（通过检查所有版本号，找到最新的）
            // 首先尝试当前版本
            if (updateLog[APP_VERSION]) {
              updateInfo = updateLog[APP_VERSION];
            } else {
              // 如果当前版本找不到，尝试查找最新的版本（通常是服务器版本）
              const versions = Object.keys(updateLog).sort().reverse();
              if (versions.length > 0) {
                const latestVersion = versions[0];
                console.log('🔍 当前版本更新日志不存在，使用最新版本:', latestVersion);
                if (updateLog[latestVersion]) {
                  updateInfo = updateLog[latestVersion];
                }
              } else {
                console.warn('⚠️ 未找到任何版本号');
              }
            }
          }
        } catch (err) {
          console.warn('⚠️ 无法加载更新日志:', err);
        }

        // ✅ 创建遮罩层
        const overlay = document.createElement('div');
        overlay.id = 'updateOverlay'; // ✅ 添加ID，用于检查是否已显示
        overlay.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          touch-action: none;
          -webkit-overflow-scrolling: touch;
          -webkit-tap-highlight-color: transparent;
        `;
        
        console.log('✅ 创建更新提示遮罩层');

        // ✅ 创建更新提示框（居中显示）
        const notification = document.createElement('div');
        notification.style.cssText = `
          background: white;
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.3);
          max-width: 90%;
          max-height: 80vh;
          overflow-y: auto;
          z-index: 100000;
          position: relative;
          animation: slideIn 0.3s ease;
          touch-action: pan-y;
          -webkit-overflow-scrolling: touch;
        `;
        
        notification.innerHTML = `
          <div style="padding: 24px; text-align: center;">
            <div style="font-size: 32px; margin-bottom: 16px;">🔄</div>
            <div style="font-size: 20px; font-weight: 600; color: #333; margin-bottom: 8px;">
              ${updateInfo.title || '发现新版本'}
            </div>
            <div style="font-size: 14px; color: #666; margin-bottom: 20px;">
              版本 ${APP_VERSION} • ${updateInfo.date || new Date().toISOString().split('T')[0]}
            </div>
            <div style="
              background: #f5f5f5;
              border-radius: 12px;
              padding: 16px;
              margin-bottom: 24px;
              text-align: left;
              max-height: 300px;
              overflow-y: auto;
            ">
              <div style="font-size: 14px; color: #333; line-height: 1.8;">
                ${updateInfo.content ? updateInfo.content.map(item => `<div style="margin-bottom: 8px;">${item}</div>`).join('') : '本次更新包含了一些改进和修复'}
              </div>
            </div>
            <button id="btnUpdateConfirm" style="
              background: #1990FF;
              color: white;
              border: none;
              padding: 16px 32px;
              border-radius: 8px;
              font-weight: 600;
              cursor: pointer;
              font-size: 16px;
              width: 100%;
              max-width: 200px;
              min-height: 48px;
              transition: background 0.2s;
              -webkit-tap-highlight-color: rgba(25, 144, 255, 0.3);
              touch-action: manipulation;
              user-select: none;
              -webkit-user-select: none;
              pointer-events: auto !important;
              z-index: 100002 !important;
              position: relative;
              display: block;
              margin: 0 auto;
              -webkit-touch-callout: none;
              -webkit-user-drag: none;
            " onmouseover="this.style.background='#1580E0'" onmouseout="this.style.background='#1990FF'" ontouchstart="this.style.background='#1580E0'" ontouchend="this.style.background='#1990FF'">
              确定
            </button>
          </div>
        `;

        overlay.appendChild(notification);
        document.body.appendChild(overlay);

        // ✅ 等待 DOM 更新后再绑定事件
        await new Promise(resolve => setTimeout(resolve, 100));
        
        const btnUpdateConfirm = document.getElementById('btnUpdateConfirm');
        if (!btnUpdateConfirm) {
          console.error('❌ 未找到确定按钮');
          return;
        }

        // ✅ 确定按钮点击事件（支持移动端触摸）
        const handleConfirm = async (e) => {
          // ✅ 关键修复：安卓设备需要立即阻止默认行为和事件传播
          if (e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
          
          // ✅ 防止重复点击
          if (btnUpdateConfirm.disabled) {
            console.log('⚠️ 按钮已禁用，忽略重复点击');
            return;
          }
          
          console.log('✅ 用户点击确定按钮，开始更新流程', {
            eventType: e?.type,
            target: e?.target?.id,
            userAgent: navigator.userAgent
          });
          
          btnUpdateConfirm.disabled = true;
          btnUpdateConfirm.textContent = '更新中...';
          btnUpdateConfirm.style.opacity = '0.7';
          btnUpdateConfirm.style.pointerEvents = 'none';

          try {
            // ✅ 关键修复：先记录已显示状态，再移除提示框
            // 这样可以确保状态已保存，即使后续出错也不会重复显示
            try {
              localStorage.setItem('update_notification_shown', APP_VERSION);
              localStorage.setItem('update_notification_time', Date.now().toString());
              // 验证是否成功保存
              const saved = localStorage.getItem('update_notification_shown');
              if (saved === APP_VERSION) {
                console.log('✅ 已记录更新提示显示状态:', APP_VERSION, '时间:', new Date().toISOString());
              } else {
                console.error('❌ 保存更新提示状态失败:', {
                  expected: APP_VERSION,
                  actual: saved
                });
                // 如果保存失败，尝试再次保存
                localStorage.setItem('update_notification_shown', APP_VERSION);
                localStorage.setItem('update_notification_time', Date.now().toString());
              }
            } catch (e) {
              console.error('❌ 保存更新提示状态时发生错误:', e);
            }
            
            // ✅ 立即移除提示框，防止重复显示
            if (overlay && overlay.parentNode) {
              overlay.remove();
              console.log('✅ 已移除更新提示框');
            }
            
            // ✅ 设置刷新标志，防止刷新后立即检测到更新
            const refreshTime = Date.now();
            
            // ✅ 标记正在刷新（使用 sessionStorage 持久化，防止刷新循环）
            refreshing = true;
            pendingUpdate = false;
            
            // ✅ 设置手动刷新标志，防止 controllerchange 触发自动刷新
            sessionStorage.setItem('sw_manual_refresh', 'true');
            sessionStorage.setItem('sw_refreshing', 'true');
            sessionStorage.setItem('sw_refresh_time', refreshTime.toString());
            
            console.log('✅ 已设置刷新标志:', {
              refreshTime: refreshTime,
              time: new Date(refreshTime).toLocaleString()
            });

            // ✅ 关键修复：检查是否有等待中的 Service Worker
            let hasWaitingWorker = false;
            if (registration && registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              console.log('✅ 已通知 Service Worker 跳过等待');
              hasWaitingWorker = true;
            } else {
              // ✅ 如果没有 waiting 的 Service Worker，检查版本是否真的不匹配
              // 如果版本不匹配，直接刷新页面（强制获取最新代码）
              try {
                const cacheBuster = Date.now() + '_' + Math.random();
                const swResponse = await fetch('./sw.js?v=' + APP_VERSION + '&t=' + cacheBuster + '&force=' + Math.random(), {
                  cache: 'no-store',
                  headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                  }
                });
                if (swResponse.ok) {
                  const swText = await swResponse.text();
                  const versionMatch = swText.match(/const VERSION = ['"]([^'"]+)['"]/) || 
                                       swText.match(/VERSION\s*=\s*['"]([^'"]+)['"]/);
                  if (versionMatch) {
                    const serverVersion = versionMatch[1];
                    if (serverVersion !== APP_VERSION) {
                      console.log('🔄 检测到版本不匹配但没有 waiting Worker，直接刷新页面', {
                        current: APP_VERSION,
                        server: serverVersion
                      });
                      // 直接刷新，不使用缓存
                      window.location.reload(true);
                      return;
                    }
                  }
                }
              } catch (versionCheckErr) {
                console.warn('⚠️ 检查版本失败，继续正常更新流程:', versionCheckErr);
              }
            }

            // ✅ 清除所有缓存（强制清除，确保获取最新代码）
            if (registration) {
              try {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                console.log('✅ 所有缓存已清除');
              } catch (err) {
                console.warn('⚠️ 清除缓存失败:', err);
              }
            }
            
            // ✅ 额外清除：强制清除所有可能的缓存（针对安卓设备）
            try {
              if ('caches' in window) {
                const allCacheNames = await caches.keys();
                for (const cacheName of allCacheNames) {
                  await caches.delete(cacheName);
                }
                console.log('✅ 额外缓存清除完成');
              }
            } catch (err) {
              console.warn('⚠️ 额外缓存清除失败:', err);
            }

            // ✅ 延迟一小段时间，确保标志已设置，然后刷新
            console.log('⏳ 准备刷新页面，延迟300ms确保标志已设置');
            
            setTimeout(() => {
              console.log('🔄 开始刷新页面');
              // ✅ 强制刷新，不使用缓存
              window.location.reload(true);
            }, 300);
          } catch (err) {
            console.error('❌ 更新失败:', err);
            alert('更新失败，请手动刷新页面');
            refreshing = false;
            pendingUpdate = false;
            // 如果出错，确保提示框已移除
            if (overlay && overlay.parentNode) {
              overlay.remove();
            }
          }
        };
        
        // ✅ 绑定多种事件，确保移动端和桌面端都能响应
        // ✅ 关键修复：安卓设备需要同时绑定 touchstart 和 touchend
        const handleButtonTouch = (e) => {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          handleConfirm(e);
        };
        
        // ✅ 桌面端点击事件
        btnUpdateConfirm.addEventListener('click', handleConfirm, { passive: false });
        
        // ✅ 移动端触摸事件（安卓需要 touchstart）
        btnUpdateConfirm.addEventListener('touchstart', handleButtonTouch, { passive: false, capture: true });
        btnUpdateConfirm.addEventListener('touchend', handleButtonTouch, { passive: false, capture: true });
        
        // ✅ 安卓特殊处理：确保按钮可以点击
        const isAndroid = /Android/i.test(navigator.userAgent);
        if (isAndroid) {
          console.log('🔧 检测到安卓设备，应用特殊处理');
          // 强制设置按钮样式，确保可以点击
          btnUpdateConfirm.style.touchAction = 'manipulation';
          btnUpdateConfirm.style.webkitTouchCallout = 'none';
          btnUpdateConfirm.style.webkitUserSelect = 'none';
          btnUpdateConfirm.style.userSelect = 'none';
          btnUpdateConfirm.style.cursor = 'pointer';
          btnUpdateConfirm.style.pointerEvents = 'auto';
          btnUpdateConfirm.style.zIndex = '100002';
          
          // ✅ 安卓设备：添加 mousedown 事件作为备用
          btnUpdateConfirm.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handleConfirm(e);
          }, { passive: false });
        }

        // ✅ 点击遮罩层不关闭，必须点击确定按钮才能更新
        overlay.addEventListener('click', (e) => {
          // ✅ 关键修复：如果点击的是按钮或其子元素，不阻止
          if (e.target === btnUpdateConfirm || btnUpdateConfirm.contains(e.target)) {
            return; // 允许按钮点击事件传播
          }
          if (e.target === overlay) {
            // 点击遮罩层不关闭，必须点击确定按钮
            e.stopPropagation();
            e.preventDefault();
          }
        }, { passive: false });
        
        // ✅ 防止触摸事件穿透（但允许按钮的触摸事件）
        overlay.addEventListener('touchstart', (e) => {
          // ✅ 关键修复：如果触摸的是按钮或其子元素，不阻止
          if (e.target === btnUpdateConfirm || btnUpdateConfirm.contains(e.target)) {
            return; // 允许按钮触摸事件传播
          }
          if (e.target === overlay) {
            e.stopPropagation();
          }
        }, { passive: false });
        
        overlay.addEventListener('touchmove', (e) => {
          // ✅ 关键修复：如果触摸的是按钮或其子元素，不阻止
          if (e.target === btnUpdateConfirm || btnUpdateConfirm.contains(e.target)) {
            return; // 允许按钮触摸事件传播
          }
          if (e.target === overlay) {
            e.stopPropagation();
          }
        }, { passive: false });
        
        overlay.addEventListener('touchend', (e) => {
          // ✅ 关键修复：如果触摸的是按钮或其子元素，不阻止
          if (e.target === btnUpdateConfirm || btnUpdateConfirm.contains(e.target)) {
            return; // 允许按钮触摸事件传播
          }
          if (e.target === overlay) {
            e.stopPropagation();
            e.preventDefault();
          }
        }, { passive: false });
        
        // ✅ 防止提示框被意外移除
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.type === 'childList') {
              mutation.removedNodes.forEach((node) => {
                if (node === overlay || (node.nodeType === 1 && node.contains(overlay))) {
                  console.warn('⚠️ 更新提示框被意外移除，重新添加');
                  if (!document.getElementById('updateOverlay')) {
                    document.body.appendChild(overlay);
                  }
                }
              });
            }
          });
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      };

      // ✅ 监听 Service Worker 控制权变化
      // 注意：不自动刷新，等待用户点击更新提示框的"确定"按钮后再刷新
      let refreshing = false;
      let pendingUpdate = false; // ✅ 标记是否有待处理的更新
      
      // ✅ 页面加载时，检查是否有待处理的刷新（防止刷新循环）
      // ✅ 关键修复：页面加载时立即清除刷新标志，防止重复显示提示
      // 注意：这个检查已经在上面（Service Worker 注册之前）执行过了
      // 这里保留作为备用检查
      const swRefreshing = sessionStorage.getItem('sw_refreshing');
      const swRefreshTime = sessionStorage.getItem('sw_refresh_time');
      const swManualRefresh = sessionStorage.getItem('sw_manual_refresh');
      
      console.log('🔍 Service Worker 注册后检查刷新标志:', {
        swRefreshing: swRefreshing,
        swRefreshTime: swRefreshTime,
        swManualRefresh: swManualRefresh
      });
      
      if (swRefreshing === 'true' && swRefreshTime) {
        const refreshTime = parseInt(swRefreshTime, 10);
        const now = Date.now();
        const timeSinceRefresh = now - refreshTime;
        
        // ✅ 关键修复：如果刷新标志存在且是最近 30 秒内设置的，清除它（说明刷新已完成）
        // 缩短时间窗口，确保不会阻止正常的新版本检测
        if (timeSinceRefresh < 30000) { // 30秒内
          console.log('✅ 检测到刷新标志（' + Math.floor(timeSinceRefresh / 1000) + '秒前），清除标志');
          sessionStorage.removeItem('sw_refreshing');
          sessionStorage.removeItem('sw_refresh_time');
          if (swManualRefresh === 'true') {
            sessionStorage.removeItem('sw_manual_refresh');
          }
          console.log('✅ 刷新标志已清除（防止循环刷新和重复提示）');
        } else {
          // 超过30秒，也清除（可能是旧的标志）
          console.log('✅ 刷新标志已过期，清除标志');
          sessionStorage.removeItem('sw_refreshing');
          sessionStorage.removeItem('sw_refresh_time');
          sessionStorage.removeItem('sw_manual_refresh');
        }
      } else if (swManualRefresh === 'true') {
        // 如果只有手动刷新标志，也清除（可能是旧的标志）
        console.log('✅ 清除旧的刷新标志');
        sessionStorage.removeItem('sw_manual_refresh');
      }
      
      // ✅ 完全禁用 controllerchange 的自动刷新，只允许手动刷新
      // 这样可以防止刷新循环，所有刷新都通过用户点击确定按钮触发
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        const isRefreshing = sessionStorage.getItem('sw_refreshing') === 'true';
        const isManualRefresh = sessionStorage.getItem('sw_manual_refresh') === 'true';
        
        // ✅ 如果是手动刷新（用户点击确定按钮），不处理 controllerchange
        if (isManualRefresh || isRefreshing) {
          console.log('⚠️ 检测到手动刷新标志，跳过 controllerchange 自动刷新');
          return;
        }
        
        // ✅ 完全禁用自动刷新，只记录日志
        // 所有刷新都通过用户点击确定按钮触发，避免刷新循环
        console.log('🔄 Service Worker 已更新（controllerchange），等待用户确认后刷新');
        // 不执行任何刷新操作
      });
      
      // ✅ 页面加载时立即检查是否有等待中的更新（已在上面处理，这里保留作为备用）
      // 注意：这个监听器在 Service Worker 注册成功后也会执行
    } else {
      console.warn('⚠️ 浏览器不支持 Service Worker');
    }

    // ✅ 添加动画样式
    if (!document.querySelector('style[data-update-animation]')) {
      const style = document.createElement('style');
      style.setAttribute('data-update-animation', 'true');
      style.textContent = `
        @keyframes slideIn {
          from { 
            opacity: 0; 
            transform: scale(0.9) translateY(-20px); 
          }
          to { 
            opacity: 1; 
            transform: scale(1) translateY(0); 
          }
        }
        @keyframes fadeOut {
          from { opacity: 1; transform: translateX(-50%) translateY(0); }
          to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
      `;
      document.head.appendChild(style);
    }
  </script>
</body>
</html>
