<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 / 注册 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-touch-icon.png?v=20251107">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="icon" type="image/x-icon" href="./icon/favicon.ico?v=20251107">
  <link rel="shortcut icon" href="./icon/favicon.ico?v=20251107">
  <link rel="manifest" href="./site.webmanifest">
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1990FF" />
  <meta name="apple-mobile-web-app-title" content="XHSPHONE" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 32px;
      color: #1990FF;
      margin-bottom: 10px;
    }
    .logo p {
      color: #888;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      color: #888;
      transition: all 0.3s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab.active {
      color: #1990FF;
      border-bottom-color: #1990FF;
    }
    .form-panel {
      display: none;
    }
    .form-panel.active {
      display: block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e5ea;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1990FF;
      box-shadow: 0 0 0 3px rgba(25, 144, 255, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #1990FF;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      background: #1576d8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 144, 255, 0.4);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .remember-me {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .remember-me input {
      margin-right: 8px;
      width: auto;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>XHSPHONE</h1>
      <p>小红书账号管理系统</p>
    </div>

    <!-- ✅ 取消注册标签页，只保留登录 -->

    <div id="message" class="message"></div>

    <!-- 登录表单 -->
    <div id="loginPanel" class="form-panel active">
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input 
            type="text" 
            id="loginUsername" 
            placeholder="请输入用户名" 
            required
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="请输入密码" 
            required
            autocomplete="current-password"
          >
        </div>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">记住我</label>
        </div>

        <button type="submit" class="btn-submit" id="btnLogin">登录</button>
      </form>
    </div>

    <!-- ✅ 注册表单已移除 -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    // 从 localStorage 读取配置
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url") || 
      "https://tmeqccupnsvxexbrlflo.supabase.co";
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key") || 
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtZXFjY3VwbnN2eGV4YnJsZmxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0OTg2MjAsImV4cCI6MjA3ODA3NDYyMH0.9ZJz6Cwpjo5HLGXRNMBtj-J57gX47Aj42_0ILmkxbho";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ✅ 检查是否已登录，如果 URL 中有 logout 参数，强制清除 session
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout')) {
      // 退出登录后，清除所有 session 和本地数据
      await supabaseClient.auth.signOut();
      
      // ✅ 清除所有登录相关的 localStorage
      localStorage.removeItem('xhs_user_name');
      localStorage.removeItem('xhs_user_id');
      localStorage.removeItem('xhs_user_email');
      localStorage.removeItem('xhs_user_role');
      localStorage.removeItem('xhs_is_admin');
      localStorage.removeItem('xhs_remember_me');
      localStorage.removeItem('xhs_remembered_username');
      localStorage.removeItem('xhs_last_login');
      
      // ✅ 清除退出标志
      sessionStorage.removeItem('xhs_logging_out');
      
      console.log('✅ 已清除所有登录数据');
      // 清除记住的用户名
      localStorage.removeItem('xhs_remembered_username');
      localStorage.removeItem('xhs_remember_me');
    }
    
    // ✅ 检查是否有退出标志，如果有则清除（但不阻止后续代码执行）
    const isLoggingOut = sessionStorage.getItem('xhs_logging_out') === 'true';
    if (isLoggingOut) {
      console.log('⚠️ 检测到退出标志，清除并阻止自动跳转');
      sessionStorage.removeItem('xhs_logging_out');
    }
    
    // ✅ 只有在没有退出标志的情况下才检查 session 并自动跳转
    if (!isLoggingOut) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    }

    // ✅ 标签页切换功能已移除（只保留登录页面）

    // 显示消息
    function showMessage(text, type = 'error') {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }

    function hideMessage() {
      const msg = document.getElementById('message');
      msg.style.display = 'none';
    }

    // 处理登录
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = '登录中...';
      hideMessage();
      
      try {
        // 1. 先通过用户名查询用户信息
        const { data: profiles, error: profileError } = await supabaseClient
          .from('user_profiles')
          .select('*')
          .eq('username', username)
          .single();
        
        if (profileError || !profiles) {
          throw new Error('用户不存在');
        }
        
        // 2. 检查用户状态
        if (profiles.status === 'pending') {
          showMessage('⏳ 您的账号正在等待管理员审核\n审核通过后会收到通知', 'error');
          btn.disabled = false;
          btn.textContent = '登录';
          return;
        }
        
        if (profiles.status === 'rejected') {
          showMessage('❌ 您的账号申请已被拒绝\n如有疑问请联系管理员', 'error');
          btn.disabled = false;
          btn.textContent = '登录';
          return;
        }
        
        // 3. 使用邮箱和密码登录（Supabase Auth 需要邮箱）
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: profiles.email,
          password
        });
        
        if (error) throw error;
        
        // 4. 保存用户信息到 localStorage
        localStorage.setItem('xhs_user_email', profiles.email);
        localStorage.setItem('xhs_user_name', profiles.username);
        localStorage.setItem('xhs_user_id', data.user.id);
        localStorage.setItem('xhs_user_role', profiles.role || 'basic');
        
        // 检查是否是管理员
        if (profiles.role === 'super_admin' || profiles.username === 'sevenoy') {
          localStorage.setItem('xhs_is_admin', 'true');
        }
        
        // ✅ 记住我默认勾选，始终保存登录状态
        localStorage.setItem('xhs_remember_me', 'true');
        localStorage.setItem('xhs_remembered_username', username);
        
        // ✅ 设置 session 持久化（保持登录状态）
        if (data.session) {
          // Supabase 会自动管理 session，这里确保记住用户
          localStorage.setItem('xhs_last_login', Date.now().toString());
        }
        
        // ✅ 清除退出标志（如果存在），确保登录后可以正常跳转
        sessionStorage.removeItem('xhs_logging_out');
        
        showMessage('✅ 登录成功！正在跳转...', 'success');
        
        // 延迟跳转，让用户看到成功消息
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
        
      } catch (error) {
        console.error('登录失败:', error);
        let errorMsg = '登录失败：';
        if (error.message === '用户不存在') {
          errorMsg += '用户名不存在';
        } else if (error.message.includes('Invalid')) {
          errorMsg += '密码错误';
        } else {
          errorMsg += error.message;
        }
        showMessage('❌ ' + errorMsg, 'error');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });

    // ✅ 注册功能已移除

    // 自动填充记住的用户名
    const rememberedUsername = localStorage.getItem('xhs_remembered_username');
    const rememberMeFlag = localStorage.getItem('xhs_remember_me');
    if (rememberedUsername && rememberMeFlag) {
      document.getElementById('loginUsername').value = rememberedUsername;
      document.getElementById('rememberMe').checked = true;
    }
  </script>
</body>
</html>
