<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>用户管理 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e5e5ea;
    }
    .admin-header h1 {
      font-size: 28px;
      color: #1990FF;
    }
    .user-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-card h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }
    .stat-card .number {
      font-size: 32px;
      font-weight: 600;
      color: #1990FF;
    }
    .user-table {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    .user-table table {
      width: 100%;
      border-collapse: collapse;
    }
    .user-table th,
    .user-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    .user-table th {
      font-weight: 600;
      color: #333;
      background: #f9f9fb;
    }
    .user-table tr:hover {
      background: #f5f7ff;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.admin {
      background: #ffebee;
      color: #c62828;
    }
    .badge.user {
      background: #e3f2fd;
      color: #1976d2;
    }
    .btn-danger-small {
      padding: 4px 12px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #ff4d4f;
      background: white;
      color: #ff4d4f;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-danger-small:hover {
      background: #ff4d4f;
      color: white;
    }
    .add-user-form {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: none;
    }
    .add-user-form.show {
      display: block;
    }
    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .form-row input,
    .form-row select {
      flex: 1;
      min-width: 200px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #1990FF;
    }
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>👥 用户管理</h1>
      <div style="display: flex; gap: 10px;">
        <button class="ghost" onclick="location.href='index.html'">返回主页</button>
        <button id="btnToggleAddUser" class="primary">➕ 添加用户</button>
      </div>
    </div>

    <!-- 添加用户表单 -->
    <div id="addUserForm" class="add-user-form">
      <h3 style="margin-bottom: 15px;">添加新用户</h3>
      <div id="addUserError" class="error-message"></div>
      <form id="formAddUser">
        <div class="form-row">
          <input type="text" id="newUsername" placeholder="用户名（必填）" required minlength="2" maxlength="20">
          <input type="email" id="newEmail" placeholder="邮箱（必填）" required>
        </div>
        <div class="form-row">
          <input type="password" id="newPassword" placeholder="密码（必填，至少6位）" required minlength="6">
          <select id="newRole">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <div class="form-row">
          <button type="submit" class="primary">确认添加</button>
          <button type="button" class="ghost" id="btnCancelAdd">取消</button>
        </div>
      </form>
    </div>

    <!-- 统计卡片 -->
    <div class="user-stats">
      <div class="stat-card">
        <h3>总用户数</h3>
        <div class="number" id="totalUsers">-</div>
      </div>
      <div class="stat-card">
        <h3>管理员</h3>
        <div class="number" id="adminCount">-</div>
      </div>
      <div class="stat-card">
        <h3>普通用户</h3>
        <div class="number" id="userCount">-</div>
      </div>
    </div>

    <!-- 用户列表 -->
    <div class="user-table">
      <div id="loadingState" class="loading">加载中...</div>
      <div id="emptyState" class="empty-state" style="display:none;">
        暂无用户数据
      </div>
      <table id="userTable" style="display:none;">
        <thead>
          <tr>
            <th>用户名</th>
            <th>邮箱</th>
            <th>角色</th>
            <th>注册时间</th>
            <th>最后登录</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 检查登录和权限
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      alert('请先登录');
      window.location.href = 'login.html';
    }

    const currentUserId = session.user.id;
    const currentUserEmail = session.user.email;
    
    // 检查是否是管理员（简单判断：第一个注册的用户是管理员）
    // 在实际应用中，应该在数据库中有角色字段
    let isAdmin = false;
    
    // 格式化时间
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      const now = new Date();
      const diff = now - d;
      
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      
      return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    // 加载用户列表
    async function loadUsers() {
      try {
        // 使用 Supabase Admin API 获取所有用户
        // 注意：这需要在 Supabase 中配置 RLS 策略或使用 Service Role Key
        
        // 方案1：从 auth.users 表读取（需要 RLS 策略）
        // 方案2：维护一个单独的 user_profiles 表
        
        // 这里我们使用方案2：查询当前用户信息
        const { data: { users }, error } = await supabaseClient.auth.admin.listUsers();
        
        if (error) {
          // 如果没有admin权限，使用替代方案
          console.log('无法获取用户列表（需要管理员权限）');
          
          // 显示当前用户
          displayCurrentUserOnly();
          return;
        }
        
        // 检查当前用户是否是第一个用户（管理员）
        const sortedUsers = users.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        isAdmin = sortedUsers[0]?.id === currentUserId;
        
        if (!isAdmin) {
          alert('⚠️ 您没有管理员权限');
          window.location.href = 'index.html';
          return;
        }
        
        displayUsers(users);
        
      } catch (err) {
        console.error('加载用户失败:', err);
        document.getElementById('loadingState').textContent = '❌ 加载失败：' + err.message;
      }
    }

    // 显示当前用户（当没有管理员权限时）
    function displayCurrentUserOnly() {
      const users = [{
        id: currentUserId,
        email: currentUserEmail,
        user_metadata: session.user.user_metadata,
        created_at: session.user.created_at,
        last_sign_in_at: session.user.last_sign_in_at
      }];
      
      displayUsers(users);
      
      // 隐藏添加用户按钮
      document.getElementById('btnToggleAddUser').style.display = 'none';
      document.querySelector('.admin-header h1').textContent = '👤 我的信息';
    }

    // 显示用户列表
    function displayUsers(users) {
      document.getElementById('loadingState').style.display = 'none';
      
      if (!users || users.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      
      document.getElementById('userTable').style.display = 'table';
      
      // 更新统计
      const adminUsers = users.filter((u, i) => i === 0); // 第一个是管理员
      document.getElementById('totalUsers').textContent = users.length;
      document.getElementById('adminCount').textContent = adminUsers.length;
      document.getElementById('userCount').textContent = users.length - adminUsers.length;
      
      // 渲染表格
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = users.map((user, index) => {
        const username = user.user_metadata?.username || user.email.split('@')[0];
        const isFirstUser = index === 0;
        const isCurrentUser = user.id === currentUserId;
        
        return `
          <tr>
            <td>
              <strong>${username}</strong>
              ${isCurrentUser ? '<span style="color:#1990FF;font-size:12px;"> (我)</span>' : ''}
            </td>
            <td>${user.email}</td>
            <td>
              <span class="badge ${isFirstUser ? 'admin' : 'user'}">
                ${isFirstUser ? '👑 管理员' : '👤 普通用户'}
              </span>
            </td>
            <td>${formatTime(user.created_at)}</td>
            <td>${formatTime(user.last_sign_in_at)}</td>
            <td>
              ${isFirstUser || isCurrentUser ? 
                '<span style="color:#ccc;font-size:12px;">-</span>' : 
                `<button class="btn-danger-small" onclick="deleteUser('${user.id}', '${username}')">删除</button>`
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    // 添加用户表单切换
    document.getElementById('btnToggleAddUser').addEventListener('click', () => {
      const form = document.getElementById('addUserForm');
      form.classList.toggle('show');
    });

    document.getElementById('btnCancelAdd').addEventListener('click', () => {
      document.getElementById('addUserForm').classList.remove('show');
      document.getElementById('formAddUser').reset();
      document.getElementById('addUserError').style.display = 'none';
    });

    // 添加用户
    document.getElementById('formAddUser').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('newUsername').value.trim();
      const email = document.getElementById('newEmail').value.trim();
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;
      
      const errorEl = document.getElementById('addUserError');
      errorEl.style.display = 'none';
      
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = '添加中...';
      
      try {
        // 使用 Supabase Admin API 创建用户
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              username: username,
              role: role
            }
          }
        });
        
        if (error) throw error;
        
        alert(`✅ 用户 ${username} 添加成功！`);
        
        // 重置表单
        document.getElementById('formAddUser').reset();
        document.getElementById('addUserForm').classList.remove('show');
        
        // 重新加载用户列表
        await loadUsers();
        
      } catch (err) {
        console.error('添加用户失败:', err);
        errorEl.textContent = '❌ 添加失败：' + err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '确认添加';
      }
    });

    // 删除用户（需要暴露到全局作用域）
    window.deleteUser = async function(userId, username) {
      if (!confirm(`确定要删除用户 "${username}" 吗？\n\n此操作不可撤销！`)) {
        return;
      }
      
      try {
        // 使用 Supabase Admin API 删除用户
        const { error } = await supabaseClient.auth.admin.deleteUser(userId);
        
        if (error) throw error;
        
        alert(`✅ 用户 ${username} 已删除`);
        
        // 重新加载用户列表
        await loadUsers();
        
      } catch (err) {
        console.error('删除用户失败:', err);
        alert('❌ 删除失败：' + err.message + '\n\n提示：删除用户需要管理员权限（Service Role Key）');
      }
    };

    // 初始加载
    loadUsers();
  </script>
</body>
</html>
