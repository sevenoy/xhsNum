  <!-- 登录检查 -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    
    // ✅ 初始化全局变量，确保在页面加载时就有值
    window.currentUser = null;
    window.isAdmin = false;
    
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // 未登录，跳转到登录页
        window.location.href = 'login.html';
      } else {
        // 已登录，从 user_profiles 查询用户信息
        try {
          const { data: profile, error } = await supabase
            .from('user_profiles')
            .select('*')
            .eq('user_id', session.user.id)
            .single();
          
          if (profile) {
            // 从数据库获取用户信息
            window.currentUser = {
              id: session.user.id,
              email: profile.email,
              name: profile.username
            };
            
            localStorage.setItem('xhs_user_name', profile.username);
            localStorage.setItem('xhs_user_id', session.user.id);
            localStorage.setItem('xhs_user_email', profile.email);
            localStorage.setItem('xhs_user_role', profile.role || 'basic');
            
            // 检查是否是管理员
            const isAdmin = profile.role === 'super_admin' || profile.username === 'sevenoy';
            window.isAdmin = isAdmin;
            localStorage.setItem('xhs_is_admin', isAdmin ? 'true' : 'false');
            
            console.log('✅ 用户信息已加载:', { 
              username: profile.username, 
              role: profile.role, 
              isAdmin: isAdmin 
            });
          } else {
            // 如果查询失败，使用 session 中的信息
            const username = session.user.user_metadata?.username || 
                            localStorage.getItem('xhs_user_name') || 
                            session.user.email.split('@')[0];
            
            window.currentUser = {
              id: session.user.id,
              email: session.user.email,
              name: username
            };
            
            localStorage.setItem('xhs_user_name', username);
            localStorage.setItem('xhs_user_id', session.user.id);
            
            // 默认不是管理员
            window.isAdmin = false;
            localStorage.setItem('xhs_is_admin', 'false');
          }
        } catch (err) {
          console.error('查询用户信息失败:', err);
          // 降级处理：使用 session 信息或 localStorage
          const username = session.user.user_metadata?.username || 
                          localStorage.getItem('xhs_user_name') || 
                          session.user.email.split('@')[0];
          
          window.currentUser = {
            id: session.user.id,
            email: session.user.email,
            name: username
          };
          
          // ✅ 从 localStorage 恢复管理员权限
          window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
          console.log('⚠️ 使用降级方案，从 localStorage 恢复管理员权限:', window.isAdmin);
        }
      }
    } else {
      // 如果没有 Supabase 配置，从 localStorage 恢复
      const username = localStorage.getItem('xhs_user_name');
      if (username) {
        window.currentUser = {
          id: localStorage.getItem('xhs_user_id') || 'anonymous',
          email: localStorage.getItem('xhs_user_email') || '',
          name: username
        };
        window.isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
      }
    }
    
    // ✅ 确保在页面加载完成后，管理员权限已经设置
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.isAdmin && localStorage.getItem('xhs_is_admin') === 'true') {
        window.isAdmin = true;
        console.log('✅ DOMContentLoaded: 从 localStorage 恢复管理员权限');
      }
    });
  </script>
</head>
<body>

        <button id="btnSaveCloud" class="ghost function-btn" data-function="saveCloud">保存云端</button>
        <button id="btnLoadCloud" class="ghost function-btn" data-function="loadCloud">云端加载</button>

        <!-- 隐藏的文件输入与兼容保留 -->

      <!-- 云端历史快照下拉 -->
      <div id="cloudHistoryPanel" class="cloud-history-panel" style="display:none"></div>

    <!-- 分类设置面板 -->
    <div class="panel" id="panelCategories" style="display:none">
      <div class="toolbar" style="align-items:flex-start">

          <input id="catColor" type="color" value="#007aff" />

        <button id="btnCatAdd">新增分类</button>
      </div>
      <div id="catList"></div>
    </div>

    <!-- 数据面板 -->
    <div class="panel">
      <!-- 桌面版表格 -->
      <div class="table-wrap desktop-only">
        <table id="grid">
          <thead>
            <tr>
              <th class="col-phone">电话号码</th>

  <!-- 主脚本 -->
  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker 注册和自动更新检测 -->
  <script>
    // ✅ 应用版本号 - 每次更新代码时修改这个版本号
    const APP_VERSION = '20250115.5';

    // ✅ Service Worker 注册
    if ('serviceWorker' in navigator) {
      let registration = null;
      let updateCheckInterval = null;

      // 注册 Service Worker（添加版本号查询参数，确保浏览器能检测到文件变化）
      navigator.serviceWorker.register('./sw.js?v=' + APP_VERSION, {
        scope: './',
        updateViaCache: 'none' // ✅ 禁用 Service Worker 脚本的 HTTP 缓存
      }).then((reg) => {
        registration = reg;
        console.log('✅ Service Worker 注册成功，版本:', APP_VERSION);

        // ✅ 立即检查更新
        checkForUpdate(reg);

        // ✅ 监听 Service Worker 更新（改进检测逻辑）
        reg.addEventListener('updatefound', () => {
          console.log('🔄 发现新的 Service Worker 版本');
          const newWorker = reg.installing;
          
          if (!newWorker) {
            console.warn('⚠️ 未找到 installing 的 Service Worker');
            return;
          }
          
          // ✅ 监听多个状态，确保能捕获到更新
          newWorker.addEventListener('statechange', () => {
            console.log('🔄 Service Worker 状态变化:', newWorker.state);
            
            // ✅ 改进：检查多个状态，包括 installed 和 activating
            if (newWorker.state === 'installed') {
              if (navigator.serviceWorker.controller) {
                // 有旧版本在运行，新版本已安装，提示更新
                console.log('✅ 新版本已安装，等待激活');
                showUpdateNotification();
              } else {
                // 首次安装，直接激活
                console.log('✅ 首次安装 Service Worker');
              }
            } else if (newWorker.state === 'activating') {
              // ✅ 如果直接进入 activating 状态（由于 skipWaiting），也触发更新
              if (navigator.serviceWorker.controller) {
                console.log('✅ 新版本正在激活');
                // 延迟一下，确保状态稳定
                setTimeout(() => {
                  if (reg.waiting || reg.installing) {
                    showUpdateNotification();
                  }
                }, 100);
              }
            } else if (newWorker.state === 'activated') {
              // ✅ 如果新版本已激活，也显示更新提示
              if (navigator.serviceWorker.controller) {
                console.log('✅ 新版本已激活');
                showUpdateNotification();
              }
            }
          });
          
          // ✅ 额外监听：如果新 Worker 直接激活了（skipWaiting 导致）
          newWorker.addEventListener('controllerchange', () => {
            console.log('🔄 Service Worker 控制权已变更');
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });

        // ✅ 定期检查更新（每5分钟）
        updateCheckInterval = setInterval(() => {
          console.log('⏰ 定时检查更新（每5分钟）');
          checkForUpdate(reg);
        }, 5 * 60 * 1000);

        // ✅ 页面可见时检查更新
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && reg) {
            console.log('👁️ 页面可见，检查更新');
            checkForUpdate(reg);
          }
        });
        
        // ✅ 页面加载完成后立即检查更新
        window.addEventListener('load', () => {
          console.log('📄 页面加载完成，立即检查更新');
          checkForUpdate(reg);
        });
      }).catch((err) => {
        console.error('❌ Service Worker 注册失败:', err);
      });

      // ✅ 检查更新函数（增强版）
      function checkForUpdate(reg) {
        if (!reg) {
          console.warn('⚠️ Service Worker 注册对象不存在');
          return;
        }
        
        reg.update().then(() => {
          console.log('✅ 更新检查完成');
          
          // ✅ 检查是否有等待中的新版本
          if (reg.waiting) {
            console.log('🔄 发现等待中的新版本');
            showUpdateNotification();
            return;
          }
          
          // ✅ 检查是否有正在安装的新版本
          if (reg.installing) {
            console.log('🔄 发现正在安装的新版本');
            // 等待安装完成后再显示通知
            reg.installing.addEventListener('statechange', () => {
              if (reg.installing && reg.installing.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateNotification();
              }
            });
          }
        }).catch((err) => {
          console.warn('⚠️ 更新检查失败:', err);
        });
      }

      // ✅ 显示更新通知（改进版：显示更新内容）
      async function showUpdateNotification() {
        // 检查是否已经显示过通知
        if (localStorage.getItem('update_notification_shown') === APP_VERSION) {
          return;
        }

        // ✅ 从更新日志文件读取更新内容
        let updateInfo = {
          title: '发现新版本',
          content: ['本次更新包含了一些改进和修复']
        };

        try {
          const response = await fetch('./update-log.json?v=' + APP_VERSION);
          if (response.ok) {
            const updateLog = await response.json();
            if (updateLog[APP_VERSION]) {
              updateInfo = updateLog[APP_VERSION];
            }
          }
        } catch (err) {
          console.warn('⚠️ 无法加载更新日志:', err);
        }

        // ✅ 创建遮罩层
        const overlay = document.createElement('div');
        overlay.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
        `;

        // ✅ 创建更新提示框（居中显示）
        const notification = document.createElement('div');
        notification.style.cssText = `
          background: white;
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.3);
          max-width: 90%;
          max-height: 80vh;
          overflow-y: auto;
          z-index: 10000;
          animation: slideIn 0.3s ease;
        `;
        
        notification.innerHTML = `
          <div style="padding: 24px; text-align: center;">
            <div style="font-size: 32px; margin-bottom: 16px;">🔄</div>
            <div style="font-size: 20px; font-weight: 600; color: #333; margin-bottom: 8px;">
              ${updateInfo.title || '发现新版本'}
            </div>
            <div style="font-size: 14px; color: #666; margin-bottom: 20px;">
              版本 ${APP_VERSION} • ${updateInfo.date || '2025-01-15'}
            </div>
            <div style="
              background: #f5f5f5;
              border-radius: 12px;
              padding: 16px;
              margin-bottom: 24px;
              text-align: left;
              max-height: 300px;
              overflow-y: auto;
            ">
              <div style="font-size: 14px; color: #333; line-height: 1.8;">
                ${updateInfo.content ? updateInfo.content.map(item => `<div style="margin-bottom: 8px;">${item}</div>`).join('') : '本次更新包含了一些改进和修复'}
              </div>
            </div>
            <button id="btnUpdateConfirm" style="
              background: #1990FF;
              color: white;
              border: none;
              padding: 12px 32px;
              border-radius: 8px;
              font-weight: 600;
              cursor: pointer;
              font-size: 16px;
              width: 100%;
              max-width: 200px;
              transition: background 0.2s;
            " onmouseover="this.style.background='#1580E0'" onmouseout="this.style.background='#1990FF'">
              确定
            </button>
          </div>
        `;

        overlay.appendChild(notification);
        document.body.appendChild(overlay);

        // ✅ 确定按钮点击事件
        document.getElementById('btnUpdateConfirm').addEventListener('click', async () => {
          const btn = document.getElementById('btnUpdateConfirm');
          btn.textContent = '更新中...';
          btn.disabled = true;
          btn.style.opacity = '0.7';

          try {
            // 通知 Service Worker 跳过等待
            if (registration && registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            // 清除所有缓存
            if (registration) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(name => caches.delete(name)));
            }

            // 记录已显示通知
            localStorage.setItem('update_notification_shown', APP_VERSION);

            // 重新加载页面
            setTimeout(() => {
              window.location.reload();
            }, 500);
          } catch (err) {
            console.error('更新失败:', err);
            alert('更新失败，请手动刷新页面');
            overlay.remove();
          }
        });

        // ✅ 点击遮罩层也可以关闭（可选）
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            // 点击遮罩层不关闭，必须点击确定按钮
            // overlay.remove();
          }
        });
      }

      // ✅ 监听 Service Worker 控制权变化（全局变量，在 updatefound 中也会用到）
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('🔄 Service Worker 已更新，重新加载页面');
          window.location.reload();
        }
      });
      
      // ✅ 页面加载时立即检查是否有等待中的更新（已在上面处理，这里保留作为备用）
      // 注意：这个监听器在 Service Worker 注册成功后也会执行
    } else {
      console.warn('⚠️ 浏览器不支持 Service Worker');
    }

    // ✅ 添加动画样式
    if (!document.querySelector('style[data-update-animation]')) {
      const style = document.createElement('style');
      style.setAttribute('data-update-animation', 'true');
      style.textContent = `
        @keyframes slideIn {
          from { 
            opacity: 0; 
            transform: scale(0.9) translateY(-20px); 
          }
          to { 
            opacity: 1; 
            transform: scale(1) translateY(0); 
          }
        }
        @keyframes fadeOut {
          from { opacity: 1; transform: translateX(-50%) translateY(0); }
          to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
      `;
      document.head.appendChild(style);
    }
  </script>
</body>
</html>
