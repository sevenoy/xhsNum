<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>管理中心 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-touch-icon.png?v=20251107">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="icon" type="image/x-icon" href="./icon/favicon.ico?v=20251107">
  <link rel="shortcut icon" href="./icon/favicon.ico?v=20251107">
  <link rel="manifest" href="./site.webmanifest">
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1990FF" />
  <meta name="apple-mobile-web-app-title" content="管理中心" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    /* ✅ 覆盖 style.css 中的全局样式 */
    body { 
      background:#f5f5f7 !important; 
      margin: 0 !important;
      padding: 0 !important;
    }
    .admin-wrap { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .admin-header {
      display:flex; 
      justify-content: space-between; 
      align-items:center;
      background:#fff; 
      border-radius:12px; 
      padding:12px 16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      flex-shrink: 0;
      margin-bottom: 12px;
    }
    .admin-header h1 {
      font-size: 20px; /* ✅ 保持副标题大小，这是唯一的大标题 */
      margin: 0;
      color: #1990FF;
    }
    .nav {
      display:flex; 
      gap:8px; 
      flex-wrap:wrap; 
      margin-bottom: 12px;
      background:#fff; 
      border-radius:12px; 
      padding:10px; 
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    /* 手机端：确保按钮按指定顺序排列 */
    @media (max-width: 480px) {
      .nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      /* Grid布局会按照DOM顺序自动排列，由于管理员按钮会被移除，
         普通用户看到的顺序就是：快照浏览器、显示设置、分类设置、最近修改 */
    }
    .nav button {
      padding:8px 16px; 
      border:none; 
      border-radius:999px; 
      cursor:pointer; 
      background:#f5f5f7;
      font-weight:500;
      font-size: 14px; /* ✅ 统一字体大小 */
      transition: all 0.2s ease;
    }
    .nav button:hover {
      background: #e5e5ea;
    }
    .nav button.active { 
      background:#1990FF; 
      color:#fff; 
    }
    /* ✅ 默认隐藏管理员按钮，防止FOUC（Flash of Unstyled Content） */
    .nav button.admin-only {
      display: none !important;
      visibility: hidden !important;
    }
    .panel {
      background:#fff !important; /* ✅ 强制白色背景 */
      border-radius:12px; 
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
      overflow:hidden; 
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .panel iframe { 
      width:100%; 
      height:100%; 
      border:0; 
      display: block;
      background: #fff !important; /* ✅ 强制白色背景 */
      pointer-events: auto !important; /* ✅ 确保可以交互和选择元素 */
      user-select: text; /* ✅ 允许选择文本 */
      -webkit-user-select: text; /* ✅ Safari 支持 */
      -moz-user-select: text; /* ✅ Firefox 支持 */
    }
    /* 手机端优化 */
    @media (max-width: 768px) {
      .admin-wrap {
        padding: 12px;
      }
      .admin-header {
        padding: 10px 12px;
      }
      .admin-header h1 {
        font-size: 18px;
      }
      .nav {
        padding: 8px;
        gap: 6px;
        margin-bottom: 10px;
      }
      .nav button {
        padding: 6px 12px;
        font-size: 14px; /* ✅ 统一字体大小 */
      }
    }
    @media (max-width: 480px) {
      .admin-wrap {
        padding: 8px;
      }
      .admin-header {
        padding: 8px 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .admin-header h1 {
        font-size: 16px;
      }
      .admin-header button {
        font-size: 12px;
        padding: 6px 10px;
      }
      .nav {
        padding: 6px;
        gap: 6px;
        margin-bottom: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: visible;
      }
      .nav button {
        padding: 6px 10px;
        font-size: 14px; /* ✅ 统一字体大小 */
        white-space: nowrap;
        width: 100%;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
      const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
      const { createClient } = supabase;
      const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await client.auth.getSession();
      if (!session) { alert('请先登录'); location.href='login.html'; return; }
      const adminSidebarAvatar = document.getElementById('adminSidebarAvatar');
      const adminSidebarCloudText = document.getElementById('adminSidebarCloudText');
      const adminHomeButton = document.querySelector('[data-admin-sidebar-action="home"]');
      const displayName = localStorage.getItem('xhs_user_name') || session.user?.email || 'O';
      const avatarSeed = String(displayName).trim();
      const latinInitial = avatarSeed.match(/[A-Za-z]/);
      const fallbackInitial = avatarSeed.charAt(0);
      if (adminSidebarAvatar) {
        adminSidebarAvatar.textContent = (latinInitial ? latinInitial[0] : fallbackInitial || 'O').toUpperCase();
      }
      if (adminSidebarCloudText) {
        adminSidebarCloudText.textContent = '已链接';
      }
      if (adminHomeButton) {
        adminHomeButton.addEventListener('click', () => {
          location.href = 'index.html';
        });
      }
      // ✅ 修复权限检查：优先从数据库查询，确保只有sevenoy管理员才能看到管理按钮
      let isAdmin = false;
      try {
        const { data: profile } = await client
          .from('user_profiles')
          .select('username, role')
          .eq('user_id', session.user.id)
          .maybeSingle();
        // 只有用户名为 sevenoy 或 role 为 super_admin 才是管理员
        if (profile) {
          const username = (profile.username || '').toLowerCase();
          isAdmin = username === 'sevenoy' || profile.role === 'super_admin';
        }
      } catch (err) {
        console.error('查询管理员权限失败:', err);
        // 查询失败时，明确设置为非管理员
        isAdmin = false;
      }
      // 同步更新localStorage，但以数据库查询为准
      localStorage.setItem('xhs_is_admin', isAdmin ? 'true' : 'false');
      // 路由元数据（权限）
      const ROUTES = {
        'approval-management.html': { requiresAdmin: true },
        'user-management.html': { requiresAdmin: true },
        'permission-management.html': { requiresAdmin: true },
        'snapshot-browser.html': { requiresAdmin: false },
        'view-settings.html': { requiresAdmin: false },
        'recent-changes.html': { requiresAdmin: false },
        'category-settings.html': { requiresAdmin: false },
      };
      // 控制导航可见性 - 确保只有sevenoy管理员才能看到管理按钮
      const btnApproval = document.getElementById('btnApproval');
      const btnUser = document.getElementById('btnUser');
      const btnPerm = document.getElementById('btnPerm');
      const btnSnap = document.getElementById('btnSnap');
      const btnView = document.getElementById('btnView');
      const btnRecent = document.getElementById('btnRecent');
      const btnCategory = document.getElementById('btnCategory');
      // ✅ 管理员按钮默认已通过CSS隐藏（防止FOUC），这里只需要在确认是管理员后显示
      if (isAdmin) {
        // 如果是管理员，移除admin-only类，显示按钮
        if (btnApproval) {
          btnApproval.classList.remove('admin-only');
        }
        if (btnUser) {
          btnUser.classList.remove('admin-only');
        }
        if (btnPerm) {
          btnPerm.classList.remove('admin-only');
        }
      } else {
        // 如果不是管理员，确保按钮被隐藏并移除DOM元素（双重保护）
        if (btnApproval) {
          btnApproval.remove(); // 彻底移除DOM元素
        }
        if (btnUser) {
          btnUser.remove();
        }
        if (btnPerm) {
          btnPerm.remove();
        }
      }
      // 默认打开：管理员→权限管理；普通用户→快照浏览器
      // 如果 URL 中有 module 参数，则打开指定模块
      const urlParams = new URLSearchParams(window.location.search);
      const moduleParam = urlParams.get('module');
      const map = {
        'permission-management.html':'btnPerm',
        'snapshot-browser.html':'btnSnap',
        'view-settings.html':'btnView',
        'approval-management.html':'btnApproval',
        'user-management.html':'btnUser',
        'recent-changes.html':'btnRecent',
        'category-settings.html':'btnCategory'
      };
      if (moduleParam) {
        const btnId = map[moduleParam];
        const btn = btnId ? document.getElementById(btnId) : null;
        if (btn) {
          switchModule(moduleParam, btn);
        } else {
          // 如果找不到对应的按钮，使用默认逻辑
          if (isAdmin) {
            switchModule('permission-management.html', btnPerm);
          } else {
            switchModule('snapshot-browser.html', btnSnap);
          }
        }
      } else if (isAdmin) {
        switchModule('permission-management.html', btnPerm);
      } else {
        switchModule('snapshot-browser.html', btnSnap);
      }
      // 导航点击拦截
      [btnApproval, btnUser, btnPerm, btnSnap, btnView, btnRecent, btnCategory].forEach((btn) => {
        if (!btn) return;
        btn.addEventListener('click', (e) => {
          const url = btn.getAttribute('onclick') ? null : null;
        });
      });
      // 暴露权限与路由和按钮映射
      window.__isAdmin = isAdmin;
      window.__ROUTES = ROUTES;
      window.__BUTTON_MAP = map;
      
      // ✅ 更新管理中心的总数据数和版本号显示
      async function updateAdminStats() {
        try {
          const adminTotalCountEl = document.getElementById('adminTotalDataCount');
          const adminVersionEl = document.getElementById('adminStatsVersion');
          
          // 更新版本号（从 index.html 解析）
          if (adminVersionEl) {
            try {
              const response = await fetch('./index.html?v=' + Date.now());
              const html = await response.text();
              const versionMatch = html.match(/const APP_VERSION = ['"](V\d{6}\.\d+)['"]/);
              if (versionMatch && versionMatch[1]) {
                adminVersionEl.textContent = `版本 ${versionMatch[1]}`;
                console.log('✅ 管理中心版本号已更新:', versionMatch[1]);
              } else {
                adminVersionEl.textContent = '版本 未知';
                console.warn('⚠️ 无法从 index.html 解析版本号');
              }
            } catch (err) {
              console.error('读取版本号失败:', err);
              adminVersionEl.textContent = '版本 未知';
            }
          }
          
          // 更新总数据数（从 IndexedDB 读取）
          if (adminTotalCountEl) {
            try {
              // 动态导入 Dexie 和 config
              const DexieModule = await import('https://esm.sh/dexie@4.0.8');
              const Dexie = DexieModule.default || DexieModule;
              const configModule = await import('./js/config.js');
              const DB_NAME = configModule.DB_NAME || 'xhs_db';
              
              // 初始化数据库
              const db = new Dexie(DB_NAME);
              db.version(2).stores({
                rows: "id,order,phone,owner,wx_real,wx_name,xhs_name,note1,row_color,updated_at",
                meta: "key"
              });
              
              // 打开数据库
              if (!db.isOpen()) {
                await db.open();
              }
              
              // 读取所有数据
              const all = await db.rows.toArray();
              const totalCount = all.length;
              adminTotalCountEl.textContent = `总数据：${totalCount}条`;
              console.log('✅ 管理中心总数据数已更新:', totalCount);
            } catch (err) {
              console.error('从 IndexedDB 读取总数据数失败:', err);
              // 尝试从 Supabase 查询作为备用方案
              try {
                const SUPABASE_TABLE = localStorage.getItem('xhs_supabase_table') || 'xhs_data';
                const { data, error } = await client
                  .from(SUPABASE_TABLE)
                  .select('payload')
                  .eq('key', 'default')
                  .maybeSingle();
                
                if (!error && data && data.payload && data.payload.rows) {
                  const totalCount = Array.isArray(data.payload.rows) ? data.payload.rows.length : 0;
                  adminTotalCountEl.textContent = `总数据：${totalCount}条`;
                  console.log('✅ 从 Supabase 读取总数据数:', totalCount);
                } else {
                  adminTotalCountEl.textContent = '总数据：0条';
                }
              } catch (supabaseErr) {
                console.error('Supabase 查询也失败:', supabaseErr);
                adminTotalCountEl.textContent = '总数据：-';
              }
            }
          }
        } catch (err) {
          console.error('更新管理中心统计信息失败:', err);
        }
      }
      
      // 延迟一下再更新，确保页面加载完成
      setTimeout(() => {
        updateAdminStats();
        // 定期更新（每5秒）
        setInterval(updateAdminStats, 5000);
      }, 1000);
    });
    function switchModule(url, el) {
      // 基于路由元数据做权限拦截
      const meta = (window.__ROUTES && window.__ROUTES[url]) || { requiresAdmin: false };
      if (meta.requiresAdmin && !window.__isAdmin) {
        alert('⚠️ 无权限访问该页面');
        url = 'snapshot-browser.html';
      }
      const frame = document.getElementById('adminFrame');
      frame.src = url;
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      // 高亮（map 在外部作用域已定义）
      const id = (window.__BUTTON_MAP && window.__BUTTON_MAP[url]) || null;
      if (id) {
        const btn = document.getElementById(id);
        if (btn) btn.classList.add('active');
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css?v=V260601.2-subpages">
  <style>

      --admin-sidebar-width: clamp(156px, 20vw, 224px);
      overflow: hidden !important;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(242, 245, 247, 0.96)),
        var(--pearl-surface) !important;
    }

    body.admin-with-sidebar .admin-sidebar {
      width: var(--admin-sidebar-width) !important;

      box-sizing: border-box !important;
      overflow: hidden auto !important;

    body.admin-with-sidebar .admin-sidebar .sidebar-profile {
      justify-content: center !important;

    }

      height: clamp(38px, 4.8vh, 48px) !important;
      flex-basis: clamp(38px, 4.8vh, 48px) !important;
      font-size: clamp(15px, 1.8vh, 18px) !important;
    }

    body.admin-with-sidebar .admin-sidebar .sidebar-nav {
      gap: clamp(7px, 1vh, 10px) !important;
      padding: 0 !important;
      flex: 0 0 auto !important;
    }

    body.admin-with-sidebar .admin-sidebar .sidebar-nav-item {
      min-height: clamp(40px, 4.8vh, 48px) !important;

    }

    body.admin-with-sidebar .admin-wrap {
      width: calc(100vw - var(--admin-sidebar-width)) !important;

      overflow: hidden !important;
    }

    body.admin-with-sidebar .admin-wrap > .admin-header {
      min-height: 58px !important;
      padding: 10px 14px !important;
    }

    body.admin-with-sidebar .admin-wrap > .admin-header > div:first-child {
      flex: 1 1 auto !important;

    }

    body.admin-with-sidebar .admin-wrap > .nav {
      height: auto !important;

    }

    body.admin-with-sidebar .admin-wrap > .nav button.admin-only {
      display: none !important;
      visibility: hidden !important;
    }

    body.admin-with-sidebar .admin-wrap > .panel {
      min-height: 0 !important;
    }

    @media (max-width: 640px) {
      body.admin-with-sidebar {
        --admin-sidebar-width: 64px;
      }

      body.admin-with-sidebar .admin-sidebar {
        padding: 12px 8px !important;
      }

      body.admin-with-sidebar .admin-sidebar .sidebar-profile {
        padding-bottom: 12px !important;
        margin-bottom: 12px !important;
      }

      body.admin-with-sidebar .admin-sidebar .sidebar-app-version {
        display: none !important;
      }

      body.admin-with-sidebar .admin-sidebar .sidebar-nav {
        --sidebar-icon-col: 1fr;
        --sidebar-text-gap: 0;
        --sidebar-item-pad-x: 0;
        gap: 8px !important;
      }

      body.admin-with-sidebar .admin-sidebar .sidebar-nav-item {
        display: inline-flex !important;
        justify-content: center !important;
        width: 48px !important;
        min-height: 48px !important;
        padding: 0 !important;
      }

      body.admin-with-sidebar .admin-sidebar .sidebar-nav-item > span:not(.sidebar-icon) {
        display: none !important;
      }

      body.admin-with-sidebar .admin-wrap {
        padding: 10px !important;
        gap: 10px !important;
      }

      body.admin-with-sidebar .admin-wrap > .admin-header h1 {
        font-size: 18px !important;
      }

      body.admin-with-sidebar #adminTotalDataCount,
      body.admin-with-sidebar #adminStatsVersion {
        min-height: 24px !important;
        padding: 0 8px !important;
        font-size: 11px !important;
      }
    }
  </style>
  </head>
<body class="subpage-shell admin-with-sidebar sidebar-expanded">
  <aside class="app-sidebar admin-sidebar" aria-label="主导航">
    <div class="sidebar-profile">
      <div id="adminSidebarAvatar" class="sidebar-avatar" aria-hidden="true">O</div>
      <div id="adminSidebarAppVersion" class="sidebar-app-version">V260601.15</div>
    </div>
    <nav class="sidebar-nav" aria-label="功能导航">
      <button type="button" class="sidebar-nav-item" data-admin-sidebar-action="home">
        <span class="sidebar-icon">▦</span>
        <span>号码管理</span>
      </button>
      <button type="button" class="sidebar-nav-item active" data-admin-sidebar-action="admin" aria-current="page">
        <span class="sidebar-icon">◎</span>
        <span>管理页面</span>
      </button>
    </nav>
  </aside>
  <div class="admin-wrap">
    <div class="admin-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="margin:0; color:#1990FF;">⚙️ 管理中心</h1>
        <span id="adminTotalDataCount" style="color: #007aff; font-size: 14px; font-weight: normal;">总数据：0条</span>
        <span style="color: #ccc;">|</span>
        <span id="adminStatsVersion" style="color: #007aff; font-size: 14px; font-weight: normal;">版本 未知</span>
      </div>
    </div>
    <div class="nav">
      <!-- 管理员专用按钮（只有sevenoy管理员可见）- 默认隐藏，防止FOUC -->
      <button id="btnApproval" class="admin-only" onclick="switchModule('approval-management.html', this)">📋 审核管理</button>
      <button id="btnUser" class="admin-only" onclick="switchModule('user-management.html', this)">👥 用户管理</button>
      <button id="btnPerm" class="admin-only" onclick="switchModule('permission-management.html', this)">🔐 权限管理</button>
      <!-- 普通用户可见的按钮（按手机端布局顺序） -->
      <button id="btnSnap" onclick="switchModule('snapshot-browser.html', this)">📂 快照浏览器</button>
      <button id="btnView" onclick="switchModule('view-settings.html', this)">⚙️ 显示设置</button>
      <button id="btnCategory" onclick="switchModule('category-settings.html', this)">🏷️ 分类设置</button>
      <button id="btnRecent" onclick="switchModule('recent-changes.html', this)">📝 最近修改</button>
    </div>
    <div class="panel">
      <iframe id="adminFrame" title="管理模块" style="background: #fff !important; pointer-events: auto !important;"></iframe>
    </div>
  </div>
</body>
