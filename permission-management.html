<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>权限管理 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: #f5f5f7;
    }
    .permission-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .header h1 {
      font-size: 28px;
      color: #1990FF;
      margin: 0;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 24px;
      border-radius: 999px;
      cursor: pointer;
      background: white;
      border: 2px solid #e5e5ea;
      font-weight: 500;
      transition: all 0.3s;
    }
    .tab:hover {
      border-color: #1990FF;
    }
    .tab.active {
      background: #1990FF;
      color: white;
      border-color: #1990FF;
    }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-box input {
      flex: 1;
      min-width: 200px;
    }
    .grant-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      padding: 20px;
      background: #f9f9fb;
      border-radius: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    .permission-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .permission-table th,
    .permission-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    .permission-table th {
      font-weight: 600;
      color: #333;
      background: #f9f9fb;
      position: sticky;
      top: 0;
    }
    .permission-table tbody tr:hover {
      background: #f5f7ff;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.view {
      background: #e3f2fd;
      color: #1976d2;
    }
    .badge.edit {
      background: #fff3e0;
      color: #f57c00;
    }
    .badge.active {
      background: #d4edda;
      color: #155724;
    }
    .badge.expired {
      background: #f8d7da;
      color: #721c24;
    }
    .badge.revoked {
      background: #e2e3e5;
      color: #6c757d;
    }
    .action-btn {
      padding: 4px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin: 0 2px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-revoke {
      background: #ff4d4f;
      color: white;
    }
    .btn-revoke:hover {
      background: #d9363e;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: #1990FF;
    }
  </style>
</head>
<body>
  <div class="permission-container">
    <!-- 头部 -->
    <div class="header">
      <h1>🔐 权限管理</h1>
      <div style="display: flex; gap: 10px;">
        <button class="ghost" onclick="location.href='index.html'">返回主页</button>
      </div>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
      <div class="tab active" data-tab="grant">授予权限</div>
      <div class="tab" data-tab="my-permissions">我的权限</div>
      <div class="tab" data-tab="requests">权限申请</div>
    </div>

    <!-- 授予权限面板 -->
    <div id="grantPanel" class="panel">
      <h3 style="margin-bottom: 20px;">授予权限给其他用户</h3>
      
      <div class="grant-form">
        <div class="form-group">
          <label>用户（用户名）</label>
          <input type="text" id="grantUsername" placeholder="输入用户名">
        </div>
        <div class="form-group">
          <label>权限类型</label>
          <select id="permissionType">
            <option value="view">查看</option>
            <option value="edit">编辑</option>
          </select>
        </div>
        <div class="form-group">
          <label>有效期（可选）</label>
          <input type="datetime-local" id="expiredAt">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button class="primary" id="btnGrant" style="margin-top: 20px;">授予权限</button>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #f0f7ff; border-radius: 8px; font-size: 13px; color: #666;">
          💡 提示：将授予该用户访问你的默认快照（default）的权限
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="searchGranted" placeholder="搜索已授予的权限...">
      </div>

      <div id="grantedPermissionsList">
        <div class="loading-state">加载中...</div>
      </div>
    </div>

    <!-- 我的权限面板 -->
    <div id="myPermissionsPanel" class="panel" style="display:none;">
      <h3 style="margin-bottom: 20px;">我被授予的权限</h3>
      
      <div class="search-box">
        <input type="text" id="searchMyPermissions" placeholder="搜索我的权限...">
      </div>

      <div id="myPermissionsList">
        <div class="loading-state">加载中...</div>
      </div>
    </div>

    <!-- 权限申请面板 -->
    <div id="requestsPanel" class="panel" style="display:none;">
      <h3 style="margin-bottom: 20px;">权限申请</h3>
      
      <div class="tabs" style="margin-bottom: 20px;">
        <div class="tab active" data-status="pending">待审批</div>
        <div class="tab" data-status="approved">已批准</div>
        <div class="tab" data-status="rejected">已拒绝</div>
      </div>

      <div id="requestsList">
        <div class="loading-state">加载中...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 检查登录
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      alert('请先登录');
      window.location.href = 'login.html';
    }

    const currentUserId = session.user.id;
    const currentUserName = localStorage.getItem('xhs_user_name') || '当前用户';

    // 角色校验（仅管理员可访问）
    try {
      let isAdmin = false;
      const { data: profile } = await supabaseClient
        .from('user_profiles')
        .select('role, username')
        .eq('user_id', currentUserId)
        .maybeSingle();
      if (profile) {
        isAdmin = profile.role === 'super_admin' || (profile.username || '').toLowerCase() === 'sevenoy';
      }
      if (!isAdmin) {
        alert('⚠️ 您没有管理员权限');
        window.location.href = 'admin.html';
      }
    } catch (e) {
      console.warn('管理员校验失败：', e?.message || e);
    }

    // 标签页切换
    document.querySelectorAll('.tab[data-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.getAttribute('data-tab');
        
        // 切换标签激活状态
        document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // 切换面板
        document.querySelectorAll('[id$="Panel"]').forEach(p => p.style.display = 'none');
        document.getElementById(targetTab + 'Panel').style.display = 'block';
        
        // 加载对应数据
        if (targetTab === 'grant') {
          loadGrantedPermissions();
        } else if (targetTab === 'my-permissions') {
          loadMyPermissions();
        } else if (targetTab === 'requests') {
          loadPermissionRequests('pending');
        }
      });
    });

    // 授予权限
    document.getElementById('btnGrant').addEventListener('click', async () => {
      const username = document.getElementById('grantUsername').value.trim();
      const permissionType = document.getElementById('permissionType').value;
      const expiredAt = document.getElementById('expiredAt').value;

      if (!username) {
        alert('请填写用户名');
        return;
      }

      try {
        // 1. 查询用户
        const { data: userProfile } = await supabaseClient
          .from('user_profiles')
          .select('user_id, username')
          .eq('username', username)
          .single();

        if (!userProfile) {
          alert('用户不存在');
          return;
        }

        // 2. 检查是否是默认快照的所有者（或创建默认快照）
        const resourceId = 'default';
        const resourceType = 'snapshot';
        
        // 检查默认快照是否存在，如果不存在则创建
        const { data: existingSnapshot } = await supabaseClient
          .from('xhsphone_snapshot')
          .select('key, owner_id')
          .eq('key', resourceId)
          .maybeSingle();
        
        if (!existingSnapshot) {
          // 如果默认快照不存在，创建一个空的快照
          const { error: createError } = await supabaseClient
            .from('xhsphone_snapshot')
            .insert({
              key: resourceId,
              owner_id: currentUserId,
              payload: { ver: 1, rows: [], cats: [], view: {} },
              updated_at: new Date().toISOString()
            });
          
          if (createError) {
            console.error('创建默认快照失败:', createError);
            // 继续执行，可能快照已存在
          }
        } else if (existingSnapshot.owner_id !== currentUserId) {
          alert('❌ 您不是默认快照的所有者\n\n只有所有者可以授予权限');
          return;
        }

        // 3. 检查是否已经授予过权限
        const { data: existingPermission } = await supabaseClient
          .from('permissions')
          .select('id, status')
          .eq('resource_id', resourceId)
          .eq('resource_type', resourceType)
          .eq('user_id', userProfile.user_id)
          .maybeSingle();

        if (existingPermission) {
          if (existingPermission.status === 'active') {
            // 如果权限已存在且是激活状态，更新权限类型
            const { error: updateError } = await supabaseClient
              .from('permissions')
              .update({
                permission_type: permissionType,
                expired_at: expiredAt ? new Date(expiredAt).toISOString() : null,
                status: 'active'
              })
              .eq('id', existingPermission.id);

            if (updateError) throw updateError;
            alert('✅ 权限已更新！');
            // 操作日志（忽略失败）
            try {
              await supabaseClient.from('operation_logs').insert({
                action: 'permission_update',
                target: `default:${userProfile.user_id}`,
                user_id: currentUserId,
                details: `更新 ${username} 权限为 ${permissionType}`,
                created_at: new Date().toISOString()
              });
            } catch (_) {}
          } else {
            // 如果权限已存在但被撤销或过期，重新激活
            const { error: updateError } = await supabaseClient
              .from('permissions')
              .update({
                permission_type: permissionType,
                expired_at: expiredAt ? new Date(expiredAt).toISOString() : null,
                status: 'active'
              })
              .eq('id', existingPermission.id);

            if (updateError) throw updateError;
            alert('✅ 权限已重新激活！');
            try {
              await supabaseClient.from('operation_logs').insert({
                action: 'permission_reactivate',
                target: `default:${userProfile.user_id}`,
                user_id: currentUserId,
                details: `重新激活 ${username} 权限为 ${permissionType}`,
                created_at: new Date().toISOString()
              });
            } catch (_) {}
          }
        } else {
          // 4. 授予新权限
          const { error } = await supabaseClient
            .from('permissions')
            .insert({
              resource_id: resourceId,
              resource_type: resourceType,
              user_id: userProfile.user_id,
              permission_type: permissionType,
              granted_by: currentUserId,
              granted_by_name: currentUserName,
              expired_at: expiredAt ? new Date(expiredAt).toISOString() : null,
              status: 'active'
            });

          if (error) throw error;
          alert('✅ 权限授予成功！');
          try {
            await supabaseClient.from('operation_logs').insert({
              action: 'permission_grant',
              target: `default:${userProfile.user_id}`,
              user_id: currentUserId,
              details: `授予 ${username} 权限 ${permissionType}`,
              created_at: new Date().toISOString()
            });
          } catch (_) {}
        }
        
        // 重置表单
        document.getElementById('grantUsername').value = '';
        document.getElementById('expiredAt').value = '';
        
        // 重新加载列表
        loadGrantedPermissions();

      } catch (err) {
        console.error('授予权限失败:', err);
        alert('❌ 操作失败：' + err.message);
      }
    });

    // 加载已授予的权限
    async function loadGrantedPermissions() {
      const listEl = document.getElementById('grantedPermissionsList');
      listEl.innerHTML = '<div class="loading-state">加载中...</div>';

      try {
        const { data: permissions, error } = await supabaseClient
          .from('permissions')
          .select('*')
          .eq('granted_by', currentUserId)
          .order('created_at', { ascending: false });

        if (error) throw error;

        // 分别查询用户信息
        if (permissions && permissions.length > 0) {
          const userIds = [...new Set(permissions.map(p => p.user_id))];
          const { data: userProfiles } = await supabaseClient
            .from('user_profiles')
            .select('user_id, username, email')
            .in('user_id', userIds);

          // 将用户信息添加到权限对象中
          const userMap = {};
          if (userProfiles) {
            userProfiles.forEach(profile => {
              userMap[profile.user_id] = profile;
            });
          }

          permissions.forEach(p => {
            p.user_profiles = userMap[p.user_id];
          });
        }

        if (!permissions || permissions.length === 0) {
          listEl.innerHTML = '<div class="empty-state">暂无已授予的权限</div>';
          return;
        }

        // 检查过期权限
        const now = new Date();
        const updatedPermissions = permissions.map(p => {
          if (p.expired_at && new Date(p.expired_at) < now && p.status === 'active') {
            p.status = 'expired';
          }
          return p;
        });

        listEl.innerHTML = `
          <table class="permission-table">
            <thead>
              <tr>
                <th>资源类型</th>
                <th>资源ID</th>
                <th>用户</th>
                <th>权限类型</th>
                <th>授予时间</th>
                <th>有效期</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${updatedPermissions.map(p => {
                const username = p.user_profiles?.username || '未知';
                const expiredDate = p.expired_at ? new Date(p.expired_at).toLocaleString('zh-CN') : '永久';
                const statusClass = p.status === 'active' ? 'active' : p.status === 'expired' ? 'expired' : 'revoked';
                const statusText = p.status === 'active' ? '有效' : p.status === 'expired' ? '已过期' : '已撤销';
                const resourceName = p.resource_id === 'default' ? '默认快照' : p.resource_id;
                
                return `
                  <tr>
                    <td>${p.resource_type === 'snapshot' ? '快照' : '行数据'}</td>
                    <td>${resourceName}</td>
                    <td>${username}</td>
                    <td><span class="badge ${p.permission_type}">${p.permission_type === 'view' ? '查看' : '编辑'}</span></td>
                    <td>${new Date(p.created_at).toLocaleString('zh-CN')}</td>
                    <td>${expiredDate}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>
                      ${p.status === 'active' ? `
                        <button class="action-btn btn-revoke" onclick="revokePermission('${p.id}')">撤销</button>
                      ` : '-'}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

      } catch (err) {
        console.error('加载权限失败:', err);
        listEl.innerHTML = '<div class="empty-state">❌ 加载失败：' + err.message + '</div>';
      }
    }

    // 撤销权限
    window.revokePermission = async function(permissionId) {
      if (!confirm('确定要撤销此权限吗？')) return;

      try {
        const { data: oldPerm } = await supabaseClient
          .from('permissions')
          .select('user_id')
          .eq('id', permissionId)
          .single();
        const { error } = await supabaseClient
          .from('permissions')
          .update({ status: 'revoked' })
          .eq('id', permissionId);

        if (error) throw error;

        alert('✅ 权限已撤销');
        loadGrantedPermissions();
        // 操作日志（忽略失败）
        try {
          await supabaseClient.from('operation_logs').insert({
            action: 'permission_revoke',
            target: `default:${oldPerm?.user_id || ''}`,
            user_id: currentUserId,
            details: `撤销权限记录 ${permissionId}`,
            created_at: new Date().toISOString()
          });
        } catch (_) {}

      } catch (err) {
        console.error('撤销权限失败:', err);
        alert('❌ 操作失败：' + err.message);
      }
    };

    // 加载我的权限
    async function loadMyPermissions() {
      const listEl = document.getElementById('myPermissionsList');
      listEl.innerHTML = '<div class="loading-state">加载中...</div>';

      try {
        const { data: permissions, error } = await supabaseClient
          .from('permissions')
          .select('*')
          .eq('user_id', currentUserId)
          .eq('status', 'active')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // 分别查询授予人信息
        if (permissions && permissions.length > 0) {
          const grantedByIds = [...new Set(permissions.map(p => p.granted_by).filter(Boolean))];
          if (grantedByIds.length > 0) {
            const { data: userProfiles } = await supabaseClient
              .from('user_profiles')
              .select('user_id, username')
              .in('user_id', grantedByIds);

            // 将用户信息添加到权限对象中
            const userMap = {};
            if (userProfiles) {
              userProfiles.forEach(profile => {
                userMap[profile.user_id] = profile;
              });
            }

            permissions.forEach(p => {
              if (p.granted_by) {
                p.user_profiles = userMap[p.granted_by];
              }
            });
          }
        }

        // 检查过期权限
        const now = new Date();
        const activePermissions = permissions.filter(p => {
          if (p.expired_at && new Date(p.expired_at) < now) {
            return false;
          }
          return true;
        });

        if (activePermissions.length === 0) {
          listEl.innerHTML = '<div class="empty-state">暂无被授予的权限</div>';
          return;
        }

        listEl.innerHTML = `
          <table class="permission-table">
            <thead>
              <tr>
                <th>资源类型</th>
                <th>资源ID</th>
                <th>授予人</th>
                <th>权限类型</th>
                <th>授予时间</th>
                <th>有效期</th>
              </tr>
            </thead>
            <tbody>
              ${activePermissions.map(p => {
                const grantedBy = p.user_profiles?.username || p.granted_by_name || '未知';
                const expiredDate = p.expired_at ? new Date(p.expired_at).toLocaleString('zh-CN') : '永久';
                const resourceName = p.resource_id === 'default' ? '默认快照' : p.resource_id;
                
                return `
                  <tr>
                    <td>${p.resource_type === 'snapshot' ? '快照' : '行数据'}</td>
                    <td>${resourceName}</td>
                    <td>${grantedBy}</td>
                    <td><span class="badge ${p.permission_type}">${p.permission_type === 'view' ? '查看' : '编辑'}</span></td>
                    <td>${new Date(p.created_at).toLocaleString('zh-CN')}</td>
                    <td>${expiredDate}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

      } catch (err) {
        console.error('加载我的权限失败:', err);
        listEl.innerHTML = '<div class="empty-state">❌ 加载失败：' + err.message + '</div>';
      }
    }

    // 加载权限申请
    async function loadPermissionRequests(status = 'pending') {
      const listEl = document.getElementById('requestsList');
      listEl.innerHTML = '<div class="loading-state">加载中...</div>';

      try {
        let query = supabaseClient
          .from('permission_requests')
          .select('*')
          .eq('status', status)
          .order('created_at', { ascending: false });

        // 如果是待审批，只显示针对当前用户资源的申请
        if (status === 'pending') {
          // 这里需要根据资源类型查询
          // 简化处理：显示所有待审批的申请
        }

        const { data: requests, error } = await query;

        if (error) throw error;

        if (!requests || requests.length === 0) {
          listEl.innerHTML = '<div class="empty-state">暂无申请</div>';
          return;
        }

        listEl.innerHTML = `
          <table class="permission-table">
            <thead>
              <tr>
                <th>申请人</th>
                <th>资源类型</th>
                <th>资源ID</th>
                <th>权限类型</th>
                <th>申请时间</th>
                <th>原因</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${requests.map(r => `
                <tr>
                  <td>${r.requester_name || '未知'}</td>
                  <td>${r.resource_type === 'snapshot' ? '快照' : '行数据'}</td>
                  <td>${r.resource_id}</td>
                  <td><span class="badge ${r.permission_type}">${r.permission_type === 'view' ? '查看' : '编辑'}</span></td>
                  <td>${new Date(r.created_at).toLocaleString('zh-CN')}</td>
                  <td>${r.reason || '-'}</td>
                  <td>
                    ${status === 'pending' ? `
                      <button class="action-btn" style="background:#34c759;color:white;" onclick="approveRequest('${r.id}')">批准</button>
                      <button class="action-btn btn-revoke" onclick="rejectRequest('${r.id}')">拒绝</button>
                    ` : '-'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

      } catch (err) {
        console.error('加载申请失败:', err);
        listEl.innerHTML = '<div class="empty-state">❌ 加载失败：' + err.message + '</div>';
      }
    }

    // 审批申请
    window.approveRequest = async function(requestId) {
      if (!confirm('确定批准此权限申请吗？')) return;

      try {
        // 1. 获取申请信息
        const { data: request } = await supabaseClient
          .from('permission_requests')
          .select('*')
          .eq('id', requestId)
          .single();

        if (!request) {
          alert('申请不存在');
          return;
        }

        // 2. 创建权限
        const { error: permError } = await supabaseClient
          .from('permissions')
          .insert({
            resource_id: request.resource_id,
            resource_type: request.resource_type,
            user_id: request.requester_id,
            permission_type: request.permission_type,
            granted_by: currentUserId,
            granted_by_name: currentUserName,
            status: 'active'
          });

        if (permError) throw permError;

        // 3. 更新申请状态
        const { error: updateError } = await supabaseClient
          .from('permission_requests')
          .update({
            status: 'approved',
            reviewed_by: currentUserId,
            reviewed_by_name: currentUserName,
            reviewed_at: new Date().toISOString()
          })
          .eq('id', requestId);

        if (updateError) throw updateError;

        alert('✅ 申请已批准');
        loadPermissionRequests('pending');

      } catch (err) {
        console.error('批准申请失败:', err);
        alert('❌ 操作失败：' + err.message);
      }
    };

    // 拒绝申请
    window.rejectRequest = async function(requestId) {
      if (!confirm('确定拒绝此权限申请吗？')) return;

      try {
        const { error } = await supabaseClient
          .from('permission_requests')
          .update({
            status: 'rejected',
            reviewed_by: currentUserId,
            reviewed_by_name: currentUserName,
            reviewed_at: new Date().toISOString()
          })
          .eq('id', requestId);

        if (error) throw error;

        alert('❌ 申请已拒绝');
        loadPermissionRequests('pending');

      } catch (err) {
        console.error('拒绝申请失败:', err);
        alert('❌ 操作失败：' + err.message);
      }
    };

    // 申请状态标签切换
    document.querySelectorAll('.tab[data-status]').forEach(tab => {
      tab.addEventListener('click', () => {
        const status = tab.getAttribute('data-status');
        document.querySelectorAll('.tab[data-status]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadPermissionRequests(status);
      });
    });

    // 初始加载
    loadGrantedPermissions();
  </script>
</body>
</html>
