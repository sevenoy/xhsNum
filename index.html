<style>
:root{
  --bg:#fff;--fg:#111418;--muted:#6e6e73;--line:#e5e5ea;--blue:#007aff;--blue-press:#0063cc;
  --cell:#fff;--cell-alt:#f5f5f7;
  --pad:6px;--colScale:1;--zebra:#eef5ff;
  --w-phone:160px;--w-owner:120px;--w-real:120px;--w-wx:160px;--w-xhs:340px;--w-note:220px;--w-cat:140px;
  --w-actions:220px;      /* 扩宽避免遮挡分类下拉 */
  --active:#3478F7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","Noto Sans CJK SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:12px}
h1{font-size:18px;font-weight:700;margin:0 0 8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input,select,button{height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#111;padding:0 10px}
input[type=file]{display:none}
button{background:var(--blue);border:none;color:#fff;padding:0 12px;cursor:pointer;transition:background .15s}
button.ghost{background:#f2f2f7;color:#000;border:1px solid var(--line)}
button:active{background:var(--blue-press)}
button.ghost.active{background:var(--active);color:#fff;border-color:var(--active)}
.badge{font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}
.panel{background:var(--cell);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:var(--pad) 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th{position:sticky;top:0;background:#f9f9fb;font-weight:600;z-index:2}
tbody.zebra tr:nth-child(even) td{ background: var(--zebra); }
td[contenteditable='true']{background:transparent; outline:none}
td[contenteditable='true']:focus{background:var(--cell-alt); outline:1px solid var(--line)}
.status{font-size:12px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.rgbaChip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;height:32px}
.colorDot{width:14px;height:14px;border-radius:4px;border:1px solid #c9c9ce;display:inline-block}
th.col-phone, td.col-phone{ width: calc(var(--w-phone) * var(--colScale)); }
th.col-owner, td.col-owner{ width: calc(var(--w-owner) * var(--colScale)); }
th.col-real,  td.col-real{  width: calc(var(--w-real)  * var(--colScale)); }
th.col-wx,    td.col-wx{    width: calc(var(--w-wx)    * var(--colScale)); }
th.col-xhs,   td.col-xhs{   width: calc(var(--w-xhs)   * var(--colScale)); }
th.col-note,  td.col-note{  width: calc(var(--w-note)  * var(--colScale)); }
th.col-cat,   td.col-cat{   width: calc(var(--w-cat)   * var(--colScale)); }
th.col-act,   td.col-act{   width: calc(var(--w-actions) * var(--colScale)); }
#gridBody td select{width:100%;border:none;background:transparent;font:inherit;padding:0 4px;outline:none}
#cloudStatus{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);padding:4px 8px;font-size:12px;color:var(--muted)}
#cloudDot{width:10px;height:10px;border-radius:999px;background:#d9534f;display:inline-block}
#statusText b{color:#111}
#panelCategories .toolbar{margin-bottom:4px}
#catList{display:flex;flex-direction:column;gap:6px}
.catRow{display:grid;grid-template-columns:auto 1fr repeat(3,max-content);gap:8px;align-items:center}
.catRow .rgbaChip{height:auto}
.catRow button{height:28px;font-size:12px;padding:0 10px}
@media (max-width:768px){
  th,td{font-size:13px}
  .wrap{padding:8px}
}
@media (max-width:480px){
  .toolbar{gap:6px}
  input,select,button{height:30px;font-size:13px}
  #grid{font-size:13px}
}
@media (max-width:420px){
  #verifyStatus.badge, #cloudStatus{ height:26px; line-height:26px; padding:0 10px; font-size:12px; }
}
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
</style>

<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>XHSPHONE</h1></div>
    <div>
      <span id="verifyStatus" class="badge">未验证</span>
      <span id="cloudStatus"><i id="cloudDot"></i><span id="cloudText">离线</span></span>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input id="q" placeholder="搜索：任意关键词" style="flex:1 1 280px" />
      <select id="filterOwner"><option value="all">所属人：全部</option></select>
      <select id="filterWxReal"><option value="all">微信实名人：全部</option></select>

        <option value="order">排序：手动</option>
        <option value="owner">排序：所属人</option>
        <option value="wx_real">排序：微信实名人</option>
        <option value="phone">排序：电话号码</option>
        <option value="xhs_name">排序：小红书名称</option>
        <option value="row_color">排序：分类</option>
      </select>

      <!-- 顶部按钮 -->
      <button id="btnAdd">新增一行</button>
      <button id="btnImportCSV">导入数据</button>
      <button id="btnSaveCloud" class="ghost">保存云端</button>
      <button id="btnLoadCloud" class="ghost">云端加载</button>
      <button id="btnExportCSV" class="ghost">导出数据</button>
      <input id="csvFile" type="file" accept=".csv,text/csv" />
      <button id="btnExport" class="ghost" style="display:none">导出JSON</button>
      <button id="btnClearAll" class="ghost">清空全部</button>
      <button id="btnCategories" class="ghost">分类设置</button>
      <button id="btnView" class="ghost">显示尺寸</button>
      <button id="btnDebug" class="ghost">显示日志</button>
    </div>
    <div class="status" id="statusText">本地模式：不联网 · 支持 CSV 导入 / JSON 导出</div>
  </div>

  <div class="panel" style="overflow:auto;max-height:92vh">
    <div class="table-wrap">
      <table id="grid">
        <thead>
          <tr>
            <th class="col-phone">电话号码</th>
            <th class="col-owner">所属人</th>
            <th class="col-real">微信实名人</th>
            <th class="col-wx">对应微信名</th>
            <th class="col-xhs">小红书名称</th>
            <th class="col-note">备注</th>
            <th class="col-cat">分类</th>
            <th class="col-act">操作</th>
          </tr>
        </thead>
        <tbody id="gridBody" class="zebra"></tbody>
      </table>
    </div>
  </div>

  <!-- 分类设置 -->
  <div class="panel" id="panelCategories" style="display:none">
    <div class="toolbar" style="align-items:flex-start">
      <div class="rgbaChip">
        <span class="colorDot" id="catColorPreview"></span>
        <input id="catName" placeholder="分类名称，例如：Olina用" style="width:180px">
        <input id="catColor" type="color" value="#007aff" style="width:60px;padding:0 2px">
      </div>
      <button id="btnCatAdd">新增分类</button>
      <div class="status">设置后将改变<b>小红书名称</b>这一格的<strong>背景色</strong>（透明度 0.18）。</div>
    </div>
    <div id="catList"></div>
  </div>

  <!-- 显示与尺寸 -->
  <div class="panel" id="panelView" style="display:none">
    <div class="toolbar">
      <label>行高</label>
      <input id="rowPad" type="range" min="4" max="14" step="1" value="6" style="width:160px">
      <label>列宽缩放</label>
      <input id="colScale" type="range" min="0.7" max="1.4" step="0.05" value="1" style="width:160px">
      <label>隔行着色</label>
      <input id="zebraOn" type="checkbox" checked>
      <input id="zebraColor" type="color" value="#eef5ff">
      <button id="btnCompact" class="ghost">一键紧凑</button>
      <button id="btnResetSize" class="ghost">恢复默认</button>
    </div>
  </div>
</div>

<!-- Dexie（本地 IndexedDB）-->
<script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>

<script>
(() => {
  /* 配置（原来的 WORKER_URL 已废弃，云端改用 Supabase） */
  const WORKER_URL = 'https://xhsphone.sevenoy.workers.dev';
  const ACCESS_KEY  = 'xhs_ZO6dI5#yXGgLkubH_rzMZC@wyY%h6J-kc7XN4E^O';

  /* 工具 */
  const $  = (q, s=document)=>s.querySelector(q);
  const $$ = (q, s=document)=>Array.from(s.querySelectorAll(q));
  function hexToRgba(hex, a){
    hex=(hex||'').replace('#','');
    if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
    const r=parseInt(hex.slice(0,2),16)||255;
    const g=parseInt(hex.slice(2,4),16)||255;
    const b=parseInt(hex.slice(4,6),16)||255;
    return `rgba(${r},${g},${b},${a})`;
  }

  /* 视图 */
  const readView=()=>{ try{ return JSON.parse(localStorage.getItem('view_v6'))||{} }catch{ return {} } };
  const saveView=(v)=>localStorage.setItem('view_v6', JSON.stringify(v));
  function applyView(v){
    document.documentElement.style.setProperty('--pad', (v.pad??6)+'px');
    document.documentElement.style.setProperty('--colScale', (v.colScale??1));
    document.documentElement.style.setProperty('--zebra', v.zebraColor||'#eef5ff');
    const zebra = $('#gridBody');
    if (zebra){
      if (v.zebraOn!==false) zebra.classList.add('zebra');
      else zebra.classList.remove('zebra');
    }
  }

  /* 分类 */
  const DEFAULT_CATS=[
    {key:'enterprise', name:'企业号', color:'#ffd60a'},
    {key:'olina',      name:'Olina用', color:'#007aff'},
    {key:'jasper',     name:'嘉用',   color:'#af52de'},
    {key:'usable',     name:'可用',   color:'#34c759'}
  ];
  const readCats=()=>{ try{ return JSON.parse(localStorage.getItem('cats_v6'))||DEFAULT_CATS; }catch{ return DEFAULT_CATS; } };
  const saveCats=(c)=>localStorage.setItem('cats_v6', JSON.stringify(c));
  const catColorOf=(key)=>{ const c=readCats().find(x=>x.key===key); return c?c.color:null; };
  const catNameOf =(key)=>{ const c=readCats().find(x=>x.key===key); return c?c.name:''; };

  /* 本地 DB */
  const dbLocal=new Dexie('xhs_phone_sheet_v6');
  dbLocal.version(2).stores({
    rows:'id, order, phone, owner, wx_real, wx_name, xhs_name, note1, row_color, updated_at'
  });

  /* 行渲染 */
  function makeRowTr(r){
    const tr=document.createElement('tr');
    tr.dataset.id=r.id;
    tr.dataset.order=r.order||0;
    const bg = r.row_color ? hexToRgba(catColorOf(r.row_color)||'#ffffff', .18) : '';
    tr.innerHTML = `
      <td class="col-phone" contenteditable="true" data-k="phone">${r.phone||''}</td>
      <td class="col-owner" contenteditable="true" data-k="owner">${r.owner||''}</td>
      <td class="col-real"  contenteditable="true" data-k="wx_real">${r.wx_real||''}</td>
      <td class="col-wx"    contenteditable="true" data-k="wx_name">${r.wx_name||''}</td>
      <td class="col-xhs"   contenteditable="true" data-k="xhs_name" style="${bg?`background:${bg};`:''}">${r.xhs_name||''}</td>
      <td class="col-note"  contenteditable="true" data-k="note1">${r.note1||''}</td>
      <td class="col-cat">
        <select data-k="row_color"></select>
      </td>
      <td class="col-act">
        <div style="display:flex;gap:6px">
          <button data-act="up" class="ghost">上移</button>
          <button data-act="down" class="ghost">下移</button>
          <button data-act="del" class="ghost">删除</button>
        </div>
      </td>`;
    const sel = tr.querySelector('select[data-k="row_color"]');
    const cats = readCats();
    sel.innerHTML = `<option value="">无</option>` + cats.map(c=>`<option value="${c.key}">${c.name}</option>`).join('');
    sel.value = r.row_color || '';
    return tr;
  }

  /* 渲染 / 过滤 / 排序 */
  let state = {
    q:'',
    owner:'all',
    wxReal:'all',
    sortBy:'order'
  };

  async function getAllRows(){
    return await dbLocal.rows.orderBy('order').toArray();
  }

  function applyFilters(all){
    let rows = [...all];
    if (state.owner !== 'all') rows = rows.filter(r=>r.owner===state.owner);
    if (state.wxReal !== 'all') rows = rows.filter(r=>r.wx_real===state.wxReal);
    if (state.q){
      const q = state.q.toLowerCase();
      rows = rows.filter(r=>{
        return Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)) ||
               (r.row_color && catNameOf(r.row_color).toLowerCase().includes(q));
      });
    }
    switch(state.sortBy){
      case 'owner': rows.sort((a,b)=>String(a.owner||'').localeCompare(String(b.owner||''),'zh-CN')); break;
      case 'wx_real': rows.sort((a,b)=>String(a.wx_real||'').localeCompare(String(b.wx_real||''),'zh-CN')); break;
      case 'phone': rows.sort((a,b)=>String(a.phone||'').localeCompare(String(b.phone||''),'zh-CN')); break;
      case 'xhs_name': rows.sort((a,b)=>String(a.xhs_name||'').localeCompare(String(b.xhs_name||''),'zh-CN')); break;
      case 'row_color': rows.sort((a,b)=>catNameOf(a.row_color||'').localeCompare(catNameOf(b.row_color||''),'zh-CN')); break;
      default: rows.sort((a,b)=>(a.order||0)-(b.order||0)); break;
    }
    return rows;
  }

  async function refreshFilters(){
    const all = await getAllRows();
    const owners=[...new Set(all.map(r=>r.owner).filter(Boolean))];
    const reals=[...new Set(all.map(r=>r.wx_real).filter(Boolean))];

    const oSel=$('#filterOwner'); const saveO=oSel.value;
    oSel.innerHTML='<option value="all">所属人：全部</option>'+owners.map(v=>`<option value="${v}">${v}</option>`).join('');
    oSel.value = owners.includes(saveO)?saveO:'all';

    const wSel=$('#filterWxReal'); const saveW=wSel.value;
    wSel.innerHTML='<option value="all">微信实名人：全部</option>'+reals.map(v=>`<option value="${v}">${v}</option>`).join('');
    wSel.value = reals.includes(saveW)?saveW:'all';
  }

  async function renderTable(){
    const all = await getAllRows();
    const body = $('#gridBody');
    const rows = await applyFilters(all);
    body.innerHTML='';
    if (!rows.length){
      const tr=document.createElement('tr');
      const td=document.createElement('td');
      td.colSpan=8;
      td.style.textAlign='center';
      td.style.color='#6e6e73';
      td.textContent='暂无数据，点击“新增一行”添加账号';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }
    rows.forEach(r=>{
      const tr = makeRowTr(r);
      body.appendChild(tr);
    });
  }

  async function updateRow(id, patch){
    const row = await dbLocal.rows.get(id);
    if (!row) return;
    const next = {...row, ...patch, updated_at:new Date().toISOString()};
    await dbLocal.rows.put(next);
  }

  async function addRow(){
    const all = await getAllRows();
    const maxOrder = all.reduce((m,r)=>Math.max(m, r.order||0), 0);
    const id = Date.now().toString() + Math.random().toString(16).slice(2);
    await dbLocal.rows.add({
      id,
      order:maxOrder+1,
      phone:'',
      owner:'',
      wx_real:'',
      wx_name:'',
      xhs_name:'',
      note1:'',
      row_color:'',
      updated_at:new Date().toISOString()
    });
    await refreshFilters();
    await renderTable();
  }

  async function deleteRowById(id){
    await dbLocal.rows.delete(id);
    await refreshFilters();
    await renderTable();
  }

  async function moveRow(id, dir){
    const all = await getAllRows();
    const list = await applyFilters(all);
    const idx = list.findIndex(r=>r.id===id);
    if (idx<0) return;
    const targetIdx = dir==='up'?idx-1:idx+1;
    if (targetIdx<0 || targetIdx>=list.length) return;
    const a = list[idx];
    const b = list[targetIdx];
    const oldOrderA = a.order||0;
    const oldOrderB = b.order||0;
    await dbLocal.rows.update(a.id, {order: oldOrderB});
    await dbLocal.rows.update(b.id, {order: oldOrderA});
    await refreshFilters();
    await renderTable();
  }

  /* CSV 导入导出（简易） */
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if (!lines.length) return [];
    const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    return lines.slice(1).map(line=>{
      const cols = line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
      const obj={};
      headers.forEach((h,i)=>{ obj[h]=cols[i]||''; });
      return obj;
    });
  }

  function toCSV(rows){
    const headers=['phone','owner','wx_real','wx_name','xhs_name','note1','row_color'];
    const lines=[headers.join(',')];
    rows.forEach(r=>{
      lines.push(headers.map(h=>`"${(r[h]||'').replace(/"/g,'""')}"`).join(','));
    });
    return lines.join('\n');
  }

  /* 云端（Supabase 版本） */
  const SUPABASE_TABLE = 'xhsphone_snapshot';
  const SUPABASE_KEY = 'default';

  function setCloudStatus(ok, text){
    const d = $('#cloudDot'), t = $('#cloudText');
    if (d) d.style.background = ok ? '#34c759' : '#d9534f';
    if (t) t.textContent = text || (ok ? '云端已连接' : '离线');
  }

  // 从 Supabase 读取 { rows, cats, view } 快照
  window.cloudLoad = async function(){
    try{
      const client = window.supabaseClient;
      if (!client){
        setCloudStatus(false, '未初始化');
        alert('Supabase 客户端未就绪');
        return null;
      }
      const { data, error } = await client
        .from(SUPABASE_TABLE)
        .select('payload')
        .eq('key', SUPABASE_KEY)
        .maybeSingle();

      if (error){
        console.error('云端读取失败:', error);
        setCloudStatus(false, '读取失败');
        alert('云端读取失败：' + (error.message || '未知错误'));
        return null;
      }
      if (!data || !data.payload){
        setCloudStatus(true, '无云端数据');
        alert('云端暂无数据');
        return null;
      }
      setCloudStatus(true, '云端已连接');
      return data.payload; // { rows, cats, view }
    }catch(e){
      console.error('云端读取异常:', e);
      setCloudStatus(false, '网络异常');
      alert('云端读取异常');
      return null;
    }
  };

  // 保存 { rows, cats, view } 到 Supabase
  window.cloudSave = async function(payload){
    try{
      const client = window.supabaseClient;
      if (!client){
        setCloudStatus(false, '未初始化');
        alert('Supabase 客户端未就绪');
        return false;
      }
      const { error } = await client
        .from(SUPABASE_TABLE)
        .upsert({
          key: SUPABASE_KEY,
          payload,
          updated_at: new Date().toISOString()
        });

      if (error){
        console.error('云端保存失败:', error);
        setCloudStatus(false, '保存失败');
        alert('云端保存失败：' + (error.message || '未知错误'));
        return false;
      }
      setCloudStatus(true, '已同步');
      alert('云端保存成功');
      return true;
    }catch(e){
      console.error('云端保存异常:', e);
      setCloudStatus(false, '网络异常');
      alert('云端保存异常');
      return false;
    }
  };

  /* 验证徽章（本地白名单） */
  (function(){
    function buf2hex(buffer){
      const bytes = new Uint8Array(buffer);
      return Array.prototype.map.call(bytes, x => ('00' + x.toString(16)).slice(-2)).join('');
    }
    async function sha256hex(str){
      const enc = new TextEncoder();
      const data = enc.encode(str);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return buf2hex(hash);
    }
    const PWD_SHA256 = '5bcbba0a49881aa3b1147bd26a19c94a71fde15a844c942515b107b399d6a4db';
    const WH_LOCAL_KEY = 'xhs_whitelist_v1';
    const WH_SESSION_KEY = 'xhs_whitelist_sess_v1';
    function findBadge(){
      let el=$('#verifyStatus');
      if(el) return el;
      const badges=$$('.badge');
      return badges.find(n=>['未验证','已验证白名单'].includes((n.textContent||'').trim()))||null;
    }
    function isWhite(){
      return sessionStorage.getItem(WH_SESSION_KEY)==='1' || localStorage.getItem(WH_LOCAL_KEY)==='1';
    }
    function setWhite(){
      try{ sessionStorage.setItem(WH_SESSION_KEY,'1'); }catch(e){}
      try{ localStorage.setItem(WH_LOCAL_KEY,'1'); }catch(e){}
    }
    function refresh(el){
      if (!el) return;
      if (isWhite()){
        el.textContent='已验证白名单';
        el.style.color='#34c759';
        el.style.borderColor='#34c759';
      }else{
        el.textContent='未验证';
        el.style.color='#ff3b30';
        el.style.borderColor='#ff3b30';
      }
    }
    function setup(){
      const el=findBadge();
      if(!el||el.__ok) return;
      el.__ok=true;
      refresh(el);
      el.style.cursor='pointer';
      el.title='点击输入密码加入白名单';
      el.addEventListener('click', async ()=>{
        const pwd = prompt('请输入白名单密码：');
        if(!pwd) return;
        const h = await sha256hex(pwd.trim());
        if (h===PWD_SHA256){
          setWhite();
          refresh(el);
          alert('验证成功，本设备加入白名单');
        }else{
          alert('密码错误');
        }
      });
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      setup();
      setTimeout(setup,700);
    });
  })();

  /* 分类 UI */
  function renderCatList(){
    const cats=readCats(), box=$('#catList');
    box.innerHTML='';
    cats.forEach((c,idx)=>{
      const row=document.createElement('div');
      row.className='catRow';
      row.innerHTML=`
        <div class="rgbaChip">
          <span class="colorDot" style="background:${c.color}"></span>
          <span>${c.name}</span>
        </div>
        <span></span>
        <button class="ghost" data-act="up" data-key="${c.key}" ${idx===0?'disabled':''}>上移</button>
        <button class="ghost" data-act="down" data-key="${c.key}" ${idx===cats.length-1?'disabled':''}>下移</button>
        <button class="ghost" data-act="del" data-key="${c.key}">删除</button>
      `;
      box.appendChild(row);
    });
  }

  function bindEvents(){
    const qInput = $('#q');
    const ownerSel = $('#filterOwner');
    const realSel = $('#filterWxReal');
    const sortSel = $('#sortBy');

    qInput.addEventListener('input', async (e)=>{
      state.q = e.target.value.trim();
      await renderTable();
    });
    ownerSel.addEventListener('change', async (e)=>{
      state.owner = e.target.value;
      await renderTable();
    });
    realSel.addEventListener('change', async (e)=>{
      state.wxReal = e.target.value;
      await renderTable();
    });
    sortSel.addEventListener('change', async (e)=>{
      state.sortBy = e.target.value;
      await renderTable();
    });

    $('#btnAdd').addEventListener('click', addRow);

    $('#btnClearAll').addEventListener('click', async ()=>{
      if(!confirm('确定清空全部数据？此操作不可撤销。')) return;
      await dbLocal.rows.clear();
      await refreshFilters();
      await renderTable();
    });

    $('#btnImportCSV').addEventListener('click', ()=>{
      $('#csvFile').click();
    });
    $('#csvFile').addEventListener('change', async e=>{
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const arr = parseCSV(text);
      if (!arr.length){
        alert('CSV 内容为空或解析失败');
        return;
      }
      const all = await getAllRows();
      let orderBase = all.reduce((m,r)=>Math.max(m, r.order||0), 0);
      const now = Date.now();
      const rows = arr.map((r,idx)=>({
        id: (now+idx).toString(16),
        order: ++orderBase,
        phone:r.phone||'',
        owner:r.owner||'',
        wx_real:r.wx_real||'',
        wx_name:r.wx_name||'',
        xhs_name:r.xhs_name||'',
        note1:r.note1||'',
        row_color:r.row_color||'',
        updated_at:new Date().toISOString()
      }));
      await dbLocal.rows.bulkAdd(rows);
      await refreshFilters();
      await renderTable();
      alert(`已导入 ${rows.length} 行`);
      e.target.value='';
    });

    $('#btnExportCSV').addEventListener('click', async ()=>{
      const all = await getAllRows();
      const csv = toCSV(all);
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `xhsphone-${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      alert('已导出 CSV');
    });

    $('#btnExport').addEventListener('click', async ()=>{
      const rows = await getAllRows();
      const payload = {
        rows,
        cats: readCats(),
        view: readView(),
        ver:1,
        updated_at:new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `xhsphone-backup-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      alert('已导出 JSON');
    });

    $('#btnCategories').addEventListener('click', ()=>{
      const p = $('#panelCategories');
      const btn = $('#btnCategories');
      const show = p.style.display === 'none';
      p.style.display = show ? '' : 'none';
      btn.classList.toggle('active', show);
      if (show) renderCatList();
    });

    $('#btnView').addEventListener('click', ()=>{
      const p = $('#panelView');
      const btn = $('#btnView');
      const show = p.style.display === 'none';
      p.style.display = show ? '' : 'none';
      btn.classList.toggle('active', show);
    });

    $('#btnDebug').addEventListener('click', ()=>{
      const p = $('#panelDebug');
      const btn = $('#btnDebug');
      const show = p.style.display === 'none';
      p.style.display = show ? '' : 'none';
      btn.classList.toggle('active', show);
    });

    /* 分类表单 */
    $('#catColor').addEventListener('input', e=>{
      $('#catColorPreview').style.background = e.target.value;
    });
    $('#btnCatAdd').addEventListener('click', ()=>{
      const name = $('#catName').value.trim();
      const color = $('#catColor').value;
      if (!name){
        alert('请输入分类名称');
        return;
      }
      const key = name.toLowerCase().replace(/\s+/g,'_');
      const cats = readCats();
      if (cats.some(c=>c.key===key)){
        alert('已存在同名分类');
        return;
      }
      cats.push({key,name,color});
      saveCats(cats);
      $('#catName').value='';
      renderCatList();
      renderTable();
    });
    $('#catList').addEventListener('click', e=>{
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const key = btn.dataset.key;
      if (!key) return;
      let cats = readCats();
      const idx = cats.findIndex(c=>c.key===key);
      if (idx<0) return;
      const act = btn.dataset.act;
      if (act==='del'){
        if (!confirm('确定删除该分类？')) return;
        cats.splice(idx,1);
      }else if (act==='up' && idx>0){
        [cats[idx-1], cats[idx]] = [cats[idx], cats[idx-1]];
      }else if (act==='down' && idx<cats.length-1){
        [cats[idx+1], cats[idx]] = [cats[idx], cats[idx+1]];
      }
      saveCats(cats);
      renderCatList();
      renderTable();
    });

    /* 表格内事件 */
    $('#gridBody').addEventListener('blur', async e=>{
      const cell = e.target.closest('td[contenteditable][data-k]');
      if (!cell) return;
      const tr = cell.closest('tr');
      const id = tr.dataset.id;
      const k = cell.dataset.k;
      const v = cell.textContent.trim();
      await updateRow(id, {[k]:v});
      if (k==='row_color' || k==='xhs_name'){
        await renderTable();
      }
    }, true);

    $('#gridBody').addEventListener('change', async e=>{
      const sel = e.target.closest('select[data-k="row_color"]');
      if (!sel) return;
      const tr = sel.closest('tr');
      const id = tr.dataset.id;
      await updateRow(id, {row_color: sel.value});
      await renderTable();
    });

    $('#gridBody').addEventListener('click', async e=>{
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const tr = btn.closest('tr');
      const id = tr.dataset.id;
      const act = btn.dataset.act;
      if (act==='del'){
        if (!confirm('确定删除这一行？')) return;
        await deleteRowById(id);
      }else if (act==='up'){
        await moveRow(id, 'up');
      }else if (act==='down'){
        await moveRow(id, 'down');
      }
    });

    /* 视图控制 */
    const view = readView();
    $('#rowPad').value = view.pad ?? 6;
    $('#colScale').value = view.colScale ?? 1;
    $('#zebraOn').checked = view.zebraOn !== false;
    $('#zebraColor').value = view.zebraColor || '#eef5ff';

    $('#rowPad').addEventListener('input', e=>{
      const v = readView();
      v.pad = parseInt(e.target.value,10)||6;
      saveView(v);
      applyView(v);
    });
    $('#colScale').addEventListener('input', e=>{
      const v = readView();
      v.colScale = parseFloat(e.target.value)||1;
      saveView(v);
      applyView(v);
    });
    $('#zebraOn').addEventListener('change', e=>{
      const v = readView();
      v.zebraOn = e.target.checked;
      saveView(v);
      applyView(v);
    });
    $('#zebraColor').addEventListener('input', e=>{
      const v = readView();
      v.zebraColor = e.target.value;
      saveView(v);
      applyView(v);
    });
    $('#btnCompact').addEventListener('click', ()=>{
      const v = {pad:4,colScale:0.9,zebraOn:true,zebraColor:'#f5f5f7'};
      saveView(v);
      applyView(v);
      $('#rowPad').value=v.pad;
      $('#colScale').value=v.colScale;
      $('#zebraOn').checked=v.zebraOn;
      $('#zebraColor').value=v.zebraColor;
    });
    $('#btnResetSize').addEventListener('click', ()=>{
      const v = {pad:6,colScale:1,zebraOn:true,zebraColor:'#eef5ff'};
      saveView(v);
      applyView(v);
      $('#rowPad').value=v.pad;
      $('#colScale').value=v.colScale;
      $('#zebraOn').checked=v.zebraOn;
      $('#zebraColor').value=v.zebraColor;
    });

    /* 云端按钮绑定 */
    $('#btnSaveCloud').addEventListener('click', async ()=>{
      const rows = await getAllRows();
      const payload = {
        rows,
        cats: readCats(),
        view: readView(),
        ver:1,
        updated_at:new Date().toISOString()
      };
      await window.cloudSave(payload);
    });

    $('#btnLoadCloud').addEventListener('click', async ()=>{
      const data = await window.cloudLoad();
      if (!data) return;
      if (Array.isArray(data.rows)){
        await dbLocal.rows.clear();
        await dbLocal.rows.bulkAdd(data.rows);
      }
      if (Array.isArray(data.cats)){
        saveCats(data.cats);
      }
      if (data.view && typeof data.view==='object'){
        saveView(data.view);
        applyView(data.view);
        $('#rowPad').value = data.view.pad ?? 6;
        $('#colScale').value = data.view.colScale ?? 1;
        $('#zebraOn').checked = data.view.zebraOn !== false;
        $('#zebraColor').value = data.view.zebraColor || '#eef5ff';
      }
      await refreshFilters();
      await renderTable();
      alert('云端数据已加载到本地');
    });
  }

  document.addEventListener('DOMContentLoaded', async ()=>{
    applyView(readView());
    await refreshFilters();
    await renderTable();
    bindEvents();

    /* 连通性（Supabase 检测） */
    (async () => {
      try{
        const client = window.supabaseClient;
        if (!client){
          setCloudStatus(false, '未初始化');
          return;
        }
        const { error } = await client
          .from(SUPABASE_TABLE)
          .select('updated_at')
          .limit(1)
          .maybeSingle();
        if (error){
          console.warn('云端检测失败:', error);
          setCloudStatus(false, '连接失败');
        }else{
          setCloudStatus(true, '云端已连接');
        }
      }catch(e){
        console.warn('云端检测异常:', e);
        setCloudStatus(false, '离线');
      }
    })();
  });
})();
</script>

<!-- 调试日志容器 -->
<div class="panel" id="panelDebug" style="display:none"><div class="status" id="debug"></div></div>
