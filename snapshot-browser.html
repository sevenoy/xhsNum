<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>快照浏览器 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-touch-icon.png?v=20251107">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="icon" type="image/x-icon" href="./icon/favicon.ico?v=20251107">
  <link rel="shortcut icon" href="./icon/favicon.ico?v=20251107">
  <link rel="manifest" href="./site.webmanifest">
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1990FF" />
  <meta name="apple-mobile-web-app-title" content="快照浏览器" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon/icon-192.png?v=20251107">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon/icon-512.png?v=20251107">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: #f5f5f7;
    }
    .browser-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .header h1 {
      font-size: 28px;
      color: #1990FF;
      margin: 0;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 24px;
      border-radius: 999px;
      cursor: pointer;
      background: white;
      border: 2px solid #e5e5ea;
      font-weight: 500;
      transition: all 0.3s;
    }
    .tab:hover {
      border-color: #1990FF;
    }
    .tab.active {
      background: #1990FF;
      color: white;
      border-color: #1990FF;
    }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-box input {
      flex: 1;
      min-width: 200px;
    }
    .snapshot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .snapshot-card {
      background: white;
      border: 2px solid #e5e5ea;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .snapshot-card:hover {
      border-color: #1990FF;
      box-shadow: 0 4px 12px rgba(25, 144, 255, 0.15);
      transform: translateY(-2px);
    }
    .snapshot-card.shared {
      background: linear-gradient(135deg, #f0fff4 0%, #ffffff 100%);
      border-color: #34c759;
    }
    .snapshot-card.shared:hover {
      border-color: #34c759;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.15);
    }
    .snapshot-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .snapshot-title {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      flex: 1;
    }
    .snapshot-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: #e3f2fd;
      color: #1976d2;
      white-space: nowrap;
      margin-left: 8px;
    }
    .snapshot-badge.shared {
      background: #d4edda;
      color: #155724;
    }
    .snapshot-meta {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    .snapshot-meta-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .snapshot-meta-label {
      color: #888;
    }
    .snapshot-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
    }
    .btn-small {
      flex: 1;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      min-width: 0;
    }
    .btn-load {
      background: #1990FF;
      color: white;
    }
    .btn-load:hover {
      background: #1478d7;
    }
    .btn-preview {
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .btn-preview:hover {
      background: #e8e8ed;
    }
    .btn-delete {
      background: #FF0000;
      color: #fff;
    }
    .btn-delete:hover {
      background: #e10000;
    }
    /* 手机端优化 */
    @media (max-width: 768px) {
      .browser-container {
        padding: 12px;
      }
      .header {
        padding: 12px 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .header h1 {
        font-size: 20px;
      }
      .header > div {
        width: 100%;
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        align-items: center;
      }
      .header > div > button {
        flex-shrink: 0;
      }
      .header > div > label {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 12px;
      }
      .header button {
        font-size: 12px;
        padding: 6px 12px;
      }
      .stats-bar {
        padding: 12px 16px;
        gap: 12px;
        flex-wrap: nowrap;
        justify-content: space-around;
      }
      .stat-item {
        flex: 1 1 auto;
        min-width: 0;
      }
      .stat-number {
        font-size: 20px;
      }
      .stat-label {
        font-size: 12px;
      }
      .tabs {
        gap: 6px;
        margin-bottom: 16px;
      }
      .tab {
        padding: 8px 16px;
        font-size: 13px;
      }
      .panel {
        padding: 16px;
      }
      .search-box {
        gap: 8px;
        margin-bottom: 16px;
      }
      .search-box input {
        font-size: 16px;
        padding: 8px 12px;
      }
      .snapshot-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .snapshot-card {
        padding: 16px;
      }
      .snapshot-title {
        font-size: 15px;
      }
      .snapshot-actions {
        flex-wrap: nowrap;
        gap: 6px;
        margin-top: 12px;
        padding-top: 12px;
      }
      .btn-small {
        flex: 1 1 auto;
        padding: 6px 8px;
        font-size: 11px;
        white-space: nowrap;
        min-width: 0;
      }
    }
    @media (max-width: 480px) {
      .browser-container {
        padding: 8px;
      }
      .header {
        padding: 10px 12px;
        margin-bottom: 16px;
      }
      .header h1 {
        font-size: 18px;
      }
      .header > div {
        flex-wrap: nowrap;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .header > div > button {
        flex-shrink: 0;
        font-size: 11px;
        padding: 6px 10px;
      }
      .header > div > label {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 11px;
      }
      .stats-bar {
        padding: 10px 12px;
        gap: 6px;
        flex-wrap: nowrap;
        justify-content: space-around;
      }
      .stat-item {
        flex: 1 1 auto;
        min-width: 0;
        justify-content: center;
        flex-direction: column;
        text-align: center;
      }
      .stat-number {
        font-size: 16px;
      }
      .stat-label {
        font-size: 11px;
      }
      .stat-number {
        font-size: 18px;
      }
      .tabs {
        gap: 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      .tab {
        padding: 6px 12px;
        font-size: 12px;
        flex-shrink: 0;
      }
      .panel {
        padding: 12px;
      }
      .snapshot-card {
        padding: 12px;
      }
      .snapshot-title {
        font-size: 14px;
      }
      .snapshot-actions {
        flex-wrap: nowrap;
        gap: 4px;
        margin-top: 10px;
        padding-top: 10px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .btn-small {
        flex: 0 0 auto;
        padding: 6px 10px;
        font-size: 10px;
        min-width: 60px;
      }
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: #1990FF;
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      padding: 16px 20px;
      background: #f9f9fb;
      border-radius: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-number {
      font-size: 24px;
      font-weight: 600;
      color: #1990FF;
    }
    .stat-label {
      font-size: 13px;
      color: #666;
    }
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .preview-content {
      background: white;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    .preview-close {
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
    }
    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .preview-table th,
    .preview-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    .preview-table th {
      background: #f9f9fb;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    /* 删除确认模态 */
    .confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .confirm-content {
      background: #fff;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    }
    .confirm-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary-danger {
      background: #FF0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="browser-container">
    <!-- 头部 -->
    <div class="header">
      <h1>📂 快照浏览器</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="ghost" id="btnRefresh" onclick="refreshSnapshots()">🔄 刷新</button>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666;">
          <input type="checkbox" id="autoRefresh" checked style="cursor: pointer;">
          自动刷新（10秒）
        </label>
      </div>
    </div>

    <!-- 统计栏 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-number" id="mySnapshotCount">0</div>
        <div class="stat-label">我的快照</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="sharedSnapshotCount">0</div>
        <div class="stat-label">授权快照</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="totalSnapshotCount">0</div>
        <div class="stat-label">总计</div>
      </div>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
      <div class="tab active" data-tab="all">全部快照</div>
      <div class="tab" data-tab="my">我的快照</div>
      <div class="tab" data-tab="shared">授权快照</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索快照名称、所有者...">
      <select id="sortBy">
        <option value="updated_at">按更新时间</option>
        <option value="name">按名称</option>
      </select>
    </div>

    <!-- 快照列表 -->
    <div id="snapshotGrid" class="snapshot-grid">
      <div class="loading-state">
        <div style="font-size: 32px; margin-bottom: 10px;">⏳</div>
        <div>加载中...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
    const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
    const SUPABASE_TABLE = "xhsphone_snapshot";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 检查登录
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      alert('请先登录');
      window.location.href = 'login.html';
    }

    const currentUserId = session.user.id;
    const currentUserName = localStorage.getItem('xhs_user_name') || '当前用户';
    const isAdmin = localStorage.getItem('xhs_is_admin') === 'true';

    let allSnapshots = [];
    let currentFilter = 'all';

    // 加载快照
    async function loadSnapshots() {
      const grid = document.getElementById('snapshotGrid');
      grid.innerHTML = '<div class="loading-state"><div style="font-size: 32px; margin-bottom: 10px;">⏳</div><div>加载中...</div></div>';

      try {
        // 查询所有可访问的快照
        const { data: snapshots, error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .select('key,payload,updated_at,owner_id')
          .order('updated_at', { ascending: false });

        if (error) throw error;

        if (!snapshots || snapshots.length === 0) {
          showEmptyState();
          return;
        }

        // 获取所有所有者信息
        const ownerIds = [...new Set(snapshots.map(s => s.owner_id).filter(Boolean))];
        let ownerMap = {};

        if (ownerIds.length > 0) {
          const { data: ownerProfiles } = await supabaseClient
            .from('user_profiles')
            .select('user_id, username')
            .in('user_id', ownerIds);

          if (ownerProfiles) {
            ownerProfiles.forEach(profile => {
              ownerMap[profile.user_id] = profile.username;
            });
          }
        }

        // 处理快照数据
        allSnapshots = snapshots.map(snapshot => {
          const ownerName = ownerMap[snapshot.owner_id] || '未知';
          const isMine = snapshot.owner_id === currentUserId;
          const name = snapshot.payload?.snapshot_label || snapshot.key;
          const rowCount = Array.isArray(snapshot.payload?.rows) ? snapshot.payload.rows.length : 0;
          const updatedBy = snapshot.payload?.updated_by_name || ownerName;

          return {
            ...snapshot,
            ownerName,
            isMine,
            displayName: name,
            rowCount,
            updatedBy
          };
        });

        updateStats();
        renderSnapshots();

      } catch (err) {
        console.error('加载快照失败:', err);
        grid.innerHTML = `<div class="empty-state">
          <div class="empty-state-icon">❌</div>
          <div>加载失败: ${err.message}</div>
        </div>`;
      }
    }

    // 更新统计
    function updateStats() {
      const mySnapshots = allSnapshots.filter(s => s.isMine);
      const sharedSnapshots = allSnapshots.filter(s => !s.isMine);

      document.getElementById('mySnapshotCount').textContent = mySnapshots.length;
      document.getElementById('sharedSnapshotCount').textContent = sharedSnapshots.length;
      document.getElementById('totalSnapshotCount').textContent = allSnapshots.length;
    }

    // 渲染快照列表
    function renderSnapshots() {
      const grid = document.getElementById('snapshotGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const sortBy = document.getElementById('sortBy').value;

      // 过滤
      let filtered = allSnapshots;
      if (currentFilter === 'my') {
        filtered = allSnapshots.filter(s => s.isMine);
      } else if (currentFilter === 'shared') {
        filtered = allSnapshots.filter(s => !s.isMine);
      }

      // 搜索
      if (searchTerm) {
        filtered = filtered.filter(s =>
          s.displayName.toLowerCase().includes(searchTerm) ||
          s.ownerName.toLowerCase().includes(searchTerm) ||
          s.key.toLowerCase().includes(searchTerm)
        );
      }

      // 排序
      filtered.sort((a, b) => {
        if (sortBy === 'updated_at') {
          return new Date(b.updated_at) - new Date(a.updated_at);
        } else if (sortBy === 'name') {
          return a.displayName.localeCompare(b.displayName);
        }
        return 0;
      });

      if (filtered.length === 0) {
        showEmptyState();
        return;
      }

      grid.innerHTML = filtered.map(snapshot => {
        const cardClass = snapshot.isMine ? '' : 'shared';
        const badge = snapshot.isMine ? '我的' : '授权';
        const badgeClass = snapshot.isMine ? '' : 'shared';
        const isDefault = snapshot.key === 'default';
        const displayName = isDefault ? (snapshot.isMine ? '📌 默认快照' : `📌 ${snapshot.ownerName}的默认快照`) : snapshot.displayName;
        
        return `
          <div class="snapshot-card ${cardClass}" data-key="${snapshot.key}">
            <div class="snapshot-header">
              <div class="snapshot-title">${escapeHtml(displayName)}</div>
              <div class="snapshot-badge ${badgeClass}">${badge}</div>
            </div>
            <div class="snapshot-meta">
              <div class="snapshot-meta-item">
                <span class="snapshot-meta-label">所有者</span>
                <span>${escapeHtml(snapshot.ownerName)}</span>
              </div>
              <div class="snapshot-meta-item">
                <span class="snapshot-meta-label">数据量</span>
                <span>${snapshot.rowCount} 条</span>
              </div>
              <div class="snapshot-meta-item">
                <span class="snapshot-meta-label">最后修改</span>
                <span>${escapeHtml(snapshot.updatedBy)}</span>
              </div>
              <div class="snapshot-meta-item">
                <span class="snapshot-meta-label">更新时间</span>
                <span>${formatTime(snapshot.updated_at)}</span>
              </div>
            </div>
            <div class="snapshot-actions">
              <button class="btn-small btn-load" onclick="loadSnapshot('${snapshot.key}')">
                📥 加载
              </button>
              <button class="btn-small btn-preview" onclick="previewSnapshot('${snapshot.key}')">
                👁️ 预览
              </button>
              ${snapshot.isMine ? `
              <button class="btn-small" style="background:#34c759;color:white;" onclick="grantSnapshotPermission('${snapshot.key}')">
                🔓 授权
              </button>
              ` : ''}
              ${(snapshot.isMine || isAdmin) ? `
              <button class="btn-small btn-delete" onclick="requestDeleteSnapshot('${snapshot.key}')">
                🗑️ 删除
              </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // 显示空状态
    function showEmptyState() {
      const grid = document.getElementById('snapshotGrid');
      const message = currentFilter === 'my' ? '您还没有创建快照' :
                      currentFilter === 'shared' ? '暂无授权快照' :
                      '暂无快照';
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📂</div>
          <div>${message}</div>
        </div>
      `;
    }

    // 加载快照
    window.loadSnapshot = async function(key) {
      if (!confirm('确定要加载此快照吗？\n\n⚠️ 本地数据将被覆盖！')) {
        return;
      }

      try {
        // 记录操作日志（忽略失败）
        try {
          await supabaseClient
            .from('operation_logs')
            .insert({
              action: 'load_snapshot',
              target: key,
              user_id: currentUserId,
              details: `加载快照 ${key}`,
              created_at: new Date().toISOString()
            });
        } catch (_) {}
        // 直接跳转到主页并传递快照key
        localStorage.setItem('xhs_load_snapshot_key', key);
        window.location.href = 'index.html';
      } catch (err) {
        console.error('加载快照失败:', err);
        alert('❌ 加载失败：' + err.message);
      }
    };

    // 预览快照
    window.previewSnapshot = async function(key) {
      try {
        const { data, error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .select('payload,owner_id')
          .eq('key', key)
          .single();

        if (error) throw error;

        // 记录操作日志（忽略失败）
        try {
          await supabaseClient
            .from('operation_logs')
            .insert({
              action: 'preview_snapshot',
              target: key,
              user_id: currentUserId,
              details: `预览快照 ${key}`,
              created_at: new Date().toISOString()
            });
        } catch (_) {}

        const rows = data.payload?.rows || [];
        const snapshot = allSnapshots.find(s => s.key === key);
        
        // 创建预览模态框
        const modal = document.createElement('div');
        modal.className = 'preview-modal';
        modal.innerHTML = `
          <div class="preview-content">
            <div class="preview-header">
              <div>
                <h2>${escapeHtml(snapshot.displayName)}</h2>
                <div style="color: #666; font-size: 14px;">所有者：${escapeHtml(snapshot.ownerName)} · ${rows.length} 条数据</div>
              </div>
              <button class="preview-close" onclick="this.closest('.preview-modal').remove()">关闭</button>
            </div>
            <div style="overflow-x: auto;">
              <table class="preview-table">
                <thead>
                  <tr>
                    <th>电话</th>
                    <th>所属人</th>
                    <th>微信实名人</th>
                    <th>微信名</th>
                    <th>小红书名称</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.slice(0, 50).map(row => `
                    <tr>
                      <td>${escapeHtml(row.phone || '')}</td>
                      <td>${escapeHtml(row.owner || '')}</td>
                      <td>${escapeHtml(row.wx_real || '')}</td>
                      <td>${escapeHtml(row.wx_name || '')}</td>
                      <td>${escapeHtml(row.xhs_name || '')}</td>
                      <td>${escapeHtml(row.note1 || '')}</td>
                    </tr>
                  `).join('')}
                  ${rows.length > 50 ? `
                    <tr>
                      <td colspan="6" style="text-align: center; color: #888;">
                        仅显示前50条数据，共 ${rows.length} 条
                      </td>
                    </tr>
                  ` : ''}
                </tbody>
              </table>
            </div>
          </div>
        `;
        
        document.body.appendChild(modal);
        
        // 点击背景关闭
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.remove();
          }
        });

      } catch (err) {
        console.error('预览失败:', err);
        alert('❌ 预览失败：' + err.message);
      }
    };

    // 删除确认模态
    function openConfirmModal(message, onConfirm) {
      const modal = document.createElement('div');
      modal.className = 'confirm-modal';
      modal.innerHTML = `
        <div class="confirm-content">
          <div style="font-size:16px;color:#1d1d1f;">${message}</div>
          <div class="confirm-footer">
            <button class="btn-secondary" data-action="cancel">取消</button>
            <button class="btn-primary-danger" data-action="ok">确定</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      const cleanup = () => modal.remove();
      modal.addEventListener('click', (e) => {
        if (e.target === modal) cleanup();
      });
      modal.querySelector('[data-action="cancel"]').addEventListener('click', cleanup);
      modal.querySelector('[data-action="ok"]').addEventListener('click', async () => {
        try {
          await onConfirm();
        } finally {
          cleanup();
        }
      });
    }

    // 请求删除快照（弹出确认框）
    window.requestDeleteSnapshot = function(key) {
      openConfirmModal('确定要删除此快照吗？', async () => {
        await deleteSnapshot(key);
      });
    };

    // 执行删除快照（数据库删除 + 关联权限删除 + UI同步）
    async function deleteSnapshot(key) {
      try {
        // 加载状态
        showToast('⏳ 正在删除...');
        // 1) 删除快照记录
        const { error: delErr } = await supabaseClient
          .from(SUPABASE_TABLE)
          .delete()
          .eq('key', key);
        if (delErr) throw delErr;
        // 2) 删除关联权限（如果有）
        await supabaseClient
          .from('permissions')
          .delete()
          .eq('resource_type', 'snapshot')
          .eq('resource_id', key);
        // 3) 记录操作日志（忽略失败）
        try {
          await supabaseClient
            .from('operation_logs')
            .insert({
              action: 'delete_snapshot',
              target: key,
              user_id: currentUserId,
              details: `用户 ${currentUserName} 删除快照 ${key}`,
              created_at: new Date().toISOString()
            });
        } catch (e) {
          console.warn('操作日志写入失败（可忽略）:', e?.message || e);
        }
        // 4) 刷新列表
        await loadSnapshots();
        showToast('✅ 删除成功');
      } catch (err) {
        console.error('删除失败:', err);
        alert('❌ 删除失败：' + (err.message || String(err)));
      }
    }

    // 格式化时间
    function formatTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) return '刚刚';
      if (minutes < 60) return `${minutes} 分钟前`;
      if (hours < 24) return `${hours} 小时前`;
      if (days < 7) return `${days} 天前`;
      
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 标签页切换
    document.querySelectorAll('.tab[data-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        currentFilter = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderSnapshots();
      });
    });

    // 搜索
    document.getElementById('searchInput').addEventListener('input', () => {
      renderSnapshots();
    });

    // 排序
    document.getElementById('sortBy').addEventListener('change', () => {
      renderSnapshots();
    });

    // =========================================
    // 刷新功能
    // =========================================
    
    let autoRefreshInterval = null;
    
    // 手动刷新
    window.refreshSnapshots = function() {
      const btn = document.getElementById('btnRefresh');
      btn.disabled = true;
      btn.textContent = '⏳ 刷新中...';
      
      loadSnapshots().then(() => {
        btn.disabled = false;
        btn.textContent = '🔄 刷新';
        showToast('✅ 刷新完成');
      }).catch(() => {
        btn.disabled = false;
        btn.textContent = '🔄 刷新';
        showToast('❌ 刷新失败');
      });
    };
    
    // 自动刷新开关
    const autoRefreshCheckbox = document.getElementById('autoRefresh');
    autoRefreshCheckbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        // 开启自动刷新（10秒）
        autoRefreshInterval = setInterval(() => {
          console.log('🔄 自动刷新快照列表');
          loadSnapshots();
        }, 10000);
        showToast('✅ 已开启自动刷新（10秒）');
      } else {
        // 关闭自动刷新
        if (autoRefreshInterval) {
          clearInterval(autoRefreshInterval);
          autoRefreshInterval = null;
        }
        showToast('已关闭自动刷新');
      }
    });
    
    // 如果默认勾选，启动自动刷新
    if (autoRefreshCheckbox.checked) {
      autoRefreshInterval = setInterval(() => {
        console.log('🔄 自动刷新快照列表');
        loadSnapshots();
      }, 10000);
    }
    
    // 页面离开时清理定时器
    window.addEventListener('beforeunload', () => {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
    });
    
    // 授权快照给其他用户
    window.grantSnapshotPermission = async function(snapshotKey) {
      // 获取快照信息
      const snapshot = allSnapshots.find(s => s.key === snapshotKey);
      if (!snapshot) {
        alert('❌ 快照不存在');
        return;
      }
      
      // 弹窗输入授权信息
      const username = prompt(`🔓 授权快照：${snapshot.displayName}\n\n请输入要授权的用户名：`);
      if (!username) return;
      
      const permissionType = confirm('授予编辑权限？\n\n点击【确定】= 编辑权限（可查看和保存）\n点击【取消】= 查看权限（只能查看）') ? 'edit' : 'view';
      
      try {
        // 1. 查询用户
        const { data: userProfile, error: userError } = await supabaseClient
          .from('user_profiles')
          .select('user_id, username')
          .eq('username', username)
          .single();
        
        if (userError || !userProfile) {
          alert('❌ 用户不存在\n\n请检查用户名是否正确');
          return;
        }
        
        // 2. 检查是否已经授予过权限
        const { data: existingPermission } = await supabaseClient
          .from('permissions')
          .select('id, status, permission_type')
          .eq('resource_id', snapshotKey)
          .eq('resource_type', 'snapshot')
          .eq('user_id', userProfile.user_id)
          .maybeSingle();
        
        if (existingPermission) {
          if (existingPermission.status === 'active') {
            // 更新权限
            const { error: updateError } = await supabaseClient
              .from('permissions')
              .update({
                permission_type: permissionType,
                status: 'active'
              })
              .eq('id', existingPermission.id);
            
            if (updateError) throw updateError;
            showToast(`✅ 权限已更新为${permissionType === 'edit' ? '编辑' : '查看'}权限`);
          } else {
            // 重新激活
            const { error: updateError } = await supabaseClient
              .from('permissions')
              .update({
                permission_type: permissionType,
                status: 'active'
              })
              .eq('id', existingPermission.id);
            
            if (updateError) throw updateError;
            showToast('✅ 权限已重新激活');
          }
        } else {
          // 3. 授予新权限
          const { error } = await supabaseClient
            .from('permissions')
            .insert({
              resource_id: snapshotKey,
              resource_type: 'snapshot',
              user_id: userProfile.user_id,
              permission_type: permissionType,
              granted_by: currentUserId,
              granted_by_name: currentUserName,
              status: 'active'
            });
          
          if (error) throw error;
          
          const permText = permissionType === 'edit' ? '编辑' : '查看';
          showToast(`✅ 已授予 ${username} ${permText}权限`);
        }
        // 操作日志（忽略失败）
        try {
          await supabaseClient
            .from('operation_logs')
            .insert({
              action: 'permission_grant_via_browser',
              target: `${snapshotKey}:${userProfile.user_id}`,
              user_id: currentUserId,
              details: `在浏览器页授予 ${username} ${permissionType} 权限`,
              created_at: new Date().toISOString()
            });
        } catch (_) {}
        
      } catch (err) {
        console.error('授权失败:', err);
        alert('❌ 授权失败：' + err.message);
      }
    };
    
    // 显示提示消息
    function showToast(message) {
      // 创建提示元素
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 10000;
        animation: slideIn 0.3s ease;
      `;
      
      // 添加动画样式
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideIn {
          from { transform: translateX(400px); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(400px); opacity: 0; }
        }
      `;
      if (!document.querySelector('style[data-toast]')) {
        style.setAttribute('data-toast', 'true');
        document.head.appendChild(style);
      }
      
      document.body.appendChild(toast);
      
      // 3秒后淡出
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, 3000);
    }

    // 初始加载
    loadSnapshots();

    // 接入 Realtime：监听快照删除/新增/更新，实时同步
    try {
      const channel = supabaseClient
        .channel('realtime:snapshot')
        .on('postgres_changes', { event: '*', schema: 'public', table: SUPABASE_TABLE }, payload => {
          console.log('📡 Realtime 快照变更:', payload.eventType, payload);
          // 简单做法：收到任意变更时刷新列表，确保一致性
          loadSnapshots();
        })
        .subscribe((status) => {
          console.log('📡 Realtime 订阅状态:', status);
        });
      // 页面卸载时清理
      window.addEventListener('beforeunload', () => {
        try { supabaseClient.removeChannel(channel); } catch (_) {}
      });
    } catch (e) {
      console.warn('Realtime 订阅初始化失败:', e);
    }
  </script>
</body>
</html>
