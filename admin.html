<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>管理中心 - XHSPHONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { background:#f5f5f7; }
    .admin-wrap { max-width: 1400px; margin: 20px auto; padding: 20px; }
    .admin-header {
      display:flex; justify-content: space-between; align-items:center;
      background:#fff; border-radius:16px; padding:16px 20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }
    .nav {
      display:flex; gap:10px; flex-wrap:wrap; margin:20px 0;
      background:#fff; border-radius:12px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06);
    }
    .nav button {
      padding:8px 16px; border:none; border-radius:999px; cursor:pointer; background:#f5f5f7;
      font-weight:500;
    }
    .nav button.active { background:#1990FF; color:#fff; }
    .panel {
      background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06);
      overflow:hidden; height: calc(100vh - 220px);
    }
    .panel iframe { width:100%; height:100%; border:0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUPABASE_URL = localStorage.getItem("xhs_supabase_url");
      const SUPABASE_ANON_KEY = localStorage.getItem("xhs_supabase_anon_key");
      const { createClient } = supabase;
      const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await client.auth.getSession();
      if (!session) { alert('请先登录'); location.href='login.html'; return; }
      // 读取用户是否管理员：用户名为 sevenoy 或本地已标记管理员
      let isAdmin = localStorage.getItem('xhs_is_admin') === 'true';
      try {
        const { data: profile } = await client
          .from('user_profiles')
          .select('username')
          .eq('user_id', session.user.id)
          .maybeSingle();
        if (profile?.username && profile.username.toLowerCase() === 'sevenoy') {
          isAdmin = true;
        }
      } catch (_) {}
      // 控制导航可见性
      const btnApproval = document.getElementById('btnApproval');
      const btnUser = document.getElementById('btnUser');
      const btnPerm = document.getElementById('btnPerm');
      const btnSnap = document.getElementById('btnSnap');
      if (!isAdmin) {
        if (btnApproval) btnApproval.style.display = 'none';
        if (btnUser) btnUser.style.display = 'none';
        if (btnPerm) btnPerm.style.display = 'none';
      }
      // 默认打开：管理员→权限管理；普通用户→快照浏览器
      if (isAdmin) {
        switchModule('permission-management.html', btnPerm);
      } else {
        switchModule('snapshot-browser.html', btnSnap);
      }
    });
    function switchModule(url, el) {
      const frame = document.getElementById('adminFrame');
      frame.src = url;
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      // 高亮
      const map = {
        'permission-management.html':'btnPerm',
        'snapshot-browser.html':'btnSnap',
        'approval-management.html':'btnApproval',
        'user-management.html':'btnUser'
      };
      const id = map[url];
      if (id) document.getElementById(id).classList.add('active');
    }
  </script>
  </head>
<body>
  <div class="admin-wrap">
    <div class="admin-header">
      <h1 style="margin:0; color:#1990FF;">⚙️ 管理中心</h1>
      <button class="ghost" onclick="location.href='index.html'">返回主页</button>
    </div>
    <div class="nav">
      <button id="btnApproval" onclick="switchModule('approval-management.html', this)">📋 审核管理</button>
      <button id="btnUser" onclick="switchModule('user-management.html', this)">👥 用户管理</button>
      <button id="btnPerm" onclick="switchModule('permission-management.html', this)">🔐 权限管理</button>
      <button id="btnSnap" onclick="switchModule('snapshot-browser.html', this)">📂 快照浏览器</button>
    </div>
    <div class="panel">
      <iframe id="adminFrame" title="管理模块"></iframe>
    </div>
  </div>
</body>
</html>
