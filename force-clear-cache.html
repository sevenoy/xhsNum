<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>强制清除缓存</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      background: #f5f5f7;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      color: #1990FF;
      margin-top: 0;
    }
    button {
      background: #1990FF;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #1478d7;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9fb;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 强制清除缓存工具</h1>
    <p>如果页面没有更新到最新版本，请按以下步骤操作：</p>
    
    <button onclick="clearAllCache()">1. 清除所有缓存</button>
    <button onclick="unregisterSW()">2. 取消注册 Service Worker</button>
    <button onclick="reloadPage()">3. 重新加载页面</button>
    <button onclick="doAll()">一键执行所有操作</button>
    
    <div id="result"></div>
  </div>

  <script>
    async function clearAllCache() {
      const result = document.getElementById('result');
      result.textContent = '正在清除缓存...';
      result.className = 'result';
      
      try {
        // 清除所有缓存
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => {
          console.log('删除缓存:', name);
          return caches.delete(name);
        }));
        
        result.textContent = `✅ 已清除 ${cacheNames.length} 个缓存:\n${cacheNames.join('\n')}`;
        result.className = 'result success';
      } catch (err) {
        result.textContent = `❌ 清除缓存失败: ${err.message}`;
        result.className = 'result error';
      }
    }

    async function unregisterSW() {
      const result = document.getElementById('result');
      result.textContent = '正在取消注册 Service Worker...';
      result.className = 'result';
      
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => {
            console.log('取消注册 Service Worker:', reg.scope);
            return reg.unregister();
          }));
          
          result.textContent = `✅ 已取消注册 ${registrations.length} 个 Service Worker`;
          result.className = 'result success';
        } else {
          result.textContent = '⚠️ 浏览器不支持 Service Worker';
          result.className = 'result';
        }
      } catch (err) {
        result.textContent = `❌ 取消注册失败: ${err.message}`;
        result.className = 'result error';
      }
    }

    function reloadPage() {
      const result = document.getElementById('result');
      result.textContent = '正在重新加载页面...';
      result.className = 'result';
      
      setTimeout(() => {
        window.location.reload(true);
      }, 1000);
    }

    async function doAll() {
      await clearAllCache();
      await new Promise(resolve => setTimeout(resolve, 500));
      await unregisterSW();
      await new Promise(resolve => setTimeout(resolve, 500));
      reloadPage();
    }

    // 页面加载时显示当前缓存信息
    window.addEventListener('load', async () => {
      const result = document.getElementById('result');
      try {
        const cacheNames = await caches.keys();
        const registrations = 'serviceWorker' in navigator 
          ? await navigator.serviceWorker.getRegistrations() 
          : [];
        
        result.textContent = `当前状态:\n- 缓存数量: ${cacheNames.length}\n- Service Worker 数量: ${registrations.length}\n\n点击上面的按钮开始清除。`;
        result.className = 'result';
      } catch (err) {
        result.textContent = `获取状态失败: ${err.message}`;
        result.className = 'result error';
      }
    });
  </script>
</body>
</html>
